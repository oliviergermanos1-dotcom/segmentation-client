name: AGL BUDGET — pipeline tests

on:
  push:
    branches: [main, claude/**]
    paths:
      - "agl-budget/**"
      - ".github/workflows/agl-budget.yml"
  pull_request:
    paths:
      - "agl-budget/**"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agl-budget/python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install poppler-utils (pour 10_extract_pnd)
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

  js-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agl-budget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Vérifier la syntaxe des modules JS
        run: |
          for f in js/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
