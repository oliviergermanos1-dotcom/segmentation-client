  details > summary { cursor:pointer; user-select:none; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .insight-box { background: linear-gradient(to right, #fef3c7, #fef9e7); border-left: 4px solid #c9a14a; padding: 12px 14px; border-radius: 6px; font-size: 13px; margin: 10px 0; }

<script type="text/babel" data-presets="env,react">
const { useState, useMemo, useCallback, useEffect, useRef } = React;

// ============================================================
// CONFIGURATION : SCHÉMAS PAR MÉTIER
// ============================================================
const METIER_SCHEMAS = {
  IMPORT_MARITIME: {
    key: "IMPORT_MARITIME", label: "Import Maritime", icon: "⬇🚢",
    clientField: "Destinataire", clientLabel: "Destinataire",
    counterpartField: "Chargeur", counterpartLabel: "Chargeur",
    teuField: "NOMBRE_TEU", weightField: "POIDS_MARCHANDISE", blField: "Numéro BL",
    yearField: "Année escale", monthField: "Mois escale",
    portChargementField: "Port de chargement", portDechargementField: "Port de déchargement",
    paysOrigineField: "Pays de prise en charge", paysDestField: "Pays de livraison",
    lieuLivraisonField: "Lieu de livraison", marchandiseField: "Libellé marchandise",
    transitaireField: "Transitaire", armateurField: "Armateur escale",
    consignataireField: "Consignataire", conditField: "CODE_CONDIT", modeExpField: "CODE_MODE_EXPEDITION",
    verticalField: "vertical_destinataire", statutField: "statut_destinataire", commercialField: "commercial_destinataire",
    qualifField: "Qualifié?", type: "maritime", sens: "import"
  },
  EXPORT_MARITIME: {
    key: "EXPORT_MARITIME", label: "Export Maritime", icon: "⬆🚢",
    clientField: "Chargeur", clientLabel: "Chargeur",
    counterpartField: "Destinataire", counterpartLabel: "Destinataire",
    teuField: "NOMBRE_TEU", weightField: "POIDS_MARCHANDISE", blField: "Numéro BL",
    yearField: "Année escale", monthField: "Mois escale",
    portChargementField: "Port de chargement", portDechargementField: "Port de déchargement",
    paysOrigineField: "Pays de prise en charge", paysDestField: "Pays de livraison",
    lieuLivraisonField: "Lieu de livraison", marchandiseField: "Libellé marchandise",
    transitaireField: "Transitaire", armateurField: "Armateur escale",
    consignataireField: "Consignataire", conditField: "CODE_CONDIT", modeExpField: "CODE_MODE_EXPEDITION",
    verticalField: "vertical_chargeur", statutField: "statut_chargeur", commercialField: "commercial_chargeur",
    qualifField: "Qualifié?", type: "maritime", sens: "export"
  },
  IMPORT_AERIEN: {
    key: "IMPORT_AERIEN", label: "Import Aérien", icon: "⬇✈",
    clientField: "Destinataire", clientLabel: "Destinataire",
    counterpartField: "Chargeur", counterpartLabel: "Chargeur",
    teuField: null, weightField: "Poids marchandise", blField: "Numéro LTA",
    yearField: "Année escale", monthField: "Mois escale",
    portChargementField: "Aéroport chargement", portDechargementField: "Aéroport déchargement",
    paysOrigineField: null, paysDestField: null, lieuLivraisonField: null,
    marchandiseField: "Marchandise", transitaireField: "Transitaire", armateurField: "Compagnie",
    consignataireField: null, conditField: null, modeExpField: null,
    verticalField: "vertical_chargeur", statutField: "statut_chargeur", commercialField: "commercial_chargeur",
    qualifField: "qualifie", type: "aerien", sens: "import"
  },
  EXPORT_AERIEN: {
    key: "EXPORT_AERIEN", label: "Export Aérien", icon: "⬆✈",
    clientField: "Chargeur", clientLabel: "Chargeur",
    counterpartField: "Destinataire", counterpartLabel: "Destinataire",
    teuField: null, weightField: "Poids marchandise", blField: "Numéro LTA",
    yearField: "Année escale", monthField: "Mois escale",
    portChargementField: "Aéroport chargement", portDechargementField: "Aéroport déchargement",
    paysOrigineField: null, paysDestField: null, lieuLivraisonField: null,
    marchandiseField: "Marchandise", transitaireField: "Transitaire", armateurField: "Compagnie",
    consignataireField: null, conditField: null, modeExpField: null,
    verticalField: "vertical_chargeur", statutField: "statut_chargeur", commercialField: "commercial_chargeur",
    qualifField: "qualifie", type: "aerien", sens: "export"
  }
};
const METIER_KEYS = Object.keys(METIER_SCHEMAS);

// ============================================================
// HELPERS
// ============================================================
const fmt = (n, dec=0) => {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Number(n).toLocaleString("fr-FR", {minimumFractionDigits: dec, maximumFractionDigits: dec});
};
const pct = (n, total) => total > 0 ? (n/total*100).toFixed(1) + " %" : "—";
const safeStr = (v) => v === null || v === undefined ? "" : String(v).trim();
const numVal = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };

function detectMetierKey(rows) {
  if (!rows.length) return null;
  const headers = Object.keys(rows[0]).map(x => x.toLowerCase());
  const has = (kw) => headers.some(x => x.includes(kw));
  const isAerien = has("aéroport") || has("aeroport") || has("compagnie") || has("numéro lta") || has("numero lta") || has("lta");
  let sens = null;
  const sample = rows.slice(0, Math.min(500, rows.length));
  if (rows[0].hasOwnProperty("I_IMP_E_EXP")) {
    const counts = {};
    sample.forEach(r => { const v = safeStr(r.I_IMP_E_EXP).toUpperCase(); counts[v] = (counts[v]||0)+1; });
    const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
    if (top) { if (top[0]==="I") sens="import"; else if (top[0]==="E") sens="export"; }
  } else if (rows[0].hasOwnProperty("Sens")) {
    const counts = {};
    sample.forEach(r => { const v = safeStr(r.Sens).toUpperCase(); counts[v] = (counts[v]||0)+1; });
    const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
    if (top) { if (top[0].startsWith("I")) sens="import"; else if (top[0].startsWith("E")) sens="export"; }
  }
  if (isAerien) return sens === "export" ? "EXPORT_AERIEN" : "IMPORT_AERIEN";
  return sens === "export" ? "EXPORT_MARITIME" : "IMPORT_MARITIME";
}

function getFilterableColumns(schema) {
  return [
    { field: schema.yearField, label: "Année" },
    { field: schema.monthField, label: "Mois" },
    { field: schema.clientField, label: schema.clientLabel, search: true },
    { field: schema.counterpartField, label: schema.counterpartLabel, search: true },
    { field: schema.transitaireField, label: "Transitaire", search: true },
    { field: schema.armateurField, label: schema.type === "maritime" ? "Armateur" : "Compagnie", search: true },
    { field: schema.paysOrigineField, label: "Pays origine", search: true },
    { field: schema.paysDestField, label: "Pays destination", search: true },
    { field: schema.portChargementField, label: schema.type === "maritime" ? "Port chargement" : "Aéroport chargement", search: true },
    { field: schema.portDechargementField, label: schema.type === "maritime" ? "Port déchargement" : "Aéroport déchargement", search: true },
    { field: schema.lieuLivraisonField, label: "Lieu livraison", search: true },
    { field: schema.marchandiseField, label: "Marchandise", search: true },
    { field: schema.conditField, label: "Conditionnement" },
    { field: schema.modeExpField, label: "Mode expédition" },
    { field: schema.consignataireField, label: "Consignataire", search: true },
    { field: schema.verticalField, label: "Vertical CRM" },
    { field: schema.statutField, label: "Statut client" },
    { field: schema.commercialField, label: "Commercial" },
    { field: schema.qualifField, label: "Qualifié" }
  ].filter(c => c.field);
}

// ============================================================
// MOTEUR D'ANALYSE — calcule tous les agrégats du rapport
// ============================================================
function buildAnalysis(rows, schema) {
  const A = { schema };
  if (!rows.length) {
    return { ...A, empty: true, nbBL: 0, nbRows: 0, totalTEU: 0, totalWeight: 0,
      nbClients: 0, nbTransitaires: 0, nbArmateurs: 0, nbPaysOrigine: 0, nbPaysDest: 0, nbMarchandises: 0,
      topClients: [], topCounterparts: [], topTransitaires: [], topArmateurs: [],
      topPaysOrigine: [], topPaysDest: [], topMarchandises: [], topPortsCharg: [], topPortsDech: [], topLieuxLiv: [],
      byCondit: [], byModeExp: [], byVertical: [], byStatut: [],
      tempo: [], byYear: [], paretoClients: [], top5Share: 0, top10Share: 0 };
  }
  const blSet = new Set();
  let totalTEU = 0, totalWeight = 0;
  for (const r of rows) { 
    const bl = safeStr(r[schema.blField]); 
    if (bl) blSet.add(bl);
    if (schema.teuField) totalTEU += numVal(r[schema.teuField]);
    totalWeight += numVal(r[schema.weightField]);
  }
  A.nbBL = blSet.size;
  A.nbRows = rows.length;
  A.totalTEU = totalTEU;
  A.totalWeight = totalWeight;

  const distinctOf = (field) => {
    if (!field) return 0;
    const s = new Set();
    for (const r of rows) { const v = safeStr(r[field]); if (v) s.add(v); }
    return s.size;
  };
  A.nbClients = distinctOf(schema.clientField);
  A.nbTransitaires = distinctOf(schema.transitaireField);
  A.nbArmateurs = distinctOf(schema.armateurField);
  A.nbPaysOrigine = distinctOf(schema.paysOrigineField);
  A.nbPaysDest = distinctOf(schema.paysDestField);
  A.nbMarchandises = distinctOf(schema.marchandiseField);

  // Détecte si une valeur doit être exclue (vide, blanc, placeholder typique)
  function isEmptyValue(v) {
    if (v === null || v === undefined) return true;
    const s = String(v).trim().toLowerCase();
    if (s === "") return true;
    if (s === "n/a" || s === "na" || s === "null" || s === "undefined") return true;
    if (s === "(non renseigné)" || s === "non renseigné" || s === "non renseigne") return true;
    if (s === "(non renseignée)" || s === "non renseignée" || s === "non renseignee") return true;
    if (s === "-" || s === "--" || s === ".") return true;
    return false;
  }

  function aggBy(field, opts = {}) {
    if (!field) return [];
    const map = new Map();
    const blSeen = new Map();
    for (const r of rows) {
      const raw = r[field];
      if (isEmptyValue(raw)) continue;  // ← on saute les vides
      const key = safeStr(raw);
      const bl = safeStr(r[schema.blField]);
      let m = map.get(key);
      if (!m) { m = { key, teu: 0, weight: 0, rows: 0 }; map.set(key, m); blSeen.set(key, new Set()); }
      if (schema.teuField) m.teu += numVal(r[schema.teuField]);
      m.weight += numVal(r[schema.weightField]);
      m.rows += 1;
      if (bl) blSeen.get(key).add(bl);
    }
    const arr = Array.from(map.values()).map(m => ({ ...m, bl: blSeen.get(m.key).size }));
    arr.sort((a, b) => {
      if (opts.sortBy === "bl") return b.bl - a.bl;
      if (opts.sortBy === "weight") return b.weight - a.weight;
      return (b.teu || 0) - (a.teu || 0) || b.weight - a.weight || b.bl - a.bl;
    });
    return arr;
  }

  const primarySort = schema.teuField ? "teu" : "weight";
  A.topClients = aggBy(schema.clientField, { sortBy: primarySort }).slice(0, 20);
  A.topCounterparts = aggBy(schema.counterpartField, { sortBy: primarySort }).slice(0, 20);
  A.topTransitaires = aggBy(schema.transitaireField, { sortBy: primarySort }).slice(0, 15);
  A.topArmateurs = aggBy(schema.armateurField, { sortBy: primarySort }).slice(0, 15);
  A.topPaysOrigine = aggBy(schema.paysOrigineField, { sortBy: "bl" }).slice(0, 30);
  A.topPaysDest = aggBy(schema.paysDestField, { sortBy: "bl" }).slice(0, 30);
  A.topMarchandises = aggBy(schema.marchandiseField, { sortBy: primarySort }).slice(0, 15);
  A.topPortsCharg = aggBy(schema.portChargementField, { sortBy: "bl" }).slice(0, 10);
  A.topPortsDech = aggBy(schema.portDechargementField, { sortBy: "bl" }).slice(0, 10);
  A.topLieuxLiv = aggBy(schema.lieuLivraisonField, { sortBy: primarySort }).slice(0, 30);
  A.byCondit = aggBy(schema.conditField, { sortBy: "bl" });
  A.byModeExp = aggBy(schema.modeExpField, { sortBy: "bl" });
  A.byVertical = aggBy(schema.verticalField, { sortBy: primarySort });
  A.byStatut = aggBy(schema.statutField, { sortBy: primarySort });

  // ============================================================
  // SEGMENTATION MARCHANDISES : CONTENEURISÉ (TEU) vs CONVENTIONNEL (TONNES)
  // Règle métier AGL :
  //   - Conteneurisé : 20F, 20S, 20TOP, 40F, 40S, 40TOP, FLTANK, TANK
  //   - Conventionnel/Vrac : BRBK, SACS, CARS, RORO, VRAC
  // ============================================================
  const CONTENEURISE_CODES = new Set(["20F","20S","20TOP","40F","40S","40TOP","FLTANK","TANK"]);
  const CONVENTIONNEL_CODES = new Set(["BRBK","SACS","CARS","RORO","VRAC"]);
  const classifyCondit = (code) => {
    if (!code) return null;
    const s = String(code).trim().toUpperCase();
    if (CONTENEURISE_CODES.has(s)) return "CONTENEURISE";
    if (CONVENTIONNEL_CODES.has(s)) return "CONVENTIONNEL";
    return "AUTRE";
  };

  if (schema.conditField) {
    // Agrégats globaux par segment
    const segments = { CONTENEURISE: { bl: new Set(), teu: 0, weight: 0, rows: 0 },
                       CONVENTIONNEL: { bl: new Set(), teu: 0, weight: 0, rows: 0 },
                       AUTRE: { bl: new Set(), teu: 0, weight: 0, rows: 0 } };
    // Marchandises par segment (Map "march" → { bl:Set, teu, weight })
    const marchByCont = new Map();
    const marchByConv = new Map();
    for (const r of rows) {
      const seg = classifyCondit(r[schema.conditField]);
      if (!seg) continue;
      const s = segments[seg];
      s.rows += 1;
      if (schema.teuField) s.teu += numVal(r[schema.teuField]);
      s.weight += numVal(r[schema.weightField]);
      const bl = safeStr(r[schema.blField]); if (bl) s.bl.add(bl);
      // Détail marchandises
      const rawM = r[schema.marchandiseField];
      if (!isEmptyValue(rawM)) {
        const mKey = safeStr(rawM);
        const targetMap = seg === "CONTENEURISE" ? marchByCont : (seg === "CONVENTIONNEL" ? marchByConv : null);
        if (targetMap) {
          let entry = targetMap.get(mKey);
          if (!entry) { entry = { key: mKey, bl: new Set(), teu: 0, weight: 0 }; targetMap.set(mKey, entry); }
          if (schema.teuField) entry.teu += numVal(r[schema.teuField]);
          entry.weight += numVal(r[schema.weightField]);
          if (bl) entry.bl.add(bl);
        }
      }
    }
    A.segments = {
      conteneurise: { bl: segments.CONTENEURISE.bl.size, teu: segments.CONTENEURISE.teu, weight: segments.CONTENEURISE.weight, rows: segments.CONTENEURISE.rows },
      conventionnel: { bl: segments.CONVENTIONNEL.bl.size, teu: segments.CONVENTIONNEL.teu, weight: segments.CONVENTIONNEL.weight, rows: segments.CONVENTIONNEL.rows },
      autre: { bl: segments.AUTRE.bl.size, teu: segments.AUTRE.teu, weight: segments.AUTRE.weight, rows: segments.AUTRE.rows }
    };
    // Top 10 marchandises CONTENEURISÉES (triées par TEU)
    A.topMarchandisesConteneurise = Array.from(marchByCont.values())
      .map(m => ({ key: m.key, bl: m.bl.size, teu: m.teu, weight: m.weight }))
      .sort((a,b) => b.teu - a.teu || b.bl - a.bl).slice(0, 15);
    // Top 10 marchandises CONVENTIONNELLES (triées par tonnage)
    A.topMarchandisesConventionnel = Array.from(marchByConv.values())
      .map(m => ({ key: m.key, bl: m.bl.size, teu: m.teu, weight: m.weight }))
      .sort((a,b) => b.weight - a.weight || b.bl - a.bl).slice(0, 15);
  } else {
    A.segments = null;
    A.topMarchandisesConteneurise = [];
    A.topMarchandisesConventionnel = [];
  }

  // Évolution Année × Mois
  const tempo = new Map();
  for (const r of rows) {
    const y = safeStr(r[schema.yearField]) || "?";
    const m = safeStr(r[schema.monthField]) || "?";
    const k = `${y}|${m}`;
    let t = tempo.get(k);
    if (!t) { t = { year: y, month: m, teu: 0, weight: 0, bl: new Set() }; tempo.set(k, t); }
    if (schema.teuField) t.teu += numVal(r[schema.teuField]);
    t.weight += numVal(r[schema.weightField]);
    t.bl.add(safeStr(r[schema.blField]));
  }
  const monthOrder = { "Janvier":1,"Février":2,"Mars":3,"Avril":4,"Mai":5,"Juin":6,"Juillet":7,"Août":8,"Septembre":9,"Octobre":10,"Novembre":11,"Décembre":12 };
  A.tempo = Array.from(tempo.values()).map(t => ({...t, bl: t.bl.size}))
    .sort((a,b) => {
      const ya = String(a.year).localeCompare(String(b.year));
      if (ya !== 0) return ya;
      const mna = monthOrder[a.month] || parseInt(a.month) || 0;
      const mnb = monthOrder[b.month] || parseInt(b.month) || 0;
      return mna - mnb;
    });

  // Comparaison par année
  const yearMap = new Map();
  for (const r of rows) {
    const y = safeStr(r[schema.yearField]); if (!y) continue;
    let t = yearMap.get(y);
    if (!t) { t = { year: y, teu: 0, weight: 0, bl: new Set() }; yearMap.set(y, t); }
    if (schema.teuField) t.teu += numVal(r[schema.teuField]);
    t.weight += numVal(r[schema.weightField]);
    t.bl.add(safeStr(r[schema.blField]));
  }
  A.byYear = Array.from(yearMap.values()).map(t => ({...t, bl: t.bl.size}))
    .sort((a,b) => String(a.year).localeCompare(String(b.year)));

  // Évolution N vs N-1
  if (A.byYear.length >= 2) {
    const cur = A.byYear[A.byYear.length-1], prev = A.byYear[A.byYear.length-2];
    A.evol = {
      year: cur.year, prevYear: prev.year,
      teuEvolPct: prev.teu > 0 ? ((cur.teu - prev.teu)/prev.teu*100) : null,
      weightEvolPct: prev.weight > 0 ? ((cur.weight - prev.weight)/prev.weight*100) : null,
      blEvolPct: prev.bl > 0 ? ((cur.bl - prev.bl)/prev.bl*100) : null
    };
  }

  // ============================================================
  // ANALYSE COMPARÉE N vs N-1 — bloc dédié
  // ============================================================
  if (A.byYear.length >= 2) {
    const curYear = A.byYear[A.byYear.length-1].year;
    const prevYear = A.byYear[A.byYear.length-2].year;

    // Helper : compare deux valeurs et retourne {prev, cur, delta, deltaPct}
    const cmpRow = (curV, prevV) => ({
      prev: prevV, cur: curV,
      delta: curV - prevV,
      deltaPct: prevV > 0 ? ((curV - prevV) / prevV * 100) : null
    });

    // ----- Totaux globaux par année -----
    const curRows = rows.filter(r => safeStr(r[schema.yearField]) === curYear);
    const prevRows = rows.filter(r => safeStr(r[schema.yearField]) === prevYear);
    const totals = (rs) => {
      const bls = new Set(), clients = new Set(), transit = new Set(), armat = new Set(), pays = new Set(), march = new Set();
      let teu = 0, weight = 0;
      for (const r of rs) {
        const bl = safeStr(r[schema.blField]); if (bl) bls.add(bl);
        if (!isEmptyValueGlobal(r[schema.clientField])) clients.add(safeStr(r[schema.clientField]));
        if (!isEmptyValueGlobal(r[schema.transitaireField])) transit.add(safeStr(r[schema.transitaireField]));
        if (!isEmptyValueGlobal(r[schema.armateurField])) armat.add(safeStr(r[schema.armateurField]));
        if (schema.paysOrigineField && !isEmptyValueGlobal(r[schema.paysOrigineField])) pays.add(safeStr(r[schema.paysOrigineField]));
        if (!isEmptyValueGlobal(r[schema.marchandiseField])) march.add(safeStr(r[schema.marchandiseField]));
        if (schema.teuField) teu += numVal(r[schema.teuField]);
        weight += numVal(r[schema.weightField]);
      }
      return { bl: bls.size, teu, weight, clients: clients.size, transitaires: transit.size, armateurs: armat.size, paysOrigine: pays.size, marchandises: march.size, rows: rs.length };
    };
    const cur = totals(curRows), prev = totals(prevRows);
    A.yoy = {
      curYear, prevYear,
      bl: cmpRow(cur.bl, prev.bl),
      teu: schema.teuField ? cmpRow(cur.teu, prev.teu) : null,
      weight: cmpRow(cur.weight, prev.weight),
      clients: cmpRow(cur.clients, prev.clients),
      transitaires: cmpRow(cur.transitaires, prev.transitaires),
      armateurs: cmpRow(cur.armateurs, prev.armateurs),
      paysOrigine: schema.paysOrigineField ? cmpRow(cur.paysOrigine, prev.paysOrigine) : null,
      marchandises: cmpRow(cur.marchandises, prev.marchandises)
    };

    // ----- Comparaison par segment (Conteneurisé / Conventionnel) -----
    const segByYear = (rs) => {
      const seg = { conteneurise: {bl:new Set(), teu:0, weight:0}, conventionnel: {bl:new Set(), teu:0, weight:0} };
      for (const r of rs) {
        const code = safeStr(r[schema.conditField]).toUpperCase();
        let bucket = null;
        if (CONTENEURISE_CODES.has(code)) bucket = seg.conteneurise;
        else if (CONVENTIONNEL_CODES.has(code)) bucket = seg.conventionnel;
        if (!bucket) continue;
        const bl = safeStr(r[schema.blField]); if (bl) bucket.bl.add(bl);
        if (schema.teuField) bucket.teu += numVal(r[schema.teuField]);
        bucket.weight += numVal(r[schema.weightField]);
      }
      return { conteneurise: { bl: seg.conteneurise.bl.size, teu: seg.conteneurise.teu, weight: seg.conteneurise.weight },
               conventionnel: { bl: seg.conventionnel.bl.size, teu: seg.conventionnel.teu, weight: seg.conventionnel.weight } };
    };
    if (schema.conditField) {
      const cs = segByYear(curRows), ps = segByYear(prevRows);
      A.yoy.segments = {
        conteneurise: {
          bl: cmpRow(cs.conteneurise.bl, ps.conteneurise.bl),
          teu: schema.teuField ? cmpRow(cs.conteneurise.teu, ps.conteneurise.teu) : null,
          weight: cmpRow(cs.conteneurise.weight, ps.conteneurise.weight)
        },
        conventionnel: {
          bl: cmpRow(cs.conventionnel.bl, ps.conventionnel.bl),
          teu: schema.teuField ? cmpRow(cs.conventionnel.teu, ps.conventionnel.teu) : null,
          weight: cmpRow(cs.conventionnel.weight, ps.conventionnel.weight)
        }
      };
    }

    // ----- Top éléments avec évolution YoY -----
    // Helper : agrège un champ par année, retourne map {key → {prev, cur}}
    const aggByYear = (field, opts={}) => {
      if (!field) return [];
      const map = new Map();
      for (const r of rows) {
        if (isEmptyValueGlobal(r[field])) continue;
        const key = safeStr(r[field]);
        const y = safeStr(r[schema.yearField]);
        const bl = safeStr(r[schema.blField]);
        if (y !== curYear && y !== prevYear) continue;
        let m = map.get(key);
        if (!m) { m = { key, prev: { bl: new Set(), teu: 0, weight: 0 }, cur: { bl: new Set(), teu: 0, weight: 0 } }; map.set(key, m); }
        const bucket = y === curYear ? m.cur : m.prev;
        if (bl) bucket.bl.add(bl);
        if (schema.teuField) bucket.teu += numVal(r[schema.teuField]);
        bucket.weight += numVal(r[schema.weightField]);
      }
      const sortMetric = opts.sortBy || (schema.teuField ? "teu" : "weight");
      const arr = Array.from(map.values()).map(m => {
        const pV = sortMetric === "bl" ? m.prev.bl.size : (sortMetric === "teu" ? m.prev.teu : m.prev.weight);
        const cV = sortMetric === "bl" ? m.cur.bl.size : (sortMetric === "teu" ? m.cur.teu : m.cur.weight);
        return {
          key: m.key,
          prevBL: m.prev.bl.size, curBL: m.cur.bl.size,
          prevTEU: m.prev.teu, curTEU: m.cur.teu,
          prevWeight: m.prev.weight, curWeight: m.cur.weight,
          prevMetric: pV, curMetric: cV,
          delta: cV - pV,
          deltaPct: pV > 0 ? ((cV - pV) / pV * 100) : (cV > 0 ? null : 0)  // null = "nouveau"
        };
      });
      arr.sort((a, b) => (b.curMetric || 0) - (a.curMetric || 0));
      return arr;
    };

    A.yoy.topClients = aggByYear(schema.clientField).slice(0, 15);
    A.yoy.topPaysOrigine = schema.paysOrigineField ? aggByYear(schema.paysOrigineField, { sortBy: "bl" }).slice(0, 10) : [];
    A.yoy.topMarchandises = aggByYear(schema.marchandiseField).slice(0, 15);
    A.yoy.topTransitaires = aggByYear(schema.transitaireField).slice(0, 10);
    A.yoy.topArmateurs = aggByYear(schema.armateurField).slice(0, 10);

    // Gagnants / Perdants (sur clients) — top évolutions absolues
    const movableClients = A.yoy.topClients.filter(c => c.prevMetric > 0 && c.deltaPct !== null);
    A.yoy.gagnantsPct = [...movableClients].sort((a,b) => b.deltaPct - a.deltaPct).slice(0, 5);
    A.yoy.perdantsPct = [...movableClients].sort((a,b) => a.deltaPct - b.deltaPct).slice(0, 5);
    A.yoy.nouveauxClients = A.yoy.topClients.filter(c => c.prevMetric === 0 && c.curMetric > 0).slice(0, 5);
    A.yoy.perdusClients = A.yoy.topClients.filter(c => c.curMetric === 0 && c.prevMetric > 0).slice(0, 5);
  } else {
    A.yoy = null;
  }

  // Concentration Pareto sur clients
  if (A.topClients.length > 0) {
    const totalMetric = schema.teuField ? totalTEU : totalWeight;
    let cum = 0;
    A.paretoClients = A.topClients.map(c => {
      const v = schema.teuField ? c.teu : c.weight;
      cum += v;
      return { ...c, cumPct: totalMetric > 0 ? cum/totalMetric*100 : 0 };
    });
    A.top5Share = A.paretoClients.length >= 5 ? A.paretoClients[4].cumPct : (A.paretoClients[A.paretoClients.length-1]?.cumPct || 0);
    A.top10Share = A.paretoClients.length >= 10 ? A.paretoClients[9].cumPct : (A.paretoClients[A.paretoClients.length-1]?.cumPct || 0);
  } else {
    A.paretoClients = []; A.top5Share = 0; A.top10Share = 0;
  }

  // ----- ZOOM AGL : PDM transitaire ----------------------------------
  // Détecte AGL parmi les transitaires (matching tolérant)
  const isAGL = (name) => {
    if (!name) return false;
    const s = String(name).toUpperCase();
    return s.includes("AFRICA GLOBAL LOGISTICS") || s.includes("AGL") || s.includes("BOLLORE TRANSPORT") || s.includes("BOLLORÉ TRANSPORT");
  };
  // Trouve la ligne AGL dans le tableau transitaires complet (non tronqué)
  const fullTransit = aggBy(schema.transitaireField, { sortBy: primarySort });
  const aglEntry = fullTransit.find(t => isAGL(t.key));
  const totalMet = schema.teuField ? totalTEU : totalWeight;
  if (aglEntry) {
    const aglMetric = schema.teuField ? aglEntry.teu : aglEntry.weight;
    const rank = fullTransit.findIndex(t => isAGL(t.key)) + 1;
    A.aglTransit = {
      name: aglEntry.key,
      rank,
      bl: aglEntry.bl,
      teu: aglEntry.teu,
      weight: aglEntry.weight,
      pdmMetric: totalMet > 0 ? aglMetric / totalMet * 100 : 0,
      pdmBL: A.nbBL > 0 ? aglEntry.bl / A.nbBL * 100 : 0,
      totalTransitaires: fullTransit.length
    };
    // Évolution AGL N vs N-1
    const aglByYear = new Map();
    for (const r of rows) {
      if (!isAGL(r[schema.transitaireField])) continue;
      const y = safeStr(r[schema.yearField]); if (!y) continue;
      let t = aglByYear.get(y);
      if (!t) { t = { year: y, teu: 0, weight: 0, bl: new Set() }; aglByYear.set(y, t); }
      if (schema.teuField) t.teu += numVal(r[schema.teuField]);
      t.weight += numVal(r[schema.weightField]);
      t.bl.add(safeStr(r[schema.blField]));
    }
    const aglYears = Array.from(aglByYear.values()).map(t => ({...t, bl: t.bl.size}))
      .sort((a,b) => String(a.year).localeCompare(String(b.year)));
    A.aglTransit.byYear = aglYears;
    if (aglYears.length >= 2) {
      const cur = aglYears[aglYears.length-1], prev = aglYears[aglYears.length-2];
      A.aglTransit.evol = {
        year: cur.year, prevYear: prev.year,
        teuEvolPct: prev.teu > 0 ? ((cur.teu - prev.teu)/prev.teu*100) : null,
        weightEvolPct: prev.weight > 0 ? ((cur.weight - prev.weight)/prev.weight*100) : null,
        blEvolPct: prev.bl > 0 ? ((cur.bl - prev.bl)/prev.bl*100) : null
      };
    }
  } else {
    A.aglTransit = null;
  }

  // ============================================================
  // PDM AGL PAR DIMENSION (par client, par marchandise, par pays...)
  // Pour chaque valeur d'une dimension, on calcule :
  //   - total marché sur la dimension
  //   - part AGL (où AGL est le transitaire) sur cette dimension
  //   - PDM = part AGL / total marché
  //   - PDM N-1, et évolution
  // ============================================================
  function buildAGLPDMByField(field) {
    if (!field) return new Map();
    // map[value] = { total: {prev, cur}, agl: {prev, cur} }  en TEU ou Tonnes
    const map = new Map();
    const curYear = A.byYear.length >= 2 ? A.byYear[A.byYear.length-1].year : null;
    const prevYear = A.byYear.length >= 2 ? A.byYear[A.byYear.length-2].year : null;
    for (const r of rows) {
      if (isEmptyValueGlobal(r[field])) continue;
      const key = safeStr(r[field]);
      const y = safeStr(r[schema.yearField]);
      const bucket = y === curYear ? "cur" : (y === prevYear ? "prev" : null);
      if (!bucket && (curYear || prevYear)) continue;
      let entry = map.get(key);
      if (!entry) {
        entry = { total: { prev: { teu:0, weight:0 }, cur: { teu:0, weight:0 }, all: { teu:0, weight:0 } },
                  agl:   { prev: { teu:0, weight:0 }, cur: { teu:0, weight:0 }, all: { teu:0, weight:0 } } };
        map.set(key, entry);
      }
      const teu = schema.teuField ? numVal(r[schema.teuField]) : 0;
      const w = numVal(r[schema.weightField]);
      entry.total.all.teu += teu; entry.total.all.weight += w;
      if (bucket) { entry.total[bucket].teu += teu; entry.total[bucket].weight += w; }
      if (isAGL(r[schema.transitaireField])) {
        entry.agl.all.teu += teu; entry.agl.all.weight += w;
        if (bucket) { entry.agl[bucket].teu += teu; entry.agl[bucket].weight += w; }
      }
    }
    // Convertit en PDM%
    const result = new Map();
    for (const [key, e] of map.entries()) {
      const pdmAll = e.total.all.teu > 0 ? e.agl.all.teu / e.total.all.teu * 100 : (e.total.all.weight > 0 ? e.agl.all.weight / e.total.all.weight * 100 : 0);
      const pdmCur = e.total.cur.teu > 0 ? e.agl.cur.teu / e.total.cur.teu * 100 : (e.total.cur.weight > 0 ? e.agl.cur.weight / e.total.cur.weight * 100 : null);
      const pdmPrev = e.total.prev.teu > 0 ? e.agl.prev.teu / e.total.prev.teu * 100 : (e.total.prev.weight > 0 ? e.agl.prev.weight / e.total.prev.weight * 100 : null);
      // Évolution AGL : croissance de la part AGL (volume) entre N-1 et N
      const aglMetricCur = schema.teuField ? e.agl.cur.teu : e.agl.cur.weight;
      const aglMetricPrev = schema.teuField ? e.agl.prev.teu : e.agl.prev.weight;
      const aglEvolPct = aglMetricPrev > 0 ? ((aglMetricCur - aglMetricPrev) / aglMetricPrev * 100) : (aglMetricCur > 0 ? null : 0);
      result.set(key, { pdmAll, pdmCur, pdmPrev, pdmDelta: (pdmCur !== null && pdmPrev !== null) ? (pdmCur - pdmPrev) : null, aglEvolPct,
                        aglVolCur: aglMetricCur, aglVolPrev: aglMetricPrev });
    }
    return result;
  }
  A.aglPdmByClient = buildAGLPDMByField(schema.clientField);
  A.aglPdmByMarchandise = buildAGLPDMByField(schema.marchandiseField);
  A.aglPdmByPays = schema.paysOrigineField ? buildAGLPDMByField(schema.paysOrigineField) : new Map();
  A.aglPdmByPaysDest = schema.paysDestField ? buildAGLPDMByField(schema.paysDestField) : new Map();
  A.aglPdmByArmateur = buildAGLPDMByField(schema.armateurField);
  return A;
}

// ============================================================
// APPLICATION DES FILTRES (sur rows brutes) — RAPIDE
// ============================================================
function applyFilters(rows, filters) {
  // filters = { fieldName: Set<string> }
  const activeKeys = Object.keys(filters).filter(k => filters[k] && filters[k].size > 0);
  if (activeKeys.length === 0) return rows;
  return rows.filter(r => {
    for (const k of activeKeys) {
      const v = safeStr(r[k]);  // si vide, ne matchera aucun filtre actif → ligne exclue
      if (!filters[k].has(v)) return false;
    }
    return true;
  });
}

// Détecte si une valeur doit être exclue (version globale)
function isEmptyValueGlobal(v) {
  if (v === null || v === undefined) return true;
  const s = String(v).trim().toLowerCase();
  if (s === "") return true;
  if (s === "n/a" || s === "na" || s === "null" || s === "undefined") return true;
  if (s === "(non renseigné)" || s === "non renseigné" || s === "non renseigne") return true;
  if (s === "(non renseignée)" || s === "non renseignée" || s === "non renseignee") return true;
  if (s === "-" || s === "--" || s === ".") return true;
  return false;
}

// Détecte si une valeur pays/lieu correspond à la Côte d'Ivoire (toutes variantes)
function isCoteDIvoire(v) {
  if (isEmptyValueGlobal(v)) return false;
  const s = String(v).trim().toUpperCase()
    .replace(/[ÀÁÂÄÃ]/g, "A")
    .replace(/[ÈÉÊË]/g, "E")
    .replace(/[ÌÍÎÏ]/g, "I")
    .replace(/[ÒÓÔÖÕ]/g, "O")
    .replace(/[ÙÚÛÜ]/g, "U")
    .replace(/[Ç]/g, "C");
  // Variantes
  return s === "COTE D'IVOIRE" || s === "COTE D IVOIRE" || s === "COTE DIVOIRE" ||
         s === "IVORY COAST" || s === "IVORYCOAST" ||
         s === "CI" || s === "CIV" || s === "RCI" ||
         s === "REPUBLIQUE DE COTE D'IVOIRE" || s === "REPUBLIQUE DE COTE D IVOIRE" ||
         s.includes("COTE D") && s.includes("IVOIRE");
}

// ============================================================
// HINTERLAND ANALYSIS
// Pour IMPORT_MARITIME : sélectionne les rows où paysDest ≠ Côte d'Ivoire
// Pour EXPORT_MARITIME : sélectionne les rows où paysOrigine ≠ Côte d'Ivoire
// Puis applique buildAnalysis sur ce sous-ensemble pour avoir tops + PDM AGL + YoY
// ============================================================
function buildHinterlandAnalysis(metiersState) {
  const result = { importHinterland: null, exportHinterland: null };

  // IMPORT MARITIME → marchandises destinées hors CI
  const impMar = metiersState?.IMPORT_MARITIME;
  if (impMar && Array.isArray(impMar.rows) && impMar.rows.length > 0) {
    const schema = METIER_SCHEMAS.IMPORT_MARITIME;
    const paysDestField = schema.paysDestField || "Pays de livraison";
    const filtered = impMar.rows.filter(r => {
      const v = r[paysDestField];
      return !isEmptyValueGlobal(v) && !isCoteDIvoire(v);
    });
    if (filtered.length > 0) {
      const A = buildAnalysis(filtered, schema);
      A._hinterlandSens = "import";
      A._hinterlandLabel = "Hinterland Import (marchandises en transit CI → pays enclavés)";
      A._hinterlandIcon = "🚛";
      A._originalCount = impMar.rows.length;
      A._filteredCount = filtered.length;
      result.importHinterland = A;
    }
  }

  // EXPORT MARITIME → marchandises issues hors CI
  const expMar = metiersState?.EXPORT_MARITIME;
  if (expMar && Array.isArray(expMar.rows) && expMar.rows.length > 0) {
    const schema = METIER_SCHEMAS.EXPORT_MARITIME;
    const paysOrigField = schema.paysOrigineField || "Pays de prise en charge";
    const filtered = expMar.rows.filter(r => {
      const v = r[paysOrigField];
      return !isEmptyValueGlobal(v) && !isCoteDIvoire(v);
    });
    if (filtered.length > 0) {
      const A = buildAnalysis(filtered, schema);
      A._hinterlandSens = "export";
      A._hinterlandLabel = "Hinterland Export (marchandises de pays enclavés via CI)";
      A._hinterlandIcon = "🚛";
      A._originalCount = expMar.rows.length;
      A._filteredCount = filtered.length;
      result.exportHinterland = A;
    }
  }

  return result;
}

// Pré-indexation des valeurs distinctes par colonne (au moment du chargement)
function buildIndex(rows, schema) {
  const cols = getFilterableColumns(schema);
  const index = {};
  for (const c of cols) {
    const map = new Map();
    for (const r of rows) {
      if (isEmptyValueGlobal(r[c.field])) continue;  // ← on ignore les vides
      const v = safeStr(r[c.field]);
      map.set(v, (map.get(v) || 0) + 1);
    }
    index[c.field] = Array.from(map.entries()).map(([value, count]) => ({ value, count }))
      .sort((a,b) => b.count - a.count);
  }
  return index;
}

// ============================================================
// GÉNÉRATION DES TROIS LIVRABLES : DOCX, PDF, PPTX
// ============================================================
const NAVY = "0A2540", GOLD = "C9A14A", GRAY = "64748B", LIGHT = "F1F5F9";

// ---------- Insights textuels automatiques ----------
function buildInsights(A, schema) {
  const insights = [];
  if (A.empty) return insights;
  const unit = schema.teuField ? "TEU" : "tonnes";
  const totalUnit = schema.teuField ? A.totalTEU : A.totalWeight;
  insights.push(`Le périmètre analysé totalise ${fmt(A.nbBL)} ${schema.type==="maritime"?"BL":"LTA"} pour ${fmt(totalUnit, schema.teuField?0:2)} ${unit} et ${fmt(A.totalWeight,0)} kg, répartis entre ${A.nbClients} ${schema.clientLabel.toLowerCase()}s uniques.`);
  if (A.evol) {
    const trend = A.evol.teuEvolPct;
    if (trend !== null && schema.teuField) {
      const dir = trend > 0 ? "progression" : "recul";
      insights.push(`Trajectoire ${A.evol.year} vs ${A.evol.prevYear} : ${dir} de ${fmt(Math.abs(trend),1)} % en TEU.`);
    } else if (A.evol.weightEvolPct !== null) {
      const dir = A.evol.weightEvolPct > 0 ? "progression" : "recul";
      insights.push(`Trajectoire ${A.evol.year} vs ${A.evol.prevYear} : ${dir} de ${fmt(Math.abs(A.evol.weightEvolPct),1)} % en tonnage.`);
    }
  }
  if (A.top5Share > 0) {
    insights.push(`Concentration commerciale : le Top 5 ${schema.clientLabel.toLowerCase()}s capte ${fmt(A.top5Share,1)} % des volumes, et le Top 10 ${fmt(A.top10Share,1)} %.`);
  }
  if (A.topPaysOrigine.length > 0) {
    const lead = A.topPaysOrigine[0];
    insights.push(`Origine dominante : ${lead.key} (${fmt(lead.bl)} ${schema.type==="maritime"?"BL":"LTA"}, soit ${pct(lead.bl, A.nbBL)} du flux).`);
  }
  if (A.topTransitaires.length > 0) {
    const lead = A.topTransitaires[0];
    const leadShare = schema.teuField ? (lead.teu/Math.max(A.totalTEU,1)*100) : (lead.weight/Math.max(A.totalWeight,1)*100);
    insights.push(`Leader transit : ${lead.key} avec ${fmt(leadShare,1)} % des ${unit}.`);
  }
  // Insight PDM AGL
  if (A.aglTransit) {
    const a = A.aglTransit;
    let txt = `Position AGL : ${a.rank}e transitaire sur ${a.totalTransitaires}, PDM de ${fmt(a.pdmMetric,1)} % en ${unit} (${fmt(a.bl)} ${schema.type==="maritime"?"BL":"LTA"}, soit ${fmt(a.pdmBL,1)} % du nombre de dossiers)`;
    if (a.evol) {
      const v = schema.teuField ? a.evol.teuEvolPct : a.evol.weightEvolPct;
      if (v !== null && !isNaN(v)) txt += ` — évolution ${a.evol.year} vs ${a.evol.prevYear} : ${v >= 0 ? "+" : ""}${fmt(v,1)} %`;
    }
    txt += ".";
    insights.push(txt);
  }
  return insights;
}

// ---------- DOCX ----------
async function generateDOCX(analyses, options) {
  const docx = window.docx;
  const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType,
    Table, TableRow, TableCell, WidthType, BorderStyle, ShadingType, PageBreak } = docx;

  const navyColor = NAVY, goldColor = GOLD;
  const cellBorder = { style: BorderStyle.SINGLE, size: 4, color: "CCCCCC" };
  const borders = { top: cellBorder, bottom: cellBorder, left: cellBorder, right: cellBorder };

  const titleP = (text, level=1) => new Paragraph({
    heading: level===1 ? HeadingLevel.HEADING_1 : level===2 ? HeadingLevel.HEADING_2 : HeadingLevel.HEADING_3,
    spacing: { before: 280, after: 140 },
    children: [new TextRun({ text, bold: true, color: navyColor, font: "Calibri", size: level===1?32:level===2?26:22 })]
  });
  const p = (text, opts={}) => new Paragraph({
    spacing: { after: 100 },
    alignment: opts.center ? AlignmentType.CENTER : AlignmentType.LEFT,
    children: [new TextRun({ text, font: "Calibri", size: 22, bold: !!opts.bold, color: opts.color || "333333", italics: !!opts.italics })]
  });
  const insightBox = (text) => new Table({
    width: { size: 9360, type: WidthType.DXA },
    columnWidths: [9360],
    rows: [new TableRow({ children: [new TableCell({
      borders: { top: {style:BorderStyle.SINGLE, size:8, color:goldColor}, bottom: {style:BorderStyle.SINGLE, size:8, color:goldColor}, left: {style:BorderStyle.SINGLE, size:24, color:goldColor}, right: {style:BorderStyle.SINGLE, size:4, color:goldColor} },
      shading: { fill: "FEF9E7", type: ShadingType.CLEAR },
      margins: { top: 120, bottom: 120, left: 200, right: 160 },
      width: { size: 9360, type: WidthType.DXA },
      children: [new Paragraph({ children: [new TextRun({ text: "▸ ", bold: true, color: goldColor, font: "Calibri", size: 22 }), new TextRun({ text, font: "Calibri", size: 21 })] })]
    })]})]
  });
  const makeTable = (headers, rows, widths) => {
    const totalW = 9360;
    const colW = widths || headers.map(() => Math.floor(totalW / headers.length));
    const headerRow = new TableRow({
      tableHeader: true,
      children: headers.map((h, i) => new TableCell({
        borders, width: { size: colW[i], type: WidthType.DXA },
        shading: { fill: navyColor, type: ShadingType.CLEAR },
        margins: { top: 80, bottom: 80, left: 100, right: 100 },
        children: [new Paragraph({ children: [new TextRun({ text: h, bold: true, color: "FFFFFF", font: "Calibri", size: 20 })] })]
      }))
    });
    const dataRows = rows.map((r, idx) => new TableRow({
      children: r.map((cell, i) => new TableCell({
        borders, width: { size: colW[i], type: WidthType.DXA },
        shading: idx % 2 === 1 ? { fill: "F8FAFC", type: ShadingType.CLEAR } : undefined,
        margins: { top: 60, bottom: 60, left: 100, right: 100 },
        children: [new Paragraph({ children: [new TextRun({ text: String(cell), font: "Calibri", size: 20 })] })]
      }))
    }));
    return new Table({ width: { size: totalW, type: WidthType.DXA }, columnWidths: colW, rows: [headerRow, ...dataRows] });
  };

  const children = [];

  // --- Page de garde ---
  children.push(new Paragraph({ spacing: { before: 800, after: 200 }, alignment: AlignmentType.CENTER, children: [new TextRun({ text: "AFRICA GLOBAL LOGISTICS", bold: true, color: navyColor, font: "Calibri", size: 36 })] }));
  children.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 100 }, children: [new TextRun({ text: "DIRECTION MARKETING — DIVISION STRATÉGIE", bold: true, color: goldColor, font: "Calibri", size: 26 })] }));
  children.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { before: 400, after: 100 }, children: [new TextRun({ text: "ÉTUDE STRATÉGIQUE", bold: true, color: "333333", font: "Calibri", size: 24 })] }));
  children.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 200 }, children: [new TextRun({ text: options.title || "Analyse des flux STATCOM", bold: true, color: navyColor, font: "Calibri", size: 40 })] }));
  if (options.subtitle) children.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 200 }, children: [new TextRun({ text: options.subtitle, italics: true, color: "555555", font: "Calibri", size: 22 })] }));
  children.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { before: 400, after: 100 }, children: [new TextRun({ text: "Source : Base STATCOM — Africa Global Logistics", color: "555555", font: "Calibri", size: 20 })] }));
  const today = new Date().toLocaleDateString("fr-FR", { year:"numeric", month:"long", day:"numeric" });
  children.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { before: 200 }, children: [new TextRun({ text: `${today} | Abidjan, Côte d'Ivoire`, bold: true, font: "Calibri", size: 22 })] }));
  children.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { before: 100 }, children: [new TextRun({ text: "Document confidentiel — Usage interne AGL / COMEX", italics: true, color: GRAY, font: "Calibri", size: 18 })] }));
  children.push(new Paragraph({ children: [new PageBreak()] }));

  // --- Sommaire ---

  const sommaire = [
    "1. Résumé exécutif",
    "2. Méthodologie et périmètre",

    "4. Volumétrie et dynamique temporelle",
    "5. Marchandises : nature des flux",
    "6. Paysage concurrentiel",
    "7. Clients finaux : segmentation"

  sommaire.forEach(s => children.push(p(s)));
  children.push(new Paragraph({ children: [new PageBreak()] }));

  // --- Sections par métier ---
  for (let mi = 0; mi < analyses.length; mi++) {
    const A = analyses[mi];

    const schema = A.schema;
