      const headers = schema.teuField ? ["Rang", "Armateur", `Nb ${blLabel}`, "TEU", "% TEU"] : ["Rang", "Compagnie", `Nb ${blLabel}`, "Tonnes", "% Tonnes"];
      const totalMet = schema.teuField ? A.totalTEU : A.totalWeight;
      const dataRows = A.topArmateurs.map((x, i) => schema.teuField
        ? [i+1, x.key.substring(0,50), fmt(x.bl), fmt(x.teu), pct(x.teu, totalMet)]
        : [i+1, x.key.substring(0,50), fmt(x.bl), fmt(x.weight,0), pct(x.weight, totalMet)]);
      children.push(makeTable(headers, dataRows, [600,4400,1420,1500,1440]));
    }
    if (A.topTransitaires.length > 0) {
      children.push(titleP("6.2. Top transitaires", 2));
      const totalMet = schema.teuField ? A.totalTEU : A.totalWeight;
      const headers = schema.teuField ? ["Rang", "Transitaire", `Nb ${blLabel}`, "TEU", "% TEU"] : ["Rang", "Transitaire", `Nb ${blLabel}`, "Tonnes", "% Tonnes"];
      const dataRows = A.topTransitaires.map((x, i) => schema.teuField
        ? [i+1, x.key.substring(0,50), fmt(x.bl), fmt(x.teu), pct(x.teu, totalMet)]
        : [i+1, x.key.substring(0,50), fmt(x.bl), fmt(x.weight,0), pct(x.weight, totalMet)]);
      children.push(makeTable(headers, dataRows, [600,4400,1420,1500,1440]));
    }

    // 6.3 Zoom AGL Transitaire
    if (A.aglTransit) {
      const a = A.aglTransit;
      children.push(titleP("6.3. Zoom Africa Global Logistics (Transitaire)", 2));
      const aglIntro = `AGL occupe le rang n°${a.rank} sur ${a.totalTransitaires} transitaires identifiés sur ce périmètre. Sa part de marché s'établit à ${fmt(a.pdmMetric,1)} % en ${schema.teuField?"TEU":"tonnes"} et ${fmt(a.pdmBL,1)} % en nombre de ${blLabel}.`;
      children.push(p(aglIntro));
      children.push(insightBox(`▸ Position AGL : ${fmt(a.pdmMetric,1)} % de PDM en ${schema.teuField?"TEU":"tonnes"} | ${fmt(a.bl)} ${blLabel} traités | ${fmt(a.pdmBL,1)} % des dossiers du marché`));
      // Tableau récap AGL
      const aglHeaders = schema.teuField ? ["Indicateur", "Valeur AGL", "Marché total", "Part AGL"] : ["Indicateur", "Valeur AGL", "Marché total", "Part AGL"];
      const aglRows = [
        [`${blLabel} traités`, fmt(a.bl), fmt(A.nbBL), pct(a.bl, A.nbBL)],
      ];
      if (schema.teuField) aglRows.push(["TEU", fmt(a.teu), fmt(A.totalTEU), pct(a.teu, A.totalTEU)]);
      aglRows.push(["Tonnage (kg)", fmt(a.weight,0), fmt(A.totalWeight,0), pct(a.weight, A.totalWeight)]);
      children.push(makeTable(aglHeaders, aglRows, [3000,2200,2200,1960]));

      // Évolution AGL N vs N-1
      if (a.byYear && a.byYear.length > 0) {
        children.push(titleP("Évolution annuelle AGL", 3));
        const evolHeaders = schema.teuField ? ["Année", `Nb ${blLabel}`, "TEU", "Tonnes"] : ["Année", `Nb ${blLabel}`, "Tonnes"];
        const evolRows = a.byYear.map(y => schema.teuField ? [y.year, fmt(y.bl), fmt(y.teu), fmt(y.weight,0)] : [y.year, fmt(y.bl), fmt(y.weight,0)]);
        children.push(makeTable(evolHeaders, evolRows, schema.teuField ? [2340,2340,2340,2340] : [3120,3120,3120]));
        if (a.evol) {
          const v = schema.teuField ? a.evol.teuEvolPct : a.evol.weightEvolPct;
          const vBL = a.evol.blEvolPct;
          if (v !== null && !isNaN(v)) {
            const dir = v >= 0 ? "progression" : "recul";
            children.push(p(`Évolution ${a.evol.year} vs ${a.evol.prevYear} : ${dir} de ${fmt(Math.abs(v),1)} % en ${schema.teuField?"TEU":"tonnes"}${vBL !== null && !isNaN(vBL) ? `, ${vBL>=0?"+":""}${fmt(vBL,1)} % en nombre de ${blLabel}` : ""}.`, { bold: true }));
          }
        }
      }
    }

    // 7. Clients
    children.push(titleP(`7. ${schema.clientLabel}s : segmentation`, 1));
    if (A.top5Share > 0) {
      children.push(p(`Top 5 ${schema.clientLabel.toLowerCase()}s = ${fmt(A.top5Share,1)} % des volumes. Top 10 ${schema.clientLabel.toLowerCase()}s = ${fmt(A.top10Share,1)} %.`, { bold: true }));
    }
    if (A.topClients.length > 0) {
      children.push(titleP(`7.1. Top 20 ${schema.clientLabel.toLowerCase()}s`, 2));
      const totalMet = schema.teuField ? A.totalTEU : A.totalWeight;
      const headers = schema.teuField ? ["Rang", schema.clientLabel, `Nb ${blLabel}`, "TEU", "% TEU", "Cum. %"] : ["Rang", schema.clientLabel, `Nb ${blLabel}`, "Tonnes", "% Tonnes", "Cum. %"];
      const dataRows = A.paretoClients.slice(0, 20).map((x, i) => schema.teuField
        ? [i+1, x.key.substring(0,40), fmt(x.bl), fmt(x.teu), pct(x.teu, totalMet), fmt(x.cumPct,1)+" %"]
        : [i+1, x.key.substring(0,40), fmt(x.bl), fmt(x.weight,0), pct(x.weight, totalMet), fmt(x.cumPct,1)+" %"]);
      children.push(makeTable(headers, dataRows, [500,3500,1100,1400,1330,1530]));
    }
    if (A.topLieuxLiv.length > 0) {
      children.push(titleP("7.2. Lieux de livraison", 2));
      const totalMet = schema.teuField ? A.totalTEU : A.totalWeight;
      const headers = schema.teuField ? ["Lieu de livraison", `Nb ${blLabel}`, "TEU", "% TEU"] : ["Lieu de livraison", `Nb ${blLabel}`, "Tonnes", "% Tonnes"];
      const dataRows = A.topLieuxLiv.map(x => schema.teuField
        ? [x.key.substring(0,50), fmt(x.bl), fmt(x.teu), pct(x.teu, totalMet)]
        : [x.key.substring(0,50), fmt(x.bl), fmt(x.weight,0), pct(x.weight, totalMet)]);
      children.push(makeTable(headers, dataRows, [4360,1500,1750,1750]));
    }

    if (mi < analyses.length - 1) children.push(new Paragraph({ children: [new PageBreak()] }));
  }

  // Footer
  children.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { before: 600 }, children: [new TextRun({ text: "— Fin du rapport —", italics: true, color: GRAY, font: "Calibri", size: 20 })] }));
  children.push(new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: "Confidentiel — Usage interne AGL / COMEX", italics: true, color: GRAY, font: "Calibri", size: 18 })] }));

  const doc = new Document({
    styles: { default: { document: { run: { font: "Calibri", size: 22 } } } },
    sections: [{ properties: { page: { size: { width: 12240, height: 15840 }, margin: { top: 1440, right: 1440, bottom: 1440, left: 1440 } } }, children }]
  });
  const blob = await Packer.toBlob(doc);
  saveAs(blob, options.filename + ".docx");
}

// ---------- PDF ----------
function generatePDF(analyses, options) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
  // Vérification que le plugin autoTable est bien chargé
  if (typeof doc.autoTable !== "function") {
    throw new Error("Plugin jspdf-autotable non chargé. Vérifiez votre connexion Internet (les CDN sont nécessaires au premier chargement de l'app).");
  }
  const pageW = 210, margin = 15;
  let y = margin;

  const addHeader = () => {
    doc.setFillColor(10, 37, 64);
    doc.rect(0, 0, pageW, 12, "F");
    doc.setFillColor(201, 161, 74);
    doc.rect(0, 12, pageW, 1, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(255,255,255);
    doc.text("AGL — DIRECTION STRATÉGIE", margin, 8);
    doc.setTextColor(255,255,255); doc.setFontSize(8);
    doc.text(options.title || "Analyse STATCOM", pageW - margin, 8, { align: "right" });
  };
  const addFooter = () => {
    const h = 297;
    doc.setFillColor(241, 245, 249);
    doc.rect(0, h-10, pageW, 10, "F");
    doc.setFontSize(8); doc.setTextColor(100,116,139);
    doc.text("Confidentiel — Usage interne AGL / COMEX", margin, h-4);
    doc.text(`Page ${doc.internal.getNumberOfPages()}`, pageW - margin, h-4, { align: "right" });
  };
  const newPage = () => { doc.addPage(); y = margin + 8; addHeader(); };
  const ensureSpace = (need) => { if (y + need > 275) newPage(); };
  const title = (text, size=18) => {
    ensureSpace(15);
    doc.setFont("helvetica","bold"); doc.setFontSize(size); doc.setTextColor(10,37,64);
    doc.text(text, margin, y); y += size*0.5 + 2;
    doc.setDrawColor(201, 161, 74); doc.setLineWidth(0.7);
    doc.line(margin, y, margin + 50, y); y += 5;
  };
  const subtitle = (text) => {
    ensureSpace(8);
    doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(10,37,64);
    doc.text(text, margin, y); y += 6;
  };
  const para = (text) => {
    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(51,51,51);
    const lines = doc.splitTextToSize(text, pageW - 2*margin);
    ensureSpace(lines.length*5 + 2);
    doc.text(lines, margin, y); y += lines.length*5 + 2;
  };
  const insightBox = (text) => {
    doc.setFont("helvetica","normal"); doc.setFontSize(10);
    const lines = doc.splitTextToSize(text, pageW - 2*margin - 8);
    const h = lines.length*5 + 6;
    ensureSpace(h+4);
    doc.setFillColor(254, 249, 231);
    doc.rect(margin, y, pageW - 2*margin, h, "F");
    doc.setFillColor(201, 161, 74);
    doc.rect(margin, y, 2, h, "F");
    doc.setTextColor(51, 51, 51);
    doc.text(lines, margin+5, y+5);
    y += h + 4;
  };

  // Page de garde
  addHeader();
  y = 50;
  doc.setFont("helvetica","bold"); doc.setFontSize(26); doc.setTextColor(10,37,64);
  doc.text("AFRICA GLOBAL LOGISTICS", pageW/2, y, { align:"center" }); y += 12;
  doc.setFontSize(14); doc.setTextColor(201,161,74);
  doc.text("DIRECTION MARKETING — DIVISION STRATÉGIE", pageW/2, y, { align:"center" }); y += 20;
  doc.setFontSize(12); doc.setTextColor(80,80,80);
  doc.text("ÉTUDE STRATÉGIQUE", pageW/2, y, { align:"center" }); y += 12;
  doc.setFontSize(20); doc.setTextColor(10,37,64);
  doc.text(options.title || "Analyse des flux STATCOM", pageW/2, y, { align:"center" }); y += 10;
  if (options.subtitle) {
    doc.setFontSize(11); doc.setFont("helvetica","italic"); doc.setTextColor(80,80,80);
    const subLines = doc.splitTextToSize(options.subtitle, pageW - 40);
    doc.text(subLines, pageW/2, y, { align:"center" }); y += subLines.length*6;
  }
  y += 30;
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(80,80,80);
  doc.text("Source : Base STATCOM — Africa Global Logistics", pageW/2, y, { align:"center" }); y += 8;
  const today = new Date().toLocaleDateString("fr-FR", { year:"numeric", month:"long", day:"numeric" });
  doc.setFont("helvetica","bold"); doc.setFontSize(11);
  doc.text(`${today} | Abidjan, Côte d'Ivoire`, pageW/2, y, { align:"center" }); y += 8;
  doc.setFont("helvetica","italic"); doc.setFontSize(9);
  doc.text("Document confidentiel — Usage interne AGL / COMEX", pageW/2, y, { align:"center" });
  addFooter();

  // Sections par métier
  for (let mi = 0; mi < analyses.length; mi++) {
    const A = analyses[mi];
    if (A.empty) continue;
    const schema = A.schema;
    const unit = schema.teuField ? "TEU" : "tonnes";
    const totalUnit = schema.teuField ? A.totalTEU : A.totalWeight;
    const blLabel = schema.type === "maritime" ? "BL" : "LTA";
    const totalMet = schema.teuField ? A.totalTEU : A.totalWeight;
    newPage();
    if (analyses.length > 1) title(`PARTIE ${mi+1} — ${schema.label.toUpperCase()}`, 16);

    title("1. Résumé exécutif");
    para(`L'étude porte sur ${fmt(A.nbBL)} ${blLabel} extraits de la base STATCOM, totalisant ${fmt(totalUnit, schema.teuField?0:2)} ${unit} et ${fmt(A.totalWeight,0)} kg de marchandises. Le périmètre couvre ${A.nbClients} ${schema.clientLabel.toLowerCase()}s uniques, ${A.nbTransitaires} transitaires actifs et ${A.nbArmateurs} ${schema.type==="maritime"?"armateurs":"compagnies"}.`);
    buildInsights(A, schema).forEach(ins => insightBox(ins));

    title("2. Méthodologie et périmètre");
    const periodes = A.byYear.map(y => y.year).join(", ");
    para(`Source : base STATCOM AGL — métier ${schema.label}. ${fmt(A.nbRows)} enregistrements bruts agrégés en ${fmt(A.nbBL)} ${blLabel} uniques.${periodes?" Période couverte : "+periodes+".":""} Sens du flux : ${schema.sens === "import" ? "Imports" : "Exports"}. Métrique principale : ${schema.teuField ? "TEU + Tonnes" : "Tonnes"}.`);

    title("3. Cartographie du corridor");
    if (A.topPortsCharg.length > 0) {
      subtitle(`3.1. Top ${schema.type==="maritime"?"ports":"aéroports"} de chargement`);
      doc.autoTable({
        startY: y,
        head: [["Rang", schema.type==="maritime"?"Port":"Aéroport", `Nb ${blLabel}`, "% du total"]],
        body: A.topPortsCharg.slice(0, 10).map((x, i) => [i+1, x.key, fmt(x.bl), pct(x.bl, A.nbBL)]),
        theme: "grid", styles: { font:"helvetica", fontSize: 9, cellPadding: 2 },
        headStyles: { fillColor: [10,37,64], textColor:[255,255,255], fontStyle:"bold" },
        alternateRowStyles: { fillColor: [248,250,252] }, margin: { left: margin, right: margin }
      });
      y = doc.lastAutoTable.finalY + 5;
    }
    if (A.topPortsDech.length > 0) {
      ensureSpace(40);
      subtitle(`3.2. Top ${schema.type==="maritime"?"ports":"aéroports"} de déchargement`);
      doc.autoTable({
        startY: y, head: [["Rang", schema.type==="maritime"?"Port":"Aéroport", `Nb ${blLabel}`, "% du total"]],
        body: A.topPortsDech.slice(0, 10).map((x, i) => [i+1, x.key, fmt(x.bl), pct(x.bl, A.nbBL)]),
        theme: "grid", styles: { font:"helvetica", fontSize: 9, cellPadding: 2 },
        headStyles: { fillColor: [10,37,64], textColor:[255,255,255], fontStyle:"bold" },
        alternateRowStyles: { fillColor: [248,250,252] }, margin: { left: margin, right: margin }
      });
      y = doc.lastAutoTable.finalY + 5;
    }
    if (A.topPaysOrigine.length > 0) {
      ensureSpace(40); subtitle("3.3. Origines géographiques");
      doc.autoTable({ startY: y, head: [["Rang", "Pays d'origine", `Nb ${blLabel}`, "% du total"]],
        body: A.topPaysOrigine.slice(0, 10).map((x,i) => [i+1, x.key, fmt(x.bl), pct(x.bl, A.nbBL)]),
        theme:"grid", styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[10,37,64],textColor:[255,255,255],fontStyle:"bold"},
        alternateRowStyles:{fillColor:[248,250,252]}, margin:{left:margin,right:margin}});
      y = doc.lastAutoTable.finalY + 5;
    }
    if (A.topPaysDest.length > 0) {
      ensureSpace(40); subtitle("3.4. Destinations géographiques");
      doc.autoTable({ startY: y, head: [["Rang", "Pays de destination", `Nb ${blLabel}`, "% du total"]],
        body: A.topPaysDest.slice(0, 10).map((x,i) => [i+1, x.key, fmt(x.bl), pct(x.bl, A.nbBL)]),
        theme:"grid", styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[10,37,64],textColor:[255,255,255],fontStyle:"bold"},
        alternateRowStyles:{fillColor:[248,250,252]}, margin:{left:margin,right:margin}});
      y = doc.lastAutoTable.finalY + 5;
    }

    ensureSpace(40); title("4. Volumétrie et dynamique temporelle");
    if (A.byYear.length > 0) {
      subtitle("4.1. Évolution annuelle");
      const head = schema.teuField ? ["Année", `Nb ${blLabel}`, "TEU", "Tonnes"] : ["Année", `Nb ${blLabel}`, "Tonnes"];
      const body = A.byYear.map(y => schema.teuField ? [y.year, fmt(y.bl), fmt(y.teu), fmt(y.weight,0)] : [y.year, fmt(y.bl), fmt(y.weight,0)]);
      doc.autoTable({ startY: y, head: [head], body, theme:"grid",
        styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[10,37,64],textColor:[255,255,255],fontStyle:"bold"},
        alternateRowStyles:{fillColor:[248,250,252]}, margin:{left:margin,right:margin}});
      y = doc.lastAutoTable.finalY + 5;
    }
    if (A.tempo.length > 0) {
      ensureSpace(40); subtitle("4.2. Détail mensuel");
      const head = schema.teuField ? ["Année", "Mois", `Nb ${blLabel}`, "TEU", "Tonnes"] : ["Année", "Mois", `Nb ${blLabel}`, "Tonnes"];
      const body = A.tempo.map(t => schema.teuField ? [t.year, t.month, fmt(t.bl), fmt(t.teu), fmt(t.weight,0)] : [t.year, t.month, fmt(t.bl), fmt(t.weight,0)]);
      doc.autoTable({ startY: y, head:[head], body, theme:"grid",
        styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[10,37,64],textColor:[255,255,255],fontStyle:"bold"},
        alternateRowStyles:{fillColor:[248,250,252]}, margin:{left:margin,right:margin}});
      y = doc.lastAutoTable.finalY + 5;
    }

    // 4.3 COMPARAISON N vs N-1
    if (A.yoy) {
      const evolFmt = (v) => v === null || isNaN(v) ? "—" : (v >= 0 ? "+" : "") + fmt(v, 1) + " %";
      const deltaFmt = (d) => (d >= 0 ? "+" : "") + fmt(d, 0);
      // Coloration verte/rouge selon évolution
      const rowStyles = (idx, deltaPct) => {
        const base = idx % 2 === 1 ? [248,250,252] : [255,255,255];
        return { fillColor: base };
      };

      ensureSpace(60); subtitle(`4.3. Comparaison ${A.yoy.curYear} vs ${A.yoy.prevYear}`);
      para(`L'analyse compare les indicateurs entre ${A.yoy.prevYear} et ${A.yoy.curYear} pour identifier les dynamiques de marché.`);

      // Synthèse globale
      ensureSpace(50); subtitle("Synthèse globale");
      const ghead = ["Indicateur", A.yoy.prevYear, A.yoy.curYear, "Δ", "Δ %"];
      const grows = [
        [`${blLabel}`, fmt(A.yoy.bl.prev), fmt(A.yoy.bl.cur), deltaFmt(A.yoy.bl.delta), evolFmt(A.yoy.bl.deltaPct)],
        ...(A.yoy.teu ? [["TEU", fmt(A.yoy.teu.prev), fmt(A.yoy.teu.cur), deltaFmt(A.yoy.teu.delta), evolFmt(A.yoy.teu.deltaPct)]] : []),
        ["Tonnage (kg)", fmt(A.yoy.weight.prev,0), fmt(A.yoy.weight.cur,0), deltaFmt(A.yoy.weight.delta), evolFmt(A.yoy.weight.deltaPct)],
        [`${schema.clientLabel}s`, fmt(A.yoy.clients.prev), fmt(A.yoy.clients.cur), deltaFmt(A.yoy.clients.delta), evolFmt(A.yoy.clients.deltaPct)],
        ["Transitaires", fmt(A.yoy.transitaires.prev), fmt(A.yoy.transitaires.cur), deltaFmt(A.yoy.transitaires.delta), evolFmt(A.yoy.transitaires.deltaPct)],
        [schema.type==="maritime"?"Armateurs":"Compagnies", fmt(A.yoy.armateurs.prev), fmt(A.yoy.armateurs.cur), deltaFmt(A.yoy.armateurs.delta), evolFmt(A.yoy.armateurs.deltaPct)],
        ...(A.yoy.paysOrigine ? [["Pays origine", fmt(A.yoy.paysOrigine.prev), fmt(A.yoy.paysOrigine.cur), deltaFmt(A.yoy.paysOrigine.delta), evolFmt(A.yoy.paysOrigine.deltaPct)]] : []),
        ["Marchandises", fmt(A.yoy.marchandises.prev), fmt(A.yoy.marchandises.cur), deltaFmt(A.yoy.marchandises.delta), evolFmt(A.yoy.marchandises.deltaPct)]
      ];
      doc.autoTable({ startY: y, head: [ghead], body: grows, theme:"grid",
        styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[10,37,64],textColor:[255,255,255],fontStyle:"bold"},
        alternateRowStyles:{fillColor:[248,250,252]}, margin:{left:margin,right:margin},
        didParseCell: (data) => {
          if (data.section === 'body' && data.column.index === 4) {
            const txt = String(data.cell.text[0] || "");
            if (txt.startsWith("+")) data.cell.styles.textColor = [22,163,74];
            else if (txt.startsWith("-")) data.cell.styles.textColor = [220,38,38];
          }
        }});
      y = doc.lastAutoTable.finalY + 5;

      // Par segment
      if (A.yoy.segments) {
        ensureSpace(40); subtitle("Évolution par segment marchandises");
        const shead = ["Segment", "Indicateur", A.yoy.prevYear, A.yoy.curYear, "Δ %"];
        const srows = [
          ["Conteneurisé", blLabel, fmt(A.yoy.segments.conteneurise.bl.prev), fmt(A.yoy.segments.conteneurise.bl.cur), evolFmt(A.yoy.segments.conteneurise.bl.deltaPct)],
          ...(schema.teuField ? [["", "TEU", fmt(A.yoy.segments.conteneurise.teu.prev), fmt(A.yoy.segments.conteneurise.teu.cur), evolFmt(A.yoy.segments.conteneurise.teu.deltaPct)]] : []),
          ["", "Tonnes", fmt(A.yoy.segments.conteneurise.weight.prev,0), fmt(A.yoy.segments.conteneurise.weight.cur,0), evolFmt(A.yoy.segments.conteneurise.weight.deltaPct)],
          ["Conventionnel", blLabel, fmt(A.yoy.segments.conventionnel.bl.prev), fmt(A.yoy.segments.conventionnel.bl.cur), evolFmt(A.yoy.segments.conventionnel.bl.deltaPct)],
          ...(schema.teuField ? [["", "TEU", fmt(A.yoy.segments.conventionnel.teu.prev), fmt(A.yoy.segments.conventionnel.teu.cur), evolFmt(A.yoy.segments.conventionnel.teu.deltaPct)]] : []),
          ["", "Tonnes", fmt(A.yoy.segments.conventionnel.weight.prev,0), fmt(A.yoy.segments.conventionnel.weight.cur,0), evolFmt(A.yoy.segments.conventionnel.weight.deltaPct)]
        ];
        doc.autoTable({ startY: y, head:[shead], body: srows, theme:"grid",
          styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[10,37,64],textColor:[255,255,255],fontStyle:"bold"},
          margin:{left:margin,right:margin},
          didParseCell: (data) => {
            if (data.section === 'body' && data.column.index === 4) {
              const txt = String(data.cell.text[0] || "");
              if (txt.startsWith("+")) data.cell.styles.textColor = [22,163,74];
              else if (txt.startsWith("-")) data.cell.styles.textColor = [220,38,38];
            }
          }});
        y = doc.lastAutoTable.finalY + 5;
      }

      // YoY tables helper
      const yoyTable = (titleTxt, items, labelCol, useBL) => {
        ensureSpace(40); subtitle(titleTxt);
        const h = ["#", labelCol, A.yoy.prevYear, A.yoy.curYear, "Δ %"];
        const b = items.slice(0,10).map((c,i) => [
          i+1, c.key.substring(0,40),
          fmt(useBL ? c.prevBL : c.prevMetric, 0),
          fmt(useBL ? c.curBL : c.curMetric, 0),
          c.deltaPct===null||isNaN(c.deltaPct) ? "NEW" : evolFmt(c.deltaPct)
        ]);
        doc.autoTable({ startY: y, head:[h], body: b, theme:"grid",
          styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[10,37,64],textColor:[255,255,255],fontStyle:"bold"},
          alternateRowStyles:{fillColor:[248,250,252]}, margin:{left:margin,right:margin},
          didParseCell: (data) => {
            if (data.section === 'body' && data.column.index === 4) {
              const txt = String(data.cell.text[0] || "");
              if (txt === "NEW") data.cell.styles.textColor = [124,58,237];
              else if (txt.startsWith("+")) data.cell.styles.textColor = [22,163,74];
              else if (txt.startsWith("-")) data.cell.styles.textColor = [220,38,38];
            }
          }});
        y = doc.lastAutoTable.finalY + 5;
      };

      if (A.yoy.topClients.length > 0) yoyTable(`Top 10 ${schema.clientLabel}s — Évolution (${schema.teuField?"TEU":"Tonnes"})`, A.yoy.topClients, schema.clientLabel, false);
      if (A.yoy.topPaysOrigine.length > 0) yoyTable(`Top 10 pays d'origine — Évolution (${blLabel})`, A.yoy.topPaysOrigine, "Pays", true);
      if (A.yoy.topMarchandises.length > 0) yoyTable(`Top 10 marchandises — Évolution (${schema.teuField?"TEU":"Tonnes"})`, A.yoy.topMarchandises, "Marchandise", false);
      if (A.yoy.topTransitaires.length > 0) yoyTable(`Top 10 transitaires — Évolution (${schema.teuField?"TEU":"Tonnes"})`, A.yoy.topTransitaires, "Transitaire", false);
      if (A.yoy.gagnantsPct.length > 0) yoyTable(`Top 5 gagnants — ${schema.clientLabel}s en croissance %`, A.yoy.gagnantsPct, schema.clientLabel, false);
      if (A.yoy.perdantsPct.length > 0) yoyTable(`Top 5 perdants — ${schema.clientLabel}s en recul %`, A.yoy.perdantsPct, schema.clientLabel, false);
    }

    // 5. Marchandises (segmentation conteneurisé / conventionnel)
    ensureSpace(40); title("5. Marchandises : nature des flux");

    if (A.segments) {
      subtitle("5.1. Segmentation conteneurisé vs conventionnel");
      para("Règle métier — Conteneurisé : 20F/20S/20TOP/40F/40S/40TOP/FLTANK/TANK. Conventionnel/Vrac : BRBK/SACS/CARS/RORO/VRAC.");
      const segHead = schema.teuField
        ? ["Segment", `Nb ${blLabel}`, "TEU", "Tonnes (kg)", `% ${blLabel}`]
        : ["Segment", `Nb ${blLabel}`, "Tonnes (kg)", `% ${blLabel}`];
      const segBody = [
        schema.teuField
          ? ["Conteneurisé", fmt(A.segments.conteneurise.bl), fmt(A.segments.conteneurise.teu), fmt(A.segments.conteneurise.weight,0), pct(A.segments.conteneurise.bl, A.nbBL)]
          : ["Conteneurisé", fmt(A.segments.conteneurise.bl), fmt(A.segments.conteneurise.weight,0), pct(A.segments.conteneurise.bl, A.nbBL)],
        schema.teuField
          ? ["Conventionnel / Vrac", fmt(A.segments.conventionnel.bl), fmt(A.segments.conventionnel.teu), fmt(A.segments.conventionnel.weight,0), pct(A.segments.conventionnel.bl, A.nbBL)]
          : ["Conventionnel / Vrac", fmt(A.segments.conventionnel.bl), fmt(A.segments.conventionnel.weight,0), pct(A.segments.conventionnel.bl, A.nbBL)]
      ];
      doc.autoTable({ startY: y, head: [segHead], body: segBody, theme:"grid",
        styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[201,161,74],textColor:[10,37,64],fontStyle:"bold"},
        alternateRowStyles:{fillColor:[254,249,231]}, margin:{left:margin,right:margin}});
      y = doc.lastAutoTable.finalY + 5;
    }

    // 5.2 Top marchandises CONTENEURISÉES
    if (A.topMarchandisesConteneurise && A.topMarchandisesConteneurise.length > 0) {
      ensureSpace(40); subtitle("5.2. Top 15 marchandises CONTENEURISÉES (tri par TEU)");
      const head = schema.teuField ? ["Rang", "Marchandise", `Nb ${blLabel}`, "TEU", "Tonnes"] : ["Rang", "Marchandise", `Nb ${blLabel}`, "Tonnes"];
      const body = A.topMarchandisesConteneurise.map((x,i) => schema.teuField ? [i+1, x.key.substring(0,40), fmt(x.bl), fmt(x.teu), fmt(x.weight,0)] : [i+1, x.key.substring(0,40), fmt(x.bl), fmt(x.weight,0)]);
      doc.autoTable({ startY: y, head:[head], body, theme:"grid",
        styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[10,37,64],textColor:[255,255,255],fontStyle:"bold"},
        alternateRowStyles:{fillColor:[239,246,255]}, margin:{left:margin,right:margin}});
      y = doc.lastAutoTable.finalY + 5;
    }

    // 5.3 Top marchandises CONVENTIONNELLES
    if (A.topMarchandisesConventionnel && A.topMarchandisesConventionnel.length > 0) {
      ensureSpace(40); subtitle("5.3. Top 15 marchandises CONVENTIONNELLES (tri par tonnage)");
      const head = schema.teuField ? ["Rang", "Marchandise", `Nb ${blLabel}`, "TEU", "Tonnes"] : ["Rang", "Marchandise", `Nb ${blLabel}`, "Tonnes"];
      const body = A.topMarchandisesConventionnel.map((x,i) => schema.teuField ? [i+1, x.key.substring(0,40), fmt(x.bl), fmt(x.teu), fmt(x.weight,0)] : [i+1, x.key.substring(0,40), fmt(x.bl), fmt(x.weight,0)]);
      doc.autoTable({ startY: y, head:[head], body, theme:"grid",
        styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[10,37,64],textColor:[255,255,255],fontStyle:"bold"},
        alternateRowStyles:{fillColor:[255,247,237]}, margin:{left:margin,right:margin}});
      y = doc.lastAutoTable.finalY + 5;
    }

    if (A.byCondit.length > 0) {
      ensureSpace(40); subtitle("5.4. Détail par conditionnement (CODE_CONDIT)");
      doc.autoTable({ startY: y, head:[["Type", `Nb ${blLabel}`, "% du total"]],
        body: A.byCondit.slice(0,10).map(x => [x.key, fmt(x.bl), pct(x.bl, A.nbBL)]),
        theme:"grid", styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[10,37,64],textColor:[255,255,255],fontStyle:"bold"},
        alternateRowStyles:{fillColor:[248,250,252]}, margin:{left:margin,right:margin}});
      y = doc.lastAutoTable.finalY + 5;
    }
    if (A.byModeExp.length > 0) {
      ensureSpace(40); subtitle("5.5. Mode d'expédition");
      doc.autoTable({ startY: y, head:[["Mode", `Nb ${blLabel}`, "% du total"]],
        body: A.byModeExp.slice(0,10).map(x => [x.key, fmt(x.bl), pct(x.bl, A.nbBL)]),
        theme:"grid", styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[10,37,64],textColor:[255,255,255],fontStyle:"bold"},
        alternateRowStyles:{fillColor:[248,250,252]}, margin:{left:margin,right:margin}});
      y = doc.lastAutoTable.finalY + 5;
    }

    ensureSpace(40); title("6. Paysage concurrentiel");
    if (A.topArmateurs.length > 0) {
      subtitle(`6.1. Top ${schema.type==="maritime"?"armateurs":"compagnies"}`);
      const head = schema.teuField ? ["Rang", "Armateur", `Nb ${blLabel}`, "TEU", "% TEU"] : ["Rang", "Compagnie", `Nb ${blLabel}`, "Tonnes", "% Tonnes"];
      const body = A.topArmateurs.map((x,i) => schema.teuField ? [i+1, x.key.substring(0,35), fmt(x.bl), fmt(x.teu), pct(x.teu, totalMet)] : [i+1, x.key.substring(0,35), fmt(x.bl), fmt(x.weight,0), pct(x.weight, totalMet)]);
      doc.autoTable({ startY: y, head:[head], body, theme:"grid",
        styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[10,37,64],textColor:[255,255,255],fontStyle:"bold"},
        alternateRowStyles:{fillColor:[248,250,252]}, margin:{left:margin,right:margin}});
      y = doc.lastAutoTable.finalY + 5;
    }
    if (A.topTransitaires.length > 0) {
      ensureSpace(40); subtitle("6.2. Top transitaires");
      const head = schema.teuField ? ["Rang", "Transitaire", `Nb ${blLabel}`, "TEU", "% TEU"] : ["Rang", "Transitaire", `Nb ${blLabel}`, "Tonnes", "% Tonnes"];
      const body = A.topTransitaires.map((x,i) => schema.teuField ? [i+1, x.key.substring(0,35), fmt(x.bl), fmt(x.teu), pct(x.teu, totalMet)] : [i+1, x.key.substring(0,35), fmt(x.bl), fmt(x.weight,0), pct(x.weight, totalMet)]);
      doc.autoTable({ startY: y, head:[head], body, theme:"grid",
        styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[10,37,64],textColor:[255,255,255],fontStyle:"bold"},
        alternateRowStyles:{fillColor:[248,250,252]}, margin:{left:margin,right:margin}});
      y = doc.lastAutoTable.finalY + 5;
    }

    // 6.3 Zoom AGL Transitaire
    if (A.aglTransit) {
      const a = A.aglTransit;
      ensureSpace(60); subtitle("6.3. Zoom Africa Global Logistics (Transitaire)");
      para(`AGL occupe le rang n°${a.rank} sur ${a.totalTransitaires} transitaires identifiés. Part de marché : ${fmt(a.pdmMetric,1)} % en ${schema.teuField?"TEU":"tonnes"} et ${fmt(a.pdmBL,1)} % en nombre de ${blLabel}.`);
      insightBox(`Position AGL : ${fmt(a.pdmMetric,1)} % de PDM en ${schema.teuField?"TEU":"tonnes"} | ${fmt(a.bl)} ${blLabel} | ${fmt(a.pdmBL,1)} % des dossiers`);
      // Tableau AGL vs marché
      const aglHead = ["Indicateur", "Valeur AGL", "Marché total", "Part AGL"];
      const aglBody = [[`${blLabel} traités`, fmt(a.bl), fmt(A.nbBL), pct(a.bl, A.nbBL)]];
      if (schema.teuField) aglBody.push(["TEU", fmt(a.teu), fmt(A.totalTEU), pct(a.teu, A.totalTEU)]);
      aglBody.push(["Tonnage (kg)", fmt(a.weight,0), fmt(A.totalWeight,0), pct(a.weight, A.totalWeight)]);
      doc.autoTable({ startY: y, head: [aglHead], body: aglBody, theme:"grid",
        styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[201,161,74],textColor:[10,37,64],fontStyle:"bold"},
        alternateRowStyles:{fillColor:[254,249,231]}, margin:{left:margin,right:margin}});
      y = doc.lastAutoTable.finalY + 5;
      if (a.byYear && a.byYear.length > 0) {
        ensureSpace(40); subtitle("Évolution annuelle AGL");
        const evolHead = schema.teuField ? ["Année", `Nb ${blLabel}`, "TEU", "Tonnes"] : ["Année", `Nb ${blLabel}`, "Tonnes"];
        const evolBody = a.byYear.map(y2 => schema.teuField ? [y2.year, fmt(y2.bl), fmt(y2.teu), fmt(y2.weight,0)] : [y2.year, fmt(y2.bl), fmt(y2.weight,0)]);
        doc.autoTable({ startY: y, head:[evolHead], body: evolBody, theme:"grid",
          styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[10,37,64],textColor:[255,255,255],fontStyle:"bold"},
          alternateRowStyles:{fillColor:[248,250,252]}, margin:{left:margin,right:margin}});
        y = doc.lastAutoTable.finalY + 5;
        if (a.evol) {
          const v = schema.teuField ? a.evol.teuEvolPct : a.evol.weightEvolPct;
          if (v !== null && !isNaN(v)) {
            const dir = v >= 0 ? "progression" : "recul";
            para(`Évolution ${a.evol.year} vs ${a.evol.prevYear} : ${dir} de ${fmt(Math.abs(v),1)} % en ${schema.teuField?"TEU":"tonnes"}.`);
          }
        }
      }
    }

    ensureSpace(40); title(`7. ${schema.clientLabel}s : segmentation`);
    if (A.top5Share > 0) para(`Top 5 ${schema.clientLabel.toLowerCase()}s = ${fmt(A.top5Share,1)} % des volumes. Top 10 ${schema.clientLabel.toLowerCase()}s = ${fmt(A.top10Share,1)} %.`);
    if (A.topClients.length > 0) {
      subtitle(`7.1. Top 20 ${schema.clientLabel.toLowerCase()}s`);
      const head = schema.teuField ? ["#", schema.clientLabel, `Nb ${blLabel}`, "TEU", "%", "Cum %"] : ["#", schema.clientLabel, `Nb ${blLabel}`, "Tonnes", "%", "Cum %"];
      const body = A.paretoClients.slice(0,20).map((x,i) => schema.teuField ? [i+1, x.key.substring(0,30), fmt(x.bl), fmt(x.teu), pct(x.teu, totalMet), fmt(x.cumPct,1)+"%"] : [i+1, x.key.substring(0,30), fmt(x.bl), fmt(x.weight,0), pct(x.weight, totalMet), fmt(x.cumPct,1)+"%"]);
      doc.autoTable({ startY: y, head:[head], body, theme:"grid",
        styles:{font:"helvetica",fontSize:8,cellPadding:1.5}, headStyles:{fillColor:[10,37,64],textColor:[255,255,255],fontStyle:"bold"},
        alternateRowStyles:{fillColor:[248,250,252]}, margin:{left:margin,right:margin}});
      y = doc.lastAutoTable.finalY + 5;
    }
    if (A.topLieuxLiv.length > 0) {
      ensureSpace(40); subtitle("7.2. Lieux de livraison");
      const head = schema.teuField ? ["Lieu de livraison", `Nb ${blLabel}`, "TEU", "% TEU"] : ["Lieu de livraison", `Nb ${blLabel}`, "Tonnes", "% Tonnes"];
      const body = A.topLieuxLiv.map(x => schema.teuField ? [x.key.substring(0,40), fmt(x.bl), fmt(x.teu), pct(x.teu, totalMet)] : [x.key.substring(0,40), fmt(x.bl), fmt(x.weight,0), pct(x.weight, totalMet)]);
      doc.autoTable({ startY: y, head:[head], body, theme:"grid",
        styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[10,37,64],textColor:[255,255,255],fontStyle:"bold"},
        alternateRowStyles:{fillColor:[248,250,252]}, margin:{left:margin,right:margin}});
      y = doc.lastAutoTable.finalY + 5;
    }
  }

  // Footers sur toutes les pages
  const totalPages = doc.internal.getNumberOfPages();
  for (let i=1; i<=totalPages; i++) { doc.setPage(i); addFooter(); }
  doc.save(options.filename + ".pdf");
}

// ---------- PPTX ----------
function generatePPTX(analyses, options) {
  const pptx = new PptxGenJS();
  pptx.layout = "LAYOUT_WIDE";
  pptx.title = options.title || "AGL Strategic Report";

  const navy = "0A2540", gold = "C9A14A", lightBg = "F1F5F9", textDark = "333333", textLight = "FFFFFF";

  const addHeader = (slide, sectionLabel) => {
    slide.addShape("rect", { x:0, y:0, w:13.33, h:0.4, fill:{color: navy} });
    slide.addShape("rect", { x:0, y:0.4, w:13.33, h:0.05, fill:{color: gold} });
    slide.addText("AGL — DIRECTION STRATÉGIE", { x:0.3, y:0.05, w:6, h:0.3, fontSize:11, bold:true, color: textLight, fontFace:"Calibri" });
    slide.addText(sectionLabel || "Étude STATCOM", { x:7, y:0.05, w:6, h:0.3, fontSize:10, color: textLight, fontFace:"Calibri", align:"right" });
  };
  const addFooter = (slide, pageIdx, totalPages) => {
    slide.addShape("rect", { x:0, y:7.0, w:13.33, h:0.5, fill:{color: lightBg} });
    slide.addText("Confidentiel — Usage interne AGL / COMEX", { x:0.3, y:7.1, w:8, h:0.3, fontSize:9, italic:true, color: GRAY, fontFace:"Calibri" });
    slide.addText(`${pageIdx} / ${totalPages}`, { x:12, y:7.1, w:1, h:0.3, fontSize:9, color: GRAY, fontFace:"Calibri", align:"right" });
  };

  // --- Slide de garde ---
  const slidesAdded = [];
  const cover = pptx.addSlide();
  slidesAdded.push(cover);
  cover.background = { color: "FFFFFF" };
  cover.addShape("rect", { x:0, y:0, w:13.33, h:1.5, fill:{color: navy} });
  cover.addShape("rect", { x:0, y:1.5, w:13.33, h:0.08, fill:{color: gold} });
  cover.addText("AFRICA GLOBAL LOGISTICS", { x:0.5, y:0.4, w:12.33, h:0.6, fontSize:32, bold:true, color: textLight, fontFace:"Calibri", align:"center" });
  cover.addText("DIRECTION MARKETING — DIVISION STRATÉGIE", { x:0.5, y:1.0, w:12.33, h:0.4, fontSize:16, color: gold, fontFace:"Calibri", align:"center", bold:true });
  cover.addText("ÉTUDE STRATÉGIQUE", { x:0.5, y:2.5, w:12.33, h:0.5, fontSize:18, color: GRAY, fontFace:"Calibri", align:"center" });
  cover.addText(options.title || "Analyse des flux STATCOM", { x:0.5, y:3.0, w:12.33, h:0.8, fontSize:36, bold:true, color: navy, fontFace:"Calibri", align:"center" });
  if (options.subtitle) cover.addText(options.subtitle, { x:0.5, y:3.9, w:12.33, h:0.6, fontSize:16, italic:true, color: textDark, fontFace:"Calibri", align:"center" });
  cover.addText("Source : Base STATCOM — Africa Global Logistics", { x:0.5, y:5.5, w:12.33, h:0.3, fontSize:13, color: GRAY, fontFace:"Calibri", align:"center" });
  const today = new Date().toLocaleDateString("fr-FR", { year:"numeric", month:"long", day:"numeric" });
  cover.addText(`${today} | Abidjan, Côte d'Ivoire`, { x:0.5, y:5.9, w:12.33, h:0.3, fontSize:14, bold:true, color: navy, fontFace:"Calibri", align:"center" });
  cover.addText("Document confidentiel — Usage interne AGL / COMEX", { x:0.5, y:6.5, w:12.33, h:0.3, fontSize:11, italic:true, color: GRAY, fontFace:"Calibri", align:"center" });

  // Helpers
  const makeSlide = (sectionLabel) => { const s = pptx.addSlide(); s.background = { color: "FFFFFF" }; slidesAdded.push(s); addHeader(s, sectionLabel); return s; };
  const slideTitle = (slide, text) => {
    slide.addText(text, { x:0.5, y:0.7, w:12.33, h:0.6, fontSize:24, bold:true, color: navy, fontFace:"Calibri" });
    slide.addShape("rect", { x:0.5, y:1.25, w:1.2, h:0.04, fill:{color: gold} });
  };
  const addTable = (slide, headers, rows, x, y, w, h, opts={}) => {
    const colW = opts.colW || headers.map(() => w/headers.length);
    const headerRow = headers.map(h => ({ text:h, options:{ bold:true, color:textLight, fill:{color:navy}, fontSize: opts.fontSize||10, fontFace:"Calibri", align:"left", valign:"middle" }}));
    const bodyRows = rows.map((r, idx) => r.map(c => ({ text:String(c), options:{ color:textDark, fill: idx%2===1?{color:"F8FAFC"}:undefined, fontSize: opts.fontSize||10, fontFace:"Calibri", align:"left", valign:"middle" }})));
    slide.addTable([headerRow, ...bodyRows], { x, y, w, h, colW, border:{type:"solid", color:"CCCCCC", pt:0.5}, fontSize: opts.fontSize||10 });
  };
  const kpiBox = (slide, x, y, w, h, value, label) => {
    slide.addShape("rect", { x, y, w, h, fill:{color:"FFFFFF"}, line:{color:"E2E8F0", width:1} });
    slide.addShape("rect", { x, y, w:0.08, h, fill:{color:gold} });
    slide.addText(value, { x: x+0.2, y: y+0.1, w: w-0.3, h: h*0.55, fontSize: 22, bold:true, color: navy, fontFace:"Calibri" });
    slide.addText(label, { x: x+0.2, y: y+h*0.55, w: w-0.3, h: h*0.4, fontSize: 9, color: GRAY, fontFace:"Calibri" });
  };

  // Sommaire
  const toc = makeSlide("Sommaire");
  slideTitle(toc, "Sommaire");
  let tocLines = [
    { text: "1. Résumé exécutif", options: { fontSize:14, color: navy, fontFace:"Calibri", bullet:{type:"number"} } },
    { text: "2. Méthodologie et périmètre", options: { fontSize:14, color: navy, fontFace:"Calibri", bullet:{type:"number"} } },
    { text: "3. Cartographie du corridor", options: { fontSize:14, color: navy, fontFace:"Calibri", bullet:{type:"number"} } },
    { text: "4. Volumétrie et dynamique temporelle", options: { fontSize:14, color: navy, fontFace:"Calibri", bullet:{type:"number"} } },
    { text: "5. Marchandises : nature des flux", options: { fontSize:14, color: navy, fontFace:"Calibri", bullet:{type:"number"} } },
    { text: "6. Paysage concurrentiel", options: { fontSize:14, color: navy, fontFace:"Calibri", bullet:{type:"number"} } },
    { text: "7. Clients finaux : segmentation", options: { fontSize:14, color: navy, fontFace:"Calibri", bullet:{type:"number"} } }
  ];
  toc.addText(tocLines, { x:1, y:1.8, w:11, h:4 });

  for (let mi = 0; mi < analyses.length; mi++) {
    const A = analyses[mi];
    if (A.empty) continue;
    const schema = A.schema;
    const sectionLabel = analyses.length > 1 ? `${schema.label}` : "Étude STATCOM";
    const unit = schema.teuField ? "TEU" : "tonnes";
    const totalUnit = schema.teuField ? A.totalTEU : A.totalWeight;
    const blLabel = schema.type === "maritime" ? "BL" : "LTA";
    const totalMet = schema.teuField ? A.totalTEU : A.totalWeight;

    // Slide intro métier
    if (analyses.length > 1) {
      const intro = makeSlide(sectionLabel);
      intro.addShape("rect", { x:0, y:2.5, w:13.33, h:2, fill:{color: navy} });
      intro.addText(`PARTIE ${mi+1}`, { x:0.5, y:2.7, w:12.33, h:0.5, fontSize:18, color: gold, bold:true, fontFace:"Calibri", align:"center" });
      intro.addText(schema.label.toUpperCase(), { x:0.5, y:3.2, w:12.33, h:0.8, fontSize:40, color: textLight, bold:true, fontFace:"Calibri", align:"center" });
    }

    // KPIs
    const s1 = makeSlide(sectionLabel);
    slideTitle(s1, "1. Résumé exécutif");
    kpiBox(s1, 0.5, 1.7, 3, 1.2, fmt(A.nbBL), `${blLabel} qualifiés`);
    if (schema.teuField) kpiBox(s1, 3.7, 1.7, 3, 1.2, fmt(A.totalTEU), "TEU totaux");
    else kpiBox(s1, 3.7, 1.7, 3, 1.2, fmt(A.totalWeight, 0), "Kg de marchandises");
    kpiBox(s1, 6.9, 1.7, 3, 1.2, fmt(A.nbClients), `${schema.clientLabel}s uniques`);
    kpiBox(s1, 10.1, 1.7, 2.83, 1.2, fmt(A.nbTransitaires), "Transitaires");

    const insights = buildInsights(A, schema).slice(0, 4);
    let iy = 3.2;
    insights.forEach(ins => {

      addTable(s5, head, body, 0.5, 1.85, 6, 4.5, { fontSize:10, colW:[0.4, 2.6, 1, 1, 1] });
    }
    if (A.topTransitaires.length > 0) {
      s5.addText("Top transitaires", { x:6.8, y:1.5, w:6, h:0.3, fontSize:13, bold:true, color: navy, fontFace:"Calibri" });
      const head = schema.teuField ? ["#", "Transitaire", `${blLabel}`, "TEU", "%"] : ["#", "Transitaire", `${blLabel}`, "Tonnes", "%"];
      const body = A.topTransitaires.slice(0, 10).map((x,i) => schema.teuField ? [i+1, x.key.substring(0,25), fmt(x.bl), fmt(x.teu), pct(x.teu, totalMet)] : [i+1, x.key.substring(0,25), fmt(x.bl), fmt(x.weight,0), pct(x.weight, totalMet)]);
      addTable(s5, head, body, 6.8, 1.85, 6, 4.5, { fontSize:10, colW:[0.4, 2.6, 1, 1, 1] });
    }

    // Slide 5bis — Zoom AGL (dédiée)
    if (A.aglTransit) {
      const a = A.aglTransit;
      const sAGL = makeSlide(sectionLabel);
      slideTitle(sAGL, "6.3. Zoom Africa Global Logistics");
      // KPIs AGL (encadré gold)
      sAGL.addShape("rect", { x:0.5, y:1.6, w:12.33, h:1.3, fill:{color:"FEF9E7"}, line:{color:gold, width:1} });
      sAGL.addShape("rect", { x:0.5, y:1.6, w:0.08, h:1.3, fill:{color:gold} });
      // KPI 1
      sAGL.addText("Rang AGL", { x:0.8, y:1.7, w:2.8, h:0.3, fontSize:11, color: GRAY, fontFace:"Calibri" });
      sAGL.addText(`n°${a.rank}`, { x:0.8, y:2.0, w:2.8, h:0.7, fontSize:32, bold:true, color: navy, fontFace:"Calibri" });
      sAGL.addText(`sur ${a.totalTransitaires} transitaires`, { x:0.8, y:2.6, w:2.8, h:0.25, fontSize:10, italic:true, color: GRAY, fontFace:"Calibri" });
      // KPI 2
      sAGL.addText(`PDM ${schema.teuField?"TEU":"Tonnes"}`, { x:3.8, y:1.7, w:2.8, h:0.3, fontSize:11, color: GRAY, fontFace:"Calibri" });
      sAGL.addText(`${fmt(a.pdmMetric,1)} %`, { x:3.8, y:2.0, w:2.8, h:0.7, fontSize:32, bold:true, color: gold, fontFace:"Calibri" });
      sAGL.addText(`${fmt(schema.teuField?a.teu:a.weight, 0)} ${schema.teuField?"TEU":"kg"}`, { x:3.8, y:2.6, w:2.8, h:0.25, fontSize:10, italic:true, color: GRAY, fontFace:"Calibri" });
      // KPI 3
      sAGL.addText(`${blLabel} traités`, { x:6.8, y:1.7, w:2.8, h:0.3, fontSize:11, color: GRAY, fontFace:"Calibri" });
      sAGL.addText(fmt(a.bl), { x:6.8, y:2.0, w:2.8, h:0.7, fontSize:32, bold:true, color: navy, fontFace:"Calibri" });
      sAGL.addText(`sur ${fmt(A.nbBL)} (${fmt(a.pdmBL,1)} %)`, { x:6.8, y:2.6, w:2.8, h:0.25, fontSize:10, italic:true, color: GRAY, fontFace:"Calibri" });
      // KPI 4 — évolution
      sAGL.addText("Évolution N vs N-1", { x:9.8, y:1.7, w:2.8, h:0.3, fontSize:11, color: GRAY, fontFace:"Calibri" });
      if (a.evol) {
        const v = schema.teuField ? a.evol.teuEvolPct : a.evol.weightEvolPct;
        if (v !== null && !isNaN(v)) {
          const color = v >= 0 ? "16A34A" : "DC2626";
          sAGL.addText(`${v>=0?"+":""}${fmt(v,1)} %`, { x:9.8, y:2.0, w:2.8, h:0.7, fontSize:32, bold:true, color, fontFace:"Calibri" });
          sAGL.addText(`${a.evol.year} vs ${a.evol.prevYear}`, { x:9.8, y:2.6, w:2.8, h:0.25, fontSize:10, italic:true, color: GRAY, fontFace:"Calibri" });
        } else { sAGL.addText("—", { x:9.8, y:2.0, w:2.8, h:0.7, fontSize:32, bold:true, color: GRAY, fontFace:"Calibri" }); }
      } else { sAGL.addText("—", { x:9.8, y:2.0, w:2.8, h:0.7, fontSize:32, bold:true, color: GRAY, fontFace:"Calibri" }); }

      // Tableau AGL vs Marché
      sAGL.addText("AGL vs Marché", { x:0.5, y:3.2, w:6, h:0.3, fontSize:13, bold:true, color: navy, fontFace:"Calibri" });
      const aglRows = [["Indicateur", "AGL", "Marché", "Part"]];
      aglRows.push([`${blLabel}`, fmt(a.bl), fmt(A.nbBL), pct(a.bl, A.nbBL)]);
      if (schema.teuField) aglRows.push(["TEU", fmt(a.teu), fmt(A.totalTEU), pct(a.teu, A.totalTEU)]);
      aglRows.push(["Tonnes (kg)", fmt(a.weight,0), fmt(A.totalWeight,0), pct(a.weight, A.totalWeight)]);
      const formattedRows = aglRows.map((r, idx) => r.map(c => ({ text: String(c), options: { bold: idx===0, color: idx===0?textLight:textDark, fill: idx===0?{color:navy}:(idx%2===1?{color:"F8FAFC"}:undefined), fontSize: 11, fontFace:"Calibri" }})));
      sAGL.addTable(formattedRows, { x:0.5, y:3.55, w:6, h:2.5, colW:[1.8, 1.4, 1.4, 1.4], border:{type:"solid", color:"CCCCCC", pt:0.5} });

      // Évolution annuelle AGL
      if (a.byYear && a.byYear.length > 0) {
        sAGL.addText("Évolution annuelle AGL", { x:6.8, y:3.2, w:6, h:0.3, fontSize:13, bold:true, color: navy, fontFace:"Calibri" });
        const evolHead = schema.teuField ? ["Année", `${blLabel}`, "TEU", "Tonnes"] : ["Année", `${blLabel}`, "Tonnes"];
        const evolBody = a.byYear.map(y2 => schema.teuField ? [y2.year, fmt(y2.bl), fmt(y2.teu), fmt(y2.weight,0)] : [y2.year, fmt(y2.bl), fmt(y2.weight,0)]);
        const allRows = [evolHead, ...evolBody];
        const fmtRows = allRows.map((r, idx) => r.map(c => ({ text: String(c), options: { bold: idx===0, color: idx===0?textLight:textDark, fill: idx===0?{color:navy}:(idx%2===1?{color:"F8FAFC"}:undefined), fontSize: 11, fontFace:"Calibri" }})));
        sAGL.addTable(fmtRows, { x:6.8, y:3.55, w:6, h:2.5, colW: schema.teuField?[1.5,1.5,1.5,1.5]:[2,2,2], border:{type:"solid", color:"CCCCCC", pt:0.5} });
      }
    }

    // Slide 6 — Clients
    if (A.topClients.length > 0) {
      const s6 = makeSlide(sectionLabel);
      slideTitle(s6, `7. Top 15 ${schema.clientLabel.toLowerCase()}s`);
      if (A.top5Share > 0) s6.addText(`Concentration : Top 5 = ${fmt(A.top5Share,1)} %, Top 10 = ${fmt(A.top10Share,1)} %`, { x:0.5, y:1.45, w:12, h:0.3, fontSize:12, color: textDark, italic:true, fontFace:"Calibri" });
      const head = schema.teuField ? ["#", schema.clientLabel, `Nb ${blLabel}`, "TEU", "%", "Cum %"] : ["#", schema.clientLabel, `Nb ${blLabel}`, "Tonnes", "%", "Cum %"];
      const body = A.paretoClients.slice(0,15).map((x,i) => schema.teuField ? [i+1, x.key.substring(0,40), fmt(x.bl), fmt(x.teu), pct(x.teu, totalMet), fmt(x.cumPct,1)+"%"] : [i+1, x.key.substring(0,40), fmt(x.bl), fmt(x.weight,0), pct(x.weight, totalMet), fmt(x.cumPct,1)+"%"]);
      addTable(s6, head, body, 0.5, 1.8, 12.33, 5, { fontSize: 10, colW:[0.5, 5, 1.5, 1.83, 1.5, 2] });
    }
  }

  // Footer numéroté
  const total = slidesAdded.length;
  slidesAdded.forEach((s, idx) => addFooter(s, idx+1, total));

  pptx.writeFile({ fileName: options.filename + ".pptx" });
}

// ============================================================
// GÉNÉRATION HTML AUTOPORTEUR (style CAP Strategic Analytics)
// ============================================================
function generateHTML(analyses, options) {
  const NAVY = "#0a2540", GOLD = "#c9a14a", LIGHT = "#f1f5f9";
  const today = new Date().toLocaleDateString("fr-FR", { year:"numeric", month:"long", day:"numeric" });

  // Helper : couleur évolution
  const evolColor = (v) => v === null || v === undefined || isNaN(v) ? "#64748b" : (v >= 0 ? "#16a34a" : "#dc2626");
  const evolFmt = (v) => v === null || v === undefined || isNaN(v) ? "—" : (v >= 0 ? "+" : "") + fmt(v, 1) + " %";
  const newOrEvol = (v, prev) => {
    if (v === null || v === undefined || isNaN(v)) return prev === 0 ? "NEW" : "—";
    return (v >= 0 ? "+" : "") + fmt(v, 1) + " %";
  };

  // ----- Render KPIs -----
  const renderKPIs = (A) => {
    const schema = A.schema;
    const blLabel = schema.type === "maritime" ? "BL" : "LTA";
    return `
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-value">${fmt(A.nbBL)}</div><div class="kpi-label">${blLabel} qualifiés</div></div>
        ${schema.teuField ? `<div class="kpi-card"><div class="kpi-value">${fmt(A.totalTEU)}</div><div class="kpi-label">TEU totaux</div></div>` : ''}
        <div class="kpi-card"><div class="kpi-value">${fmt(A.totalWeight, 0)}</div><div class="kpi-label">Kg de marchandise</div></div>
        <div class="kpi-card"><div class="kpi-value">${fmt(A.nbClients)}</div><div class="kpi-label">${schema.clientLabel}s uniques</div></div>
      </div>
    `;
  };

  const renderInsights = (A) => buildInsights(A, A.schema).map(ins => `<div class="insight-box">▸ ${escapeHtml(ins)}</div>`).join("");

  const escapeHtml = (s) => String(s||"").replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ----- Render section YoY -----
  const renderYoY = (A) => {
    if (!A.yoy) return "";
    const schema = A.schema;
    const blLabel = schema.type === "maritime" ? "BL" : "LTA";
    const deltaFmt = (d) => (d >= 0 ? "+" : "") + fmt(d, 0);
    const ind = (lbl, d, dec=0) => `
      <tr>
        <td><strong>${lbl}</strong></td><td>${fmt(d.prev, dec)}</td><td>${fmt(d.cur, dec)}</td>
        <td>${deltaFmt(d.delta)}</td>
        <td style="color:${evolColor(d.deltaPct)};font-weight:600;">${evolFmt(d.deltaPct)}</td>
      </tr>`;
    let segHtml = "";
    if (A.yoy.segments) {
      const sb = (lbl, d) => `<tr><td>${lbl}</td><td>${fmt(d.prev, 0)}</td><td>${fmt(d.cur, 0)}</td><td style="color:${evolColor(d.deltaPct)};font-weight:600;">${evolFmt(d.deltaPct)}</td></tr>`;
      segHtml = `
        <h4>Évolution par segment marchandises</h4>
        <table class="report-table">
          <thead><tr><th>Segment</th><th>Indicateur</th><th>${A.yoy.prevYear}</th><th>${A.yoy.curYear}</th><th>Δ %</th></tr></thead>
          <tbody>
            <tr style="background:#eff6ff;"><td rowspan="${schema.teuField?3:2}"><strong style="color:#1e3a8a;">📦 Conteneurisé</strong></td><td>${blLabel}</td><td>${fmt(A.yoy.segments.conteneurise.bl.prev)}</td><td>${fmt(A.yoy.segments.conteneurise.bl.cur)}</td><td style="color:${evolColor(A.yoy.segments.conteneurise.bl.deltaPct)};font-weight:600;">${evolFmt(A.yoy.segments.conteneurise.bl.deltaPct)}</td></tr>
            ${schema.teuField ? `<tr style="background:#eff6ff;"><td>TEU</td><td>${fmt(A.yoy.segments.conteneurise.teu.prev)}</td><td>${fmt(A.yoy.segments.conteneurise.teu.cur)}</td><td style="color:${evolColor(A.yoy.segments.conteneurise.teu.deltaPct)};font-weight:600;">${evolFmt(A.yoy.segments.conteneurise.teu.deltaPct)}</td></tr>` : ''}
            <tr style="background:#eff6ff;"><td>Tonnes</td><td>${fmt(A.yoy.segments.conteneurise.weight.prev, 0)}</td><td>${fmt(A.yoy.segments.conteneurise.weight.cur, 0)}</td><td style="color:${evolColor(A.yoy.segments.conteneurise.weight.deltaPct)};font-weight:600;">${evolFmt(A.yoy.segments.conteneurise.weight.deltaPct)}</td></tr>
            <tr style="background:#fff7ed;"><td rowspan="${schema.teuField?3:2}"><strong style="color:#9a3412;">⚓ Conventionnel</strong></td><td>${blLabel}</td><td>${fmt(A.yoy.segments.conventionnel.bl.prev)}</td><td>${fmt(A.yoy.segments.conventionnel.bl.cur)}</td><td style="color:${evolColor(A.yoy.segments.conventionnel.bl.deltaPct)};font-weight:600;">${evolFmt(A.yoy.segments.conventionnel.bl.deltaPct)}</td></tr>
            ${schema.teuField ? `<tr style="background:#fff7ed;"><td>TEU</td><td>${fmt(A.yoy.segments.conventionnel.teu.prev)}</td><td>${fmt(A.yoy.segments.conventionnel.teu.cur)}</td><td style="color:${evolColor(A.yoy.segments.conventionnel.teu.deltaPct)};font-weight:600;">${evolFmt(A.yoy.segments.conventionnel.teu.deltaPct)}</td></tr>` : ''}
            <tr style="background:#fff7ed;"><td>Tonnes</td><td>${fmt(A.yoy.segments.conventionnel.weight.prev, 0)}</td><td>${fmt(A.yoy.segments.conventionnel.weight.cur, 0)}</td><td style="color:${evolColor(A.yoy.segments.conventionnel.weight.deltaPct)};font-weight:600;">${evolFmt(A.yoy.segments.conventionnel.weight.deltaPct)}</td></tr>
          </tbody>
        </table>`;
    }

    // Helpers Top YoY
    const renderTopYoy = (title, items, labelCol, useBL = false) => {
      if (!items || items.length === 0) return "";
      const rows = items.slice(0, 10).map((c, i) => {
        const prev = useBL ? c.prevBL : c.prevMetric;
        const cur = useBL ? c.curBL : c.curMetric;
        const isAGLrow = (c.key || "").toUpperCase().includes("AFRICA GLOBAL LOGISTICS") || (c.key || "").toUpperCase().includes("BOLLOR");
        return `<tr ${isAGLrow ? 'style="background:#fef9e7;font-weight:600;"' : ''}>
          <td>${i+1}</td>
          <td>${escapeHtml(c.key.substring(0,55))}${isAGLrow ? '<span class="agl-badge">AGL</span>' : ''}</td>
          <td>${fmt(prev, 0)}</td>
          <td>${fmt(cur, 0)}</td>
          <td style="color:${c.deltaPct===null||isNaN(c.deltaPct)?'#7c3aed':evolColor(c.deltaPct)};font-weight:600;">${newOrEvol(c.deltaPct, prev)}</td>
        </tr>`;
      }).join("");
      return `<h4>${title}</h4>
        <table class="report-table">
          <thead><tr><th>#</th><th>${labelCol}</th><th>${A.yoy.prevYear}</th><th>${A.yoy.curYear}</th><th>Δ %</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    };

    return `
      <h3 class="section-h"><span class="yoy-badge">YoY</span> Comparaison ${A.yoy.curYear} vs ${A.yoy.prevYear}</h3>
      <h4>Synthèse globale</h4>
      <table class="report-table">
        <thead><tr><th>Indicateur</th><th>${A.yoy.prevYear}</th><th>${A.yoy.curYear}</th><th>Δ Valeur</th><th>Δ %</th></tr></thead>
        <tbody>
          ${ind(`${blLabel} qualifiés`, A.yoy.bl)}
          ${A.yoy.teu ? ind("TEU", A.yoy.teu) : ""}
          ${ind("Tonnage (kg)", A.yoy.weight)}
          ${ind(`${schema.clientLabel}s uniques`, A.yoy.clients)}
          ${ind("Transitaires actifs", A.yoy.transitaires)}
          ${ind(schema.type==="maritime"?"Armateurs":"Compagnies", A.yoy.armateurs)}
          ${A.yoy.paysOrigine ? ind("Pays d'origine", A.yoy.paysOrigine) : ""}
          ${ind("Marchandises distinctes", A.yoy.marchandises)}
        </tbody>
      </table>
      ${segHtml}
      ${renderTopYoy(`Top ${schema.clientLabel}s — Évolution (${schema.teuField?"TEU":"Tonnes"})`, A.yoy.topClients, schema.clientLabel)}
      ${renderTopYoy(`Top pays d'origine — Évolution (${blLabel})`, A.yoy.topPaysOrigine, "Pays", true)}
      ${renderTopYoy(`Top marchandises — Évolution (${schema.teuField?"TEU":"Tonnes"})`, A.yoy.topMarchandises, "Marchandise")}
      ${renderTopYoy(`Top transitaires — Évolution (${schema.teuField?"TEU":"Tonnes"})`, A.yoy.topTransitaires, "Transitaire")}
    `;
  };

  // ----- Render Zoom AGL -----
  const renderZoomAGL = (A) => {
    if (!A.aglTransit) return "";
    const a = A.aglTransit;
    const schema = A.schema;
    const blLabel = schema.type === "maritime" ? "BL" : "LTA";
    const evolV = a.evol ? (schema.teuField ? a.evol.teuEvolPct : a.evol.weightEvolPct) : null;
    let yearTbl = "";
    if (a.byYear && a.byYear.length > 0) {
      yearTbl = `<h4>Évolution annuelle AGL</h4>
        <table class="report-table">
          <thead><tr><th>Année</th><th>Nb ${blLabel}</th>${schema.teuField?'<th>TEU</th>':''}<th>Tonnes (kg)</th></tr></thead>
          <tbody>${a.byYear.map(y => `<tr><td>${y.year}</td><td>${fmt(y.bl)}</td>${schema.teuField?`<td>${fmt(y.teu)}</td>`:''}<td>${fmt(y.weight, 0)}</td></tr>`).join("")}</tbody>
        </table>`;
    }
    return `
      <h3 class="section-h"><span class="focus-badge">FOCUS</span> 6.3. Zoom Africa Global Logistics (Transitaire)</h3>
      <div class="agl-grid">
        <div class="agl-card">
          <div class="agl-label">Rang AGL</div>
          <div class="agl-value">n°${a.rank}</div>
          <div class="agl-sub">sur ${a.totalTransitaires} transitaires</div>
        </div>
        <div class="agl-card">
          <div class="agl-label">PDM ${schema.teuField?"TEU":"Tonnes"}</div>
          <div class="agl-value" style="color:#b08a3a;">${fmt(a.pdmMetric, 1)} %</div>
          <div class="agl-sub">${fmt(schema.teuField?a.teu:a.weight, 0)} ${schema.teuField?"TEU":"kg"}</div>
        </div>
        <div class="agl-card">
          <div class="agl-label">${blLabel} traités</div>
          <div class="agl-value">${fmt(a.bl)}</div>
          <div class="agl-sub">${fmt(a.pdmBL, 1)} % du marché</div>
        </div>
        <div class="agl-card">
          <div class="agl-label">Évol. N vs N-1</div>
          ${evolV !== null && !isNaN(evolV) ?
            `<div class="agl-value" style="color:${evolV>=0?'#16a34a':'#dc2626'};">${evolV>=0?'+':''}${fmt(evolV,1)} %</div>
             <div class="agl-sub">${a.evol.year} vs ${a.evol.prevYear}</div>` :
            `<div class="agl-value" style="color:#64748b;">—</div>`}
        </div>
      </div>
      <table class="report-table" style="margin-top:12px;">
        <thead><tr><th>Indicateur</th><th>AGL</th><th>Marché total</th><th>Part AGL</th></tr></thead>
        <tbody>
          <tr><td><strong>${blLabel} traités</strong></td><td>${fmt(a.bl)}</td><td>${fmt(A.nbBL)}</td><td><strong style="color:#b08a3a;">${pct(a.bl, A.nbBL)}</strong></td></tr>
          ${schema.teuField?`<tr><td><strong>TEU</strong></td><td>${fmt(a.teu)}</td><td>${fmt(A.totalTEU)}</td><td><strong style="color:#b08a3a;">${pct(a.teu, A.totalTEU)}</strong></td></tr>`:''}
          <tr><td><strong>Tonnage (kg)</strong></td><td>${fmt(a.weight, 0)}</td><td>${fmt(A.totalWeight, 0)}</td><td><strong style="color:#b08a3a;">${pct(a.weight, A.totalWeight)}</strong></td></tr>
        </tbody>
      </table>
      ${yearTbl}
    `;
  };

  // ----- Render section marchandises segmentées -----
  const renderMarchSeg = (A) => {
    if (!A.segments) return "";
    const schema = A.schema;
    const blLabel = schema.type === "maritime" ? "BL" : "LTA";

    const renderTopM = (title, items, sortCol) => {
      if (!items || items.length === 0) return "";
      return `<h4>${title}</h4>
        <table class="report-table">
          <thead><tr><th>#</th><th>Marchandise</th><th>Nb ${blLabel}</th>${schema.teuField?'<th>TEU</th>':''}<th>Tonnes</th><th class="agl-col">PDM AGL</th><th class="agl-col">Δ AGL YoY</th></tr></thead>
          <tbody>${items.slice(0,10).map((m, i) => {
            const pdm = A.aglPdmByMarchandise?.get(m.key);
            const pdmCur = pdm?.pdmCur, aev = pdm?.aglEvolPct;
            return `<tr>
              <td>${i+1}</td><td>${escapeHtml(m.key.substring(0,55))}</td>
              <td>${fmt(m.bl)}</td>${schema.teuField?`<td>${fmt(m.teu)}</td>`:''}<td>${fmt(m.weight, 0)}</td>
              <td style="font-weight:600;color:#b08a3a;">${pdmCur===null||pdmCur===undefined||isNaN(pdmCur)?'—':fmt(pdmCur, 1)+' %'}</td>
              <td style="font-weight:600;color:${evolColor(aev)};">${aev===null||aev===undefined||isNaN(aev)?'—':(aev>=0?'+':'')+fmt(aev,1)+' %'}</td>
            </tr>`;
          }).join("")}</tbody>
        </table>`;
    };

    return `
      <h3 class="section-h">5. Marchandises : segmentation conteneurisé / conventionnel</h3>
      <div class="seg-grid">
        <div class="seg-cont">
          <div class="seg-title">📦 Conteneurisé (TEU)</div>
          <div class="seg-codes">Codes : 20F · 20S · 20TOP · 40F · 40S · 40TOP · FLTANK · TANK</div>

// ============================================================
// COMPOSANT : Sélecteur de filtre pour une colonne
// ============================================================
function FilterColumn({ field, label, options, selected, onChange, searchable }) {
  const [search, setSearch] = useState("");
  const filtered = useMemo(() => {
    if (!search) return options.slice(0, 200);
    const s = search.toLowerCase();
    return options.filter(o => String(o.value).toLowerCase().includes(s)).slice(0, 200);
  }, [options, search]);

  const toggle = (v) => {
    const next = new Set(selected);
    if (next.has(v)) next.delete(v); else next.add(v);
    onChange(next);
  };
  const clear = () => onChange(new Set());
  const selectAll = () => onChange(new Set(filtered.map(o => o.value)));

  return (
    <div className="mb-3">
      <div className="flex items-center justify-between mb-1">
        <span className="text-xs font-semibold navy-text">{label} <span className="text-gray-400">({options.length})</span></span>
        <div className="flex gap-1">
          <button className="text-xs text-blue-700 hover:underline" onClick={selectAll}>Tout</button>
          <button className="text-xs text-red-600 hover:underline" onClick={clear} disabled={selected.size === 0}>Vider</button>
        </div>
      </div>
      {searchable && options.length > 8 && (
        <input type="search" placeholder="Rechercher…" value={search} onChange={e => setSearch(e.target.value)} className="mb-2 text-xs"/>
      )}
      <div className="filter-panel">
        {filtered.length === 0 ? <div className="text-xs text-gray-400 italic p-2">Aucune valeur</div> :
          filtered.map(opt => {
            const isOn = selected.has(opt.value);
            return (
              <span key={opt.value} className={"chip " + (isOn ? "chip-active" : "")} onClick={() => toggle(opt.value)} title={`${opt.count} lignes`}>
                <span style={{maxWidth:160, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{String(opt.value).substring(0, 40)}</span>
                <span className="opacity-70 text-[10px]">{opt.count}</span>
              </span>
            );
          })
        }
      </div>
    </div>
  );
}

// ============================================================
// COMPOSANT : Carte métier (chargement + résumé)
// ============================================================
function MetierCard({ metierKey, schema, state, onUpload, onClear, onRemoveFile, isActive, onSelect }) {
  const fileRef = useRef(null);
  const files = (state && state.files) || [];
  const loaded = files.length > 0 && state.rows && state.rows.length > 0;
  const handleFiles = (fileList) => {
    if (!fileList || fileList.length === 0) return;
    // On peut charger plusieurs fichiers d'un coup
    Array.from(fileList).forEach(f => onUpload(f));
  };
  return (
    <div className={"metier-card " + (loaded ? "loaded" : "empty") + (isActive ? " ring-2 ring-amber-500" : "")} onClick={() => loaded && onSelect()} style={{ cursor: loaded ? "pointer" : "default" }}>
      <div className="flex items-start justify-between mb-2">
        <div>
          <div className="text-lg font-bold navy-text flex items-center gap-2">{schema.icon} {schema.label}</div>
          <div className="text-xs text-gray-500">Client = <strong>{schema.clientLabel}</strong></div>
        </div>
        {loaded ? <span className="badge-loaded">✓ {files.length} fichier{files.length>1?"s":""}</span> : <span className="badge-empty">Vide</span>}
      </div>
      {state && state.loading && (<div className="text-xs text-blue-700 flex items-center gap-2 mb-2"><span className="loading-spin"></span> Chargement… {state.progress || ""}</div>)}
      {state && state.error && (<div className="text-xs text-red-700 bg-red-50 p-2 rounded mb-2">⚠ {state.error}</div>)}
      {loaded && (
        <div className="text-xs space-y-1 mb-2">
          <div className="flex justify-between"><span className="text-gray-500">Lignes consolidées :</span><span className="font-semibold">{fmt(state.rows.length)}</span></div>
          <div className="flex justify-between"><span className="text-gray-500">{schema.type==="maritime"?"BL":"LTA"} uniques :</span><span className="font-semibold">{fmt(state.analysis?.nbBL || 0)}</span></div>
          {schema.teuField && <div className="flex justify-between"><span className="text-gray-500">TEU :</span><span className="font-semibold">{fmt(state.analysis?.totalTEU || 0)}</span></div>}
          {state.analysis?.byYear?.length > 0 && (
            <div className="flex justify-between">
              <span className="text-gray-500">Années :</span>
              <span className="font-semibold">{state.analysis.byYear.map(y => y.year).join(", ")}</span>
            </div>
          )}
        </div>
      )}
      {/* Liste des fichiers chargés */}
      {files.length > 0 && (
        <div className="mb-2 max-h-32 overflow-y-auto" onClick={e => e.stopPropagation()}>
          <div className="text-xs font-semibold text-gray-600 mb-1">Fichiers chargés :</div>
          {files.map((f, i) => (
            <div key={f.fileId} className="text-xs flex items-center justify-between bg-gray-50 rounded px-2 py-1 mb-1">
              <span className="truncate flex-1" title={f.fileName}>
                📄 {f.fileName} <span className="text-gray-500">({fmt(f.rowCount || 0)} l.{f.yearsInFile?.length > 0 ? " · " + f.yearsInFile.join("/") : ""})</span>
              </span>
              <button className="text-red-500 hover:bg-red-50 px-1 rounded ml-1" onClick={() => onRemoveFile(f.fileId)} title="Retirer ce fichier">✕</button>
            </div>
          ))}
        </div>
      )}
      <div className="mt-2 flex gap-2" onClick={e => e.stopPropagation()}>
        <input ref={fileRef} type="file" accept=".xlsx,.xls" multiple className="hidden"
          onChange={e => { handleFiles(e.target.files); e.target.value = ""; }} />
        <button className="btn-ghost text-xs flex-1" onClick={() => fileRef.current?.click()} disabled={state && state.loading}>
          {loaded ? "+ Ajouter fichier(s)" : "📁 Charger Excel"}
        </button>
        {loaded && <button className="btn-ghost text-xs" onClick={onClear} title="Tout décharger">🗑 Vider</button>}
      </div>
    </div>
  );
}
