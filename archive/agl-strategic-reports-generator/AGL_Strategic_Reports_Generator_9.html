// PERSISTANCE INDEXEDDB — Mémoriser les données entre sessions
// ============================================================
const IDB_NAME = "AGL_STATCOM_DB";
const IDB_STORE = "metiers";
const IDB_META = "meta";
const IDB_VERSION = 1;

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => resolve(req.result);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      if (!db.objectStoreNames.contains(IDB_META)) db.createObjectStore(IDB_META);
    };
  });
}

async function idbSaveFile(metierKey, fileId, rows, fileName, yearsInFile) {
  const db = await idbOpen();
  const key = metierKey + "::" + fileId;
  return new Promise((resolve, reject) => {
    const tx = db.transaction([IDB_STORE, IDB_META], "readwrite");
    tx.objectStore(IDB_STORE).put({ metierKey, fileId, rows, fileName, yearsInFile: yearsInFile || [], savedAt: Date.now() }, key);
    tx.objectStore(IDB_META).put({ savedAt: Date.now() }, "lastSave");
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}

async function idbLoadAll() {
  // Retourne {metierKey: [{fileId, rows, fileName, yearsInFile, savedAt}, ...], __meta}
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction([IDB_STORE, IDB_META], "readonly");
    const result = {};
    const store = tx.objectStore(IDB_STORE);
    const req = store.openCursor();
    req.onsuccess = (e) => {
      const cursor = e.target.result;
      if (cursor) {
        const v = cursor.value;
        if (v && v.metierKey) {
          if (!result[v.metierKey]) result[v.metierKey] = [];
          result[v.metierKey].push(v);
        }
        cursor.continue();
      }
    };
    const metaReq = tx.objectStore(IDB_META).get("lastSave");
    metaReq.onsuccess = () => { if (metaReq.result) result.__meta = metaReq.result; };
    tx.oncomplete = () => { db.close(); resolve(result); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}

// Variante leger : ne lit QUE les metadata (fileId, fileName, nbRows, savedAt, yearsInFile)
// sans charger les rows en memoire. Utilisee au demarrage pour eviter OOM.
async function idbLoadMetadataOnly() {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction([IDB_STORE, IDB_META], "readonly");
    const result = {};
    const store = tx.objectStore(IDB_STORE);
    const req = store.openCursor();
    req.onsuccess = (e) => {
      const cursor = e.target.result;
      if (cursor) {
        const v = cursor.value;
        if (v && v.metierKey) {
          if (!result[v.metierKey]) result[v.metierKey] = [];
          // On ne garde QUE la metadata, pas les rows
          result[v.metierKey].push({
            fileId: v.fileId,
            fileName: v.fileName,
            nbRows: (v.rows || []).length,
            savedAt: v.savedAt,
            yearsInFile: v.yearsInFile || []
          });
          // Hint au GC : libere la reference au record complet
        }
        cursor.continue();
      }
    };
    const metaReq = tx.objectStore(IDB_META).get("lastSave");
    metaReq.onsuccess = () => { if (metaReq.result) result.__meta = metaReq.result; };
    tx.oncomplete = () => { db.close(); resolve(result); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}

async function idbClearAll() {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction([IDB_STORE, IDB_META], "readwrite");
    tx.objectStore(IDB_STORE).clear();
    tx.objectStore(IDB_META).clear();
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}

async function idbDeleteFile(metierKey, fileId) {
  const db = await idbOpen();
  const key = metierKey + "::" + fileId;
  return new Promise((resolve, reject) => {
    const tx = db.transaction([IDB_STORE], "readwrite");
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}

async function idbDeleteMetier(metierKey) {
  // Supprime tous les fichiers d'un métier
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction([IDB_STORE], "readwrite");
    const store = tx.objectStore(IDB_STORE);
    const req = store.openCursor();
    req.onsuccess = (e) => {
      const cursor = e.target.result;
      if (cursor) {
        if (cursor.value && cursor.value.metierKey === metierKey) cursor.delete();
        cursor.continue();
      }
    };
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}

// ============================================================
// APPLICATION PRINCIPALE
// ============================================================
function App() {
  // metiers[metierKey] = { files: [{fileId, fileName, rows, yearsInFile, rowCount}], rows: concat, analysis, index, filters, loading, error, progress }
  const [metiers, setMetiers] = useState(() => Object.fromEntries(METIER_KEYS.map(k => [k, null])));
  const [activeMetier, setActiveMetier] = useState(null);
  const [mode, setMode] = useState("multi");
  const [selectedForReport, setSelectedForReport] = useState(new Set(METIER_KEYS));
  const [reportTitle, setReportTitle] = useState("Analyse des flux STATCOM");
  const [reportSubtitle, setReportSubtitle] = useState(`Périmètre Janvier — Mars 2025/2026 · Source STATCOM`);
  const [generating, setGenerating] = useState(null);
  const [globalMsg, setGlobalMsg] = useState(null);
  const [activeView, setActiveView] = useState("config");
  // Mémoire / persistance
  const [memSaving, setMemSaving] = useState(false);
  const [memLastSave, setMemLastSave] = useState(null);
  const [memAvailable, setMemAvailable] = useState({}); // {metierKey: [{fileId,fileName,nbRows,savedAt,yearsInFile}]}
  const [autoSave, setAutoSave] = useState(true);
  // Filtre années globaux (cases à cocher)
  const [yearFilter, setYearFilter] = useState(new Set()); // Set des années sélectionnées; vide = TOUTES
  const [exclusions, setExclusions] = useState({ nonApure: false, petroleBrut: false, petroleRaffine: false }); // exclusions globales sur les BL
  // Storage hors-state pour les rows brutes par fichier
  const rawFilesRef = useRef({}); // { metierKey: [{fileId, rows}, ...] }

  // ----- Helper : extraire les années présentes dans rows -----
  const extractYearsFromRows = useCallback((rows, schema) => {
    if (!rows || rows.length === 0 || !schema?.yearField) return [];
    const years = new Set();
    // On échantillonne 500 lignes pour la rapidité
    const step = Math.max(1, Math.floor(rows.length / 500));
    for (let i = 0; i < rows.length; i += step) {
      const v = rows[i][schema.yearField];
      if (v !== null && v !== undefined && String(v).trim() !== "") {
        years.add(String(v).trim());
      }
    }
    return Array.from(years).sort();
  }, []);

  // ----- Helper : recalcule analysis + index à partir des fichiers actifs (filtre années + exclusions) -----
  const recomputeFromFiles = useCallback((metierKey, filesList, yearFilterSet, exclusionsSet) => {
    const schema = METIER_SCHEMAS[metierKey];
    // Concaténation des rows des fichiers
    let allRows = [];
    for (const f of filesList) {
      const rows = rawFilesRef.current[metierKey]?.find(x => x.fileId === f.fileId)?.rows;
      if (rows && rows.length > 0) allRows = allRows.concat(rows);
    }
    // Filtre années si actif
    const useFilter = yearFilterSet && yearFilterSet.size > 0 && schema.yearField;
    if (useFilter) {
      allRows = allRows.filter(r => {
        const y = String(r[schema.yearField] || "").trim();
        return yearFilterSet.has(y);
      });
    }
    // Exclusions globales : libelles EXACTS observes dans la base STATCOM
    // - NON APURE : valeur du champ Qualifie
    // - PRODUIT PETROLIER BRUT : libelle marchandise
    // - PETROLE RAFFINES : libelle marchandise
    if (exclusionsSet) {
      const normalize = (s) => String(s||"").toUpperCase().replace(/É|È|Ê|Ë/g, "E").replace(/À|Â|Ä/g, "A").replace(/Î|Ï/g, "I").replace(/Ô|Ö/g, "O").replace(/Ù|Û|Ü/g, "U").trim();
      const matchNonApure = (s) => normalize(s) === "NON APURE";
      const matchPetroleBrut = (s) => {
        const n = normalize(s);
        return n === "PRODUIT PETROLIER BRUT" || n === "PRODUITS PETROLIERS BRUTS" || n.includes("PETROLIER BRUT") || n.includes("PETROLE BRUT");
      };
      const matchPetroleRaffine = (s) => {
        const n = normalize(s);
        return n === "PETROLE RAFFINES" || n === "PETROLE RAFFINE" || n.includes("PETROLE RAFFIN") || n.includes("PRODUIT PETROLIER RAFFIN") || n.includes("PRODUITS PETROLIERS RAFFIN");
      };
      allRows = allRows.filter(r => {
        if (exclusionsSet.nonApure && schema.qualifField && matchNonApure(r[schema.qualifField])) return false;
        if (schema.marchandiseField) {
          const m = r[schema.marchandiseField];
          if (exclusionsSet.petroleBrut && matchPetroleBrut(m)) return false;
          if (exclusionsSet.petroleRaffine && matchPetroleRaffine(m)) return false;
        }
        return true;
      });
    }
    if (allRows.length === 0) return { rows: [], analysis: null, index: {} };
    const analysis = buildAnalysis(allRows, schema);
    if (metierKey === "HINTERLAND_IMPORT" || metierKey === "HINTERLAND_EXPORT") {
      analysis._hinterlandSens = schema.sens;
      analysis._hinterlandIcon = schema.icon;
      analysis._hinterlandLabel = metierKey === "HINTERLAND_IMPORT"
        ? "Hinterland Import (source dédiée — transit CI → pays enclavés)"
        : "Hinterland Export (source dédiée — pays enclavés via CI)";
      analysis._originalCount = analysis.nbBL;
      analysis._filteredCount = analysis.nbBL;
    }
    const index = buildIndex(allRows, schema);
    return { rows: allRows, analysis, index };
  }, []);

  // ----- handleUpload : ajoute un fichier à un métier (concaténation) -----
  const handleUpload = useCallback(async (metierKey, file) => {
    setMetiers(prev => ({ ...prev, [metierKey]: { ...(prev[metierKey] || { files: [] }), loading: true, error: null, progress: "Lecture du fichier " + file.name + "…" } }));
    try {
      const buf = await file.arrayBuffer();
      setMetiers(prev => ({ ...prev, [metierKey]: { ...(prev[metierKey] || {}), progress: "Parsing Excel " + file.name + "…" } }));

      const workerCode = `
        importScripts('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
        self.onmessage = function(e) {
          try {
            const wb = XLSX.read(e.data.buf, { type: 'array', cellDates: false, cellNF: false, cellText: false });
            const sheetName = wb.SheetNames.includes('Export') ? 'Export' : wb.SheetNames[0];
            const keepFields = e.data.keepFields;
            const sheet = wb.Sheets[sheetName];
            // Projection : on construit les rows en gardant UNIQUEMENT les colonnes utiles
            // (massif gain memoire vs sheet_to_json qui copie toutes les colonnes)
            if (keepFields && keepFields.length > 0) {
              // Approche par arrays + headers, plus econome
              const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null, raw: true });
              if (aoa.length === 0) {
                self.postMessage({ type: 'done', rows: [], sheetName: sheetName });
                return;
              }
              const headers = aoa[0];
              const keepSet = new Set(keepFields);
              const idxMap = {};
              headers.forEach((h, i) => { if (keepSet.has(h)) idxMap[h] = i; });
              const keptHeaders = Object.keys(idxMap);
              const rows = new Array(aoa.length - 1);
              for (let i = 1; i < aoa.length; i++) {
                const row = aoa[i];
                const obj = {};
                for (const h of keptHeaders) obj[h] = row[idxMap[h]];
                rows[i - 1] = obj;
              }
              // On libere aoa avant d envoyer
              aoa.length = 0;
              self.postMessage({ type: 'done', rows: rows, sheetName: sheetName });
            } else {
              // Fallback : ancien comportement (toutes colonnes)
              const rows = XLSX.utils.sheet_to_json(sheet, { defval: null, raw: true });
              self.postMessage({ type: 'done', rows: rows, sheetName: sheetName });
            }
          } catch (err) {
            self.postMessage({ type: 'error', message: err.message || String(err) });
          }
        };
      `;
      const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
      const workerUrl = URL.createObjectURL(workerBlob);
      const worker = new Worker(workerUrl);

      const rows = await new Promise((resolve, reject) => {
        worker.onmessage = (e) => {
          if (e.data.type === 'done') { resolve(e.data.rows); worker.terminate(); URL.revokeObjectURL(workerUrl); }
          else if (e.data.type === 'error') { reject(new Error(e.data.message)); worker.terminate(); URL.revokeObjectURL(workerUrl); }
        };
        worker.onerror = (err) => { reject(new Error(err.message || "Erreur worker")); worker.terminate(); URL.revokeObjectURL(workerUrl); };
        // Liste des colonnes utiles pour ce schema (toutes les autres seront filtrees au parsing)
        // On garde aussi quelques champs utilises pour la detection de schema (I_IMP_E_EXP, Sens, LTA...)
        const sch = METIER_SCHEMAS[metierKey];
        const keepFields = [
          sch.clientField, sch.counterpartField, sch.teuField, sch.weightField, sch.blField,
          sch.yearField, sch.monthField, sch.portChargementField, sch.portDechargementField,
          sch.paysOrigineField, sch.paysDestField, sch.lieuLivraisonField, sch.marchandiseField,
          sch.transitaireField, sch.armateurField, sch.consignataireField, sch.conditField, sch.modeExpField,
          sch.verticalField, sch.statutField, sch.commercialField, sch.qualifField,
          // Champs aux pour detection de type/sens de fichier
          "I_IMP_E_EXP", "Sens", "Numéro LTA", "Numero LTA", "Aéroport", "Aeroport", "Compagnie"
        ].filter(Boolean);
        worker.postMessage({ buf: buf, keepFields: keepFields }, [buf]);
      });

      if (!rows || rows.length === 0) throw new Error("Feuille vide ou format non reconnu.");

      // Détection auto vs schema
      const detected = detectMetierKey(rows);
      const targetSchema = METIER_SCHEMAS[metierKey];
      if (detected && METIER_SCHEMAS[detected].type !== targetSchema.type) {
        throw new Error(`Le fichier ${file.name} semble être ${METIER_SCHEMAS[detected].label} et non ${targetSchema.label}.`);
      }

      // Heuristique Hinterland : un fichier Hinterland devrait avoir une majorité de lignes hors Côte d'Ivoire
      if (metierKey === "HINTERLAND_IMPORT" || metierKey === "HINTERLAND_EXPORT") {
        const paysField = metierKey === "HINTERLAND_IMPORT" ? targetSchema.paysDestField : targetSchema.paysOrigineField;
        if (paysField) {
          const sample = rows.slice(0, Math.min(2000, rows.length));
          let ciCount = 0, validCount = 0;
          for (const r of sample) {
            const v = r[paysField];
            if (!isEmptyValueGlobal(v)) {
              validCount++;
              if (isCoteDIvoire(v)) ciCount++;
            }
          }
          if (validCount > 0 && (ciCount / validCount) > 0.5) {
            const pctCI = Math.round(ciCount / validCount * 100);
            setGlobalMsg({ type: "warning", text: `⚠ Le fichier ${file.name} chargé dans ${targetSchema.label} contient ${pctCI} % de lignes avec ${paysField} = Côte d'Ivoire. Ce n'est probablement pas un fichier Hinterland (les flux Hinterland sont à destination/origine des pays enclavés).` });
            setTimeout(() => setGlobalMsg(null), 10000);
          }
        }
      }

      // Nouveau fileId
      const fileId = "f_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
      const yearsInFile = extractYearsFromRows(rows, targetSchema);
      const newFileEntry = { fileId, fileName: file.name, rowCount: rows.length, yearsInFile };

      // Stocker les rows en RAM
      if (!rawFilesRef.current[metierKey]) rawFilesRef.current[metierKey] = [];
      rawFilesRef.current[metierKey].push({ fileId, rows });

      // Mise à jour du state : ajoute ce fichier puis recalcule analysis
      setMetiers(prev => ({ ...prev, [metierKey]: { ...(prev[metierKey] || { files: [] }), progress: "Indexation & calculs…", loading: true } }));

      const updatedFiles = [ ...((metiers[metierKey] && metiers[metierKey].files) || []), newFileEntry ];
      const { rows: allRows, analysis, index } = recomputeFromFiles(metierKey, updatedFiles, yearFilter, exclusions);

      setMetiers(prev => ({ ...prev, [metierKey]: { files: updatedFiles, rows: allRows, analysis, index, filters: (prev[metierKey] && prev[metierKey].filters) || {}, loading: false, error: null } }));
      if (!activeMetier) setActiveMetier(metierKey);
      setSelectedForReport(prev => { const s = new Set(prev); s.add(metierKey); return s; });

      const ystr = yearsInFile.length > 0 ? " (" + yearsInFile.join("/") + ")" : "";
      setGlobalMsg({ type: "success", text: `✓ ${targetSchema.label} : +${rows.length.toLocaleString("fr-FR")} lignes${ystr} · total ${allRows.length.toLocaleString("fr-FR")} lignes` });
      setTimeout(() => setGlobalMsg(null), 5000);

      // Auto-mémorisation
      if (autoSave) {
        idbSaveFile(metierKey, fileId, rows, file.name, yearsInFile)
          .then(() => {
            setMemAvailable(prev => {
              const arr = (prev[metierKey] || []).slice();
              arr.push({ fileId, fileName: file.name, nbRows: rows.length, savedAt: Date.now(), yearsInFile });
              return { ...prev, [metierKey]: arr };
            });
            setMemLastSave(Date.now());
          })
          .catch(e => console.warn("Auto-save échoué:", e));
      }
    } catch (e) {
      console.error(e);
      setMetiers(prev => ({ ...prev, [metierKey]: { ...(prev[metierKey] || { files: [] }), loading: false, error: e.message || "Erreur" } }));
      setGlobalMsg({ type: "error", text: `✗ ${e.message}` });
      setTimeout(() => setGlobalMsg(null), 6000);
    }
  }, [activeMetier, autoSave, metiers, yearFilter, recomputeFromFiles, extractYearsFromRows]);

  // ----- Retirer 1 fichier -----
  const handleRemoveFile = useCallback((metierKey, fileId) => {
    if (!confirm("Retirer ce fichier du métier ?")) return;
    if (rawFilesRef.current[metierKey]) {
      rawFilesRef.current[metierKey] = rawFilesRef.current[metierKey].filter(f => f.fileId !== fileId);
    }
    setMetiers(prev => {
      const cur = prev[metierKey];
      if (!cur) return prev;
      const updatedFiles = (cur.files || []).filter(f => f.fileId !== fileId);
      if (updatedFiles.length === 0) {
        delete rawFilesRef.current[metierKey];
        return { ...prev, [metierKey]: null };
      }
      const { rows, analysis, index } = recomputeFromFiles(metierKey, updatedFiles, yearFilter, exclusions);
      return { ...prev, [metierKey]: { ...cur, files: updatedFiles, rows, analysis, index } };
    });
    idbDeleteFile(metierKey, fileId).catch(e => console.warn("idbDeleteFile:", e));
    setMemAvailable(prev => {
      const arr = (prev[metierKey] || []).filter(f => f.fileId !== fileId);
      const next = { ...prev };
      if (arr.length === 0) delete next[metierKey];
      else next[metierKey] = arr;
      return next;
    });
  }, [yearFilter, recomputeFromFiles]);

  // ----- Vider tout un métier -----
  const handleClear = useCallback((metierKey) => {
    if (!confirm("Vider tous les fichiers de ce métier ?")) return;
    delete rawFilesRef.current[metierKey];
    setMetiers(prev => ({ ...prev, [metierKey]: null }));
    setSelectedForReport(prev => { const s = new Set(prev); s.delete(metierKey); return s; });
    if (activeMetier === metierKey) {
      const next = METIER_KEYS.find(k => k !== metierKey && rawFilesRef.current[k]);
      setActiveMetier(next || null);
    }
    idbDeleteMetier(metierKey).catch(e => console.warn(e));
    setMemAvailable(prev => { const m = { ...prev }; delete m[metierKey]; return m; });
  }, [activeMetier]);

  // ----- Liste des années disponibles (union de tous les métiers) -----
  const allAvailableYears = useMemo(() => {
    const set = new Set();
    for (const k of METIER_KEYS) {
      const files = metiers[k]?.files || [];
      for (const f of files) {
        (f.yearsInFile || []).forEach(y => set.add(y));
      }
    }
    return Array.from(set).sort();
  }, [metiers]);

  // ----- Quand le filtre années OU les exclusions changent : flag loading + recompute asynchrone -----
  const yearFilterDebounceRef = useRef(null);
  const yearFilterIsInitial = useRef(true);
  useEffect(() => {
    if (yearFilterIsInitial.current) { yearFilterIsInitial.current = false; return; }
    setMetiers(prev => {
      const next = { ...prev };
      for (const k of METIER_KEYS) {
        const cur = next[k];
        if (cur && cur.files && cur.files.length > 0) {
          next[k] = { ...cur, loading: true, progress: "Application des filtres…" };
        }
      }
      return next;
    });
    if (yearFilterDebounceRef.current) clearTimeout(yearFilterDebounceRef.current);
    yearFilterDebounceRef.current = setTimeout(() => {
      requestAnimationFrame(() => setTimeout(() => {
        setMetiers(prev => {
          const next = { ...prev };
          for (const k of METIER_KEYS) {
            const cur = next[k];
            if (cur && cur.files && cur.files.length > 0) {
              const { rows, analysis, index } = recomputeFromFiles(k, cur.files, yearFilter, exclusions);
              next[k] = { ...cur, rows, analysis, index, loading: false, progress: null };
            }
          }
          return next;
        });
      }, 0));
    }, 300);
  }, [yearFilter, exclusions, recomputeFromFiles]);

  // ----- Mémorisation manuelle (sauvegarde tous les fichiers actuels) -----
  const saveMemory = useCallback(async (silent = false) => {
    setMemSaving(true);
    try {
      const tasks = [];
      const newMem = {};
      for (const k of METIER_KEYS) {
        const cur = metiers[k];
        const filesRam = rawFilesRef.current[k] || [];
        if (!cur || !cur.files || cur.files.length === 0) continue;
        const arrMem = [];
        for (const f of cur.files) {
          const rowsEntry = filesRam.find(x => x.fileId === f.fileId);
          if (rowsEntry && rowsEntry.rows.length > 0) {
            tasks.push(idbSaveFile(k, f.fileId, rowsEntry.rows, f.fileName, f.yearsInFile));
            arrMem.push({ fileId: f.fileId, fileName: f.fileName, nbRows: rowsEntry.rows.length, savedAt: Date.now(), yearsInFile: f.yearsInFile });
          }
        }
        if (arrMem.length > 0) newMem[k] = arrMem;
      }
      if (tasks.length === 0) {
        if (!silent) { setGlobalMsg({ type:"info", text:"Rien à mémoriser." }); setTimeout(()=>setGlobalMsg(null), 3000); }
        return;
      }
      await Promise.all(tasks);
      setMemAvailable(newMem);
      setMemLastSave(Date.now());
      const totalFiles = Object.values(newMem).reduce((s, arr) => s + arr.length, 0);
      if (!silent) { setGlobalMsg({ type:"success", text:`✓ ${totalFiles} fichier(s) mémorisé(s).` }); setTimeout(()=>setGlobalMsg(null), 4000); }
    } catch (e) {
      console.error(e);
      if (!silent) { setGlobalMsg({ type:"error", text:`✗ ${e.message}` }); setTimeout(()=>setGlobalMsg(null), 6000); }
    } finally { setMemSaving(false); }
  }, [metiers]);

  // ----- Restauration : lit tous les fichiers et reconstruit le state -----
  const restoreMemory = useCallback(async () => {
    setMemSaving(true);
    setGlobalMsg({ type:"info", text:"Restauration en cours…" });
    try {
      const data = await idbLoadAll();
      let restoredFiles = 0;
      for (const k of METIER_KEYS) {
        const arr = data[k];
        if (Array.isArray(arr) && arr.length > 0) {
          // Reconstruit rawFilesRef et files
          rawFilesRef.current[k] = arr.map(e => ({ fileId: e.fileId, rows: e.rows }));
          const filesList = arr.map(e => ({ fileId: e.fileId, fileName: e.fileName, rowCount: (e.rows || []).length, yearsInFile: e.yearsInFile || [] }));
          const { rows, analysis, index } = recomputeFromFiles(k, filesList, yearFilter, exclusions);
          setMetiers(prev => ({ ...prev, [k]: { files: filesList, rows, analysis, index, filters: {}, loading: false, error: null } }));
          setSelectedForReport(prev => { const s = new Set(prev); s.add(k); return s; });
          restoredFiles += arr.length;
        }
      }
      if (data.__meta?.savedAt) setMemLastSave(data.__meta.savedAt);
      if (restoredFiles > 0) {
        const firstK = METIER_KEYS.find(k => rawFilesRef.current[k]);
        if (firstK && !activeMetier) setActiveMetier(firstK);
        setGlobalMsg({ type:"success", text:`✓ ${restoredFiles} fichier(s) restauré(s).` });
      } else {
        setGlobalMsg({ type:"info", text:"Aucune donnée mémorisée." });
      }
      setTimeout(()=>setGlobalMsg(null), 4000);
    } catch (e) {
      console.error(e);
      setGlobalMsg({ type:"error", text:`✗ ${e.message}` });
      setTimeout(()=>setGlobalMsg(null), 6000);
    } finally { setMemSaving(false); }
  }, [activeMetier, yearFilter, recomputeFromFiles]);

  const clearMemory = useCallback(async () => {
    if (!confirm("Effacer définitivement toutes les données mémorisées ?")) return;
    try {
      await idbClearAll();
      setMemAvailable({});
      setMemLastSave(null);
      setGlobalMsg({ type:"success", text:"✓ Mémoire vidée." });
      setTimeout(()=>setGlobalMsg(null), 3000);
    } catch (e) {
      setGlobalMsg({ type:"error", text:`✗ ${e.message}` });
      setTimeout(()=>setGlobalMsg(null), 5000);
    }
  }, []);

  // Auto-check mémoire au démarrage — version LEGERE (pas de chargement des rows)
  useEffect(() => {
    (async () => {
      try {
        const data = await idbLoadMetadataOnly();
        const avail = {};
        for (const k of METIER_KEYS) {
          const arr = data[k];
          if (Array.isArray(arr) && arr.length > 0) {
            // arr contient deja la metadata uniquement (fileId, fileName, nbRows, savedAt, yearsInFile)
            avail[k] = arr;
          }
        }
        setMemAvailable(avail);
        if (data.__meta?.savedAt) setMemLastSave(data.__meta.savedAt);
      } catch (e) { console.warn("Init mémoire:", e); }
    })();
  }, []);

  const filterDebounceRef = useRef({}); // metierKey -> timeout id
  const setFiltersFor = useCallback((metierKey, updater) => {
    // 1. MAJ immediate des filtres + flag loading (pour feedback UI)
    setMetiers(prev => {
      const cur = prev[metierKey];
      if (!cur) return prev;
      const newFilters = typeof updater === "function" ? updater(cur.filters || {}) : updater;
      return { ...prev, [metierKey]: { ...cur, filters: newFilters, loading: true, progress: "Application des filtres…" } };
    });
    // 2. Recompute deferre (debounce 250ms) pour eviter de bloquer l UI sur cliques rapides
    if (filterDebounceRef.current[metierKey]) clearTimeout(filterDebounceRef.current[metierKey]);
    filterDebounceRef.current[metierKey] = setTimeout(() => {
      // Yield au browser pour render le loading state avant le travail lourd
      requestAnimationFrame(() => setTimeout(() => {
        setMetiers(prev => {
          const cur = prev[metierKey];
          if (!cur || !cur.rows) return prev;
          const filtered = applyFilters(cur.rows, cur.filters || {});
          const schema = METIER_SCHEMAS[metierKey];
          const analysis = buildAnalysis(filtered, schema);
          if (metierKey === "HINTERLAND_IMPORT" || metierKey === "HINTERLAND_EXPORT") {
            analysis._hinterlandSens = schema.sens;
            analysis._hinterlandIcon = schema.icon;
            analysis._hinterlandLabel = metierKey === "HINTERLAND_IMPORT"
              ? "Hinterland Import (source dédiée — transit CI → pays enclavés)"
              : "Hinterland Export (source dédiée — pays enclavés via CI)";
            analysis._originalCount = analysis.nbBL;
            analysis._filteredCount = analysis.nbBL;
          }
          return { ...prev, [metierKey]: { ...cur, analysis, loading: false, progress: null } };
        });
      }, 0));
    }, 200);
  }, []);

  // Hinterland dérivé depuis Maritime (réutilisé pour l'export quand pas de fichier dédié)
  const hinterlandDerived = useMemo(() => buildHinterlandAnalysis(metiers), [metiers]);

  // Analyses à inclure dans le rapport
  const analysesForReport = useMemo(() => {
    let base;
    if (mode === "single" && activeMetier) {
      const m = metiers[activeMetier];
      base = m && m.analysis ? [m.analysis] : [];
    } else {
      base = METIER_KEYS.filter(k => selectedForReport.has(k) && metiers[k] && metiers[k].analysis)
        .map(k => metiers[k].analysis);
    }
    // En mode rapport global : injecter le Hinterland dérivé si pas de fichier dédié charge
    if (mode !== "single") {
      const hasDedImp = metiers.HINTERLAND_IMPORT?.analysis && !metiers.HINTERLAND_IMPORT.analysis.empty;
      const hasDedExp = metiers.HINTERLAND_EXPORT?.analysis && !metiers.HINTERLAND_EXPORT.analysis.empty;
      const extras = [];
      if (hinterlandDerived.importHinterland && !hasDedImp) {
        const a = hinterlandDerived.importHinterland;
        extras.push({ ...a, schema: { ...a.schema, label: "Hinterland Import (corridor de transit)", icon: "🚛⬇", key: "DERIVED_HINTERLAND_IMPORT" } });
      }
      if (hinterlandDerived.exportHinterland && !hasDedExp) {
        const a = hinterlandDerived.exportHinterland;
        extras.push({ ...a, schema: { ...a.schema, label: "Hinterland Export (corridor de transit)", icon: "🚛⬆", key: "DERIVED_HINTERLAND_EXPORT" } });
      }
      return [...base, ...extras];
    }
    return base;
  }, [metiers, activeMetier, mode, selectedForReport, hinterlandDerived]);

  const canGenerate = analysesForReport.length > 0 && analysesForReport.some(a => !a.empty);

  const generateAll = async () => {
    if (!canGenerate) return;
    const ts = new Date().toISOString().replace(/[:.]/g, "-").slice(0,16);
    const filename = `AGL_Rapport_STATCOM_${ts}`;
    const opts = { title: reportTitle, subtitle: reportSubtitle, filename };
    try {
      setGenerating("docx"); setGlobalMsg({ type:"info", text:"Génération DOCX en cours…" });
      await generateDOCX(analysesForReport, opts);
      setGenerating("pdf"); setGlobalMsg({ type:"info", text:"Génération PDF en cours…" });
      await new Promise(r => setTimeout(r, 100));
      generatePDF(analysesForReport, opts);
      setGenerating("pptx"); setGlobalMsg({ type:"info", text:"Génération PPTX en cours…" });
      await new Promise(r => setTimeout(r, 100));
      generatePPTX(analysesForReport, opts);
      setGenerating(null);
      setGlobalMsg({ type:"success", text:"✓ Les 3 livrables ont été téléchargés." });
      setTimeout(() => setGlobalMsg(null), 5000);
    } catch (e) {
      console.error(e); setGenerating(null);
      setGlobalMsg({ type:"error", text:`✗ Erreur génération : ${e.message}` });
    }
  };

  const generateOne = async (kind) => {
    if (!canGenerate) return;
    const ts = new Date().toISOString().replace(/[:.]/g, "-").slice(0,16);
    const filename = `AGL_Rapport_STATCOM_${ts}`;
    const opts = { title: reportTitle, subtitle: reportSubtitle, filename };
    try {
      setGenerating(kind); setGlobalMsg({ type:"info", text:`Génération ${kind.toUpperCase()}…` });
      if (kind === "docx") await generateDOCX(analysesForReport, opts);
      else if (kind === "pdf") generatePDF(analysesForReport, opts);
      else if (kind === "pptx") generatePPTX(analysesForReport, opts);
      setGenerating(null); setGlobalMsg({ type:"success", text:`✓ ${kind.toUpperCase()} téléchargé.` });
      setTimeout(() => setGlobalMsg(null), 4000);
    } catch (e) {
      console.error(e); setGenerating(null);
      setGlobalMsg({ type:"error", text:`✗ Erreur ${kind.toUpperCase()} : ${e.message}` });
    }
  };

  // Génération HTML autoporteur
  const generateHTMLReport = async (sendEmail = false) => {
    if (!canGenerate) return;
    const ts = new Date().toISOString().replace(/[:.]/g, "-").slice(0,16);
    const filename = `AGL_Rapport_STATCOM_${ts}`;
    const opts = { title: reportTitle, subtitle: reportSubtitle, filename };
    try {
      setGenerating("html"); setGlobalMsg({ type:"info", text:"Génération HTML autoporteur…" });
      const htmlContent = generateHTML(analysesForReport, opts);
      const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
      saveAs(blob, filename + ".html");
      const sizeKo = (blob.size / 1024).toFixed(1);
      setGenerating(null);

      if (sendEmail) {
        // Compose un mailto avec un message pré-rédigé invitant à attacher le HTML
        const subject = encodeURIComponent(`[AGL Stratégie] ${reportTitle} - ${new Date().toLocaleDateString("fr-FR")}`);
        const periodes = analysesForReport[0]?.byYear?.map(y => y.year).join("/") || "";
        const insights = analysesForReport.flatMap(a => buildInsights(a, a.schema).slice(0, 3)).slice(0, 5);
        const insightLines = insights.map(s => `• ${s}`).join("\n");
        const aglParts = analysesForReport.filter(a => a.aglTransit).map(a => {
          const t = a.aglTransit;
          const ev = t.evol ? (a.schema.teuField ? t.evol.teuEvolPct : t.evol.weightEvolPct) : null;
          return `• ${a.schema.label} : rang n°${t.rank}, PDM ${fmt(t.pdmMetric,1)} %${ev !== null && !isNaN(ev) ? ` (${ev>=0?"+":""}${fmt(ev,1)} % vs ${t.evol.prevYear})` : ""}`;
        }).join("\n");

        const body = encodeURIComponent(
          `Bonjour,\n\n` +
          `Veuillez trouver ci-joint le rapport stratégique généré le ${new Date().toLocaleDateString("fr-FR")} par la Direction Stratégie.\n\n` +
          `--- SYNTHÈSE ---\n` +
          `Périmètre : ${reportTitle}\n` +
          `${reportSubtitle ? reportSubtitle + "\n" : ""}` +
          `Métiers couverts : ${analysesForReport.map(a => a.schema.label).join(", ")}\n` +
          `${periodes ? "Période : " + periodes + "\n" : ""}` +
          `\n` +
          (aglParts ? `--- POSITION AGL ---\n${aglParts}\n\n` : "") +
          (insightLines ? `--- INSIGHTS CLÉS ---\n${insightLines}\n\n` : "") +
          `--- PIÈCE JOINTE ---\n` +
          `Fichier : ${filename}.html (${sizeKo} Ko)\n` +
          `Le fichier vient d'être téléchargé sur votre poste. Merci de l'attacher manuellement à ce message avant envoi (votre client mail ne permet pas l'attachement automatique).\n\n` +
          `Le rapport HTML est autonome : il peut être ouvert sur n'importe quel ordinateur sans installation.\n\n` +
          `Cordialement,\n` +
          `Direction Marketing — Division Stratégie\n` +
          `Africa Global Logistics`
        );

        // Ouvre le client mail
        window.location.href = `mailto:?subject=${subject}&body=${body}`;
        setGlobalMsg({ type:"success", text:`✓ HTML téléchargé (${sizeKo} Ko) — votre client mail s'ouvre. N'oubliez pas d'attacher le fichier au message.` });
      } else {
        setGlobalMsg({ type:"success", text:`✓ HTML autoporteur téléchargé (${sizeKo} Ko).` });
      }
      setTimeout(() => setGlobalMsg(null), 8000);
    } catch (e) {
      console.error(e); setGenerating(null);
      setGlobalMsg({ type:"error", text:`✗ Erreur HTML : ${e.message}` });
      setTimeout(() => setGlobalMsg(null), 6000);
    }
  };

  const totalLines = Object.values(metiers).reduce((s, m) => s + (m?.rows?.length || 0), 0);
  const loadedCount = Object.values(metiers).filter(m => m?.rows?.length > 0).length;

  return (
    <div className="min-h-screen">
      {/* HEADER */}
      <header className="navy text-white">
        <div className="max-w-full mx-auto px-4 py-4">
          <div className="flex justify-between items-start flex-wrap gap-3">
            <div>
              <h1 className="text-2xl font-bold flex items-center gap-2">🏢 AGL Strategic Reports Generator</h1>
              <div className="text-xs text-gray-300 mt-1">Direction Marketing — Division Stratégie · Source STATCOM · {METIER_KEYS.length} métiers couverts</div>
            </div>
            <div className="text-xs text-gray-300 text-right">
              <div>🔒 Traitement 100 % local — aucune donnée n'est envoyée sur Internet</div>
              <div className="mt-1">{loadedCount}/{METIER_KEYS.length} métiers chargés · {fmt(totalLines)} lignes en mémoire</div>
            </div>
          </div>
        </div>
        <div style={{height:"4px", background:"#c9a14a"}}></div>
      </header>

      {/* MESSAGE GLOBAL */}
      {globalMsg && (
        <div className={"max-w-full mx-auto px-4 mt-3 p-3 rounded text-sm font-medium " +
          (globalMsg.type === "success" ? "bg-green-50 text-green-800 border border-green-200" :
           globalMsg.type === "error" ? "bg-red-50 text-red-800 border border-red-200" :
           globalMsg.type === "warning" ? "bg-amber-50 text-amber-800 border border-amber-200" :
           "bg-blue-50 text-blue-800 border border-blue-200")}>
          {globalMsg.text}
        </div>
      )}

      <main className="max-w-full mx-auto px-4 py-6 space-y-6">
        {/* BARRE DE BASCULE ENTRE LES 2 VUES */}
        {loadedCount > 0 && (
          <div className="bg-white rounded-lg shadow-sm overflow-hidden flex">
            <button onClick={() => setActiveView("config")}
              className="flex-1 py-3 px-4 font-semibold text-sm transition"
              style={activeView === "config"
                ? {background:"#0a2540", color:"white"}
                : {background:"white", color:"#64748b"}}>
              ⚙️ Configuration (étapes 1 → 4)
            </button>
            <button onClick={() => setActiveView("preview")}
              className="flex-1 py-3 px-4 font-semibold text-sm transition"
              disabled={analysesForReport.length === 0 || analysesForReport.every(a => a.empty)}
              style={activeView === "preview"
                ? {background:"#c9a14a", color:"#0a2540"}
                : {background:"white", color:"#64748b", opacity: (analysesForReport.length === 0 || analysesForReport.every(a => a.empty)) ? 0.4 : 1}}>
              📊 Analyse & Prévisualisation du rapport
            </button>
          </div>
        )}

        {/* ===== VUE 1 : CONFIGURATION (étapes 1-4) ===== */}
        {activeView === "config" && (<>
        {/* ÉTAPE 1 : CHARGEMENT DES 6 MÉTIERS */}
        <section>
          <h2 className="text-lg font-bold navy-text mb-3 flex items-center gap-2">
            <span className="gold-bg text-white rounded-full w-7 h-7 flex items-center justify-center text-sm">1</span>
            Chargement des bases STATCOM
          </h2>
          <p className="text-xs text-gray-600 mb-3">Chargez <strong>un ou plusieurs fichiers Excel par métier</strong> (par exemple 1 fichier par année). Les données seront automatiquement consolidées. Vous pourrez ensuite filtrer par année via le panneau "Filtre années" ci-dessous.</p>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4">
            {METIER_KEYS.map(k => (
              <MetierCard key={k}
                metierKey={k}
                schema={METIER_SCHEMAS[k]}
                state={metiers[k]}
                isActive={activeMetier === k}
                onSelect={() => setActiveMetier(k)}
                onUpload={(file) => handleUpload(k, file)}
                onRemoveFile={(fileId) => handleRemoveFile(k, fileId)}
                onClear={() => handleClear(k)} />
            ))}
          </div>

          {/* PANNEAU FILTRE ANNÉES */}
          {allAvailableYears.length > 0 && (
            <div className="mt-4 bg-gradient-to-r from-blue-50 to-cyan-50 border border-blue-200 rounded-lg p-4">
              <div className="flex items-start justify-between flex-wrap gap-3">
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-1">
                    <span style={{fontSize:20}}>📅</span>
                    <h3 className="font-bold navy-text text-sm">Filtre années — Périmètre temporel d'analyse</h3>
                  </div>
                  <p className="text-xs text-gray-600 mb-2">
                    Cochez les années à inclure dans toutes les analyses et rapports. Si rien n'est coché, <strong>toutes les années sont incluses</strong>.
                  </p>
                  <div className="flex flex-wrap gap-2">
                    {allAvailableYears.map(y => (
                      <label key={y} className="cursor-pointer flex items-center gap-2 bg-white border border-gray-200 hover:border-blue-400 rounded-md px-3 py-1 text-sm">
                        <input type="checkbox" checked={yearFilter.has(y)} onChange={e => {
                          setYearFilter(prev => {
                            const s = new Set(prev);
                            if (e.target.checked) s.add(y);
                            else s.delete(y);
                            return s;
                          });
                        }} />
                        <span className={yearFilter.has(y) ? "font-bold navy-text" : "text-gray-700"}>{y}</span>
                      </label>
                    ))}
                  </div>
                  <div className="text-xs text-gray-500 mt-2">
                    {yearFilter.size === 0
                      ? `Toutes les années incluses (${allAvailableYears.length} années : ${allAvailableYears.join(", ")})`
                      : `${yearFilter.size} année(s) sélectionnée(s) sur ${allAvailableYears.length} : ${Array.from(yearFilter).sort().join(", ")}`}
                  </div>
                </div>
                <button className="btn-ghost text-sm" onClick={() => setYearFilter(new Set())} disabled={yearFilter.size === 0}>
                  Réinitialiser
                </button>
              </div>
            </div>
          )}

          {/* PANNEAU EXCLUSIONS */}
          <div className="mt-4 bg-gradient-to-r from-rose-50 to-orange-50 border border-rose-200 rounded-lg p-4">
            <div className="flex items-start justify-between flex-wrap gap-3">
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 mb-1">
                  <span style={{fontSize:20}}>🚫</span>
                  <h3 className="font-bold navy-text text-sm">Exclusions — Elements a retirer de l'analyse</h3>
                </div>
                <p className="text-xs text-gray-600 mb-2">
                  Cochez les categories a exclure systematiquement de toutes les analyses et rapports. Utile pour neutraliser des flux specifiques (hydrocarbures, BL non apures, etc.).
                </p>
                <div className="flex flex-wrap gap-2">
                  {[
                    { key: "nonApure", label: "🛂 NON APURE", desc: "Exclut les BL dont le champ Qualifie = 'NON APURE'." },
                    { key: "petroleBrut", label: "🛢 PRODUIT PETROLIER BRUT", desc: "Exclut les BL dont la marchandise = 'PRODUIT PETROLIER BRUT' (et variantes pluriel/sans accent)." },
                    { key: "petroleRaffine", label: "⛽ PETROLE RAFFINES", desc: "Exclut les BL dont la marchandise = 'PETROLE RAFFINES' (et variantes : PETROLE RAFFINE, produits petroliers raffines, etc.)." }
                  ].map(ex => {
                    const active = exclusions[ex.key];
                    return (
                      <label key={ex.key} title={ex.desc}
                        className="cursor-pointer flex items-center gap-2 bg-white border rounded-md px-3 py-1 text-sm"
                        style={{borderColor: active ? "#dc2626" : "#e2e8f0"}}>
                        <input type="checkbox" checked={active} onChange={e => {
                          setExclusions(prev => ({ ...prev, [ex.key]: e.target.checked }));
                        }} />
                        <span className={active ? "font-bold" : "text-gray-700"} style={{color: active ? "#dc2626" : undefined}}>{ex.label}</span>
                      </label>
                    );
                  })}
                </div>
                <div className="text-xs text-gray-500 mt-2">
                  {Object.values(exclusions).every(v => !v)
                    ? "Aucune exclusion active — toutes les donnees sont incluses."
                    : `${Object.values(exclusions).filter(v => v).length} exclusion(s) active(s) : ${Object.entries(exclusions).filter(([_, v]) => v).map(([k]) => ({nonApure:"NON APURE", petroleBrut:"PRODUIT PETROLIER BRUT", petroleRaffine:"PETROLE RAFFINES"}[k])).join(", ")}.`}
                </div>
              </div>
              <button className="btn-ghost text-sm"
                onClick={() => setExclusions({ nonApure: false, petroleBrut: false, petroleRaffine: false })}
                disabled={Object.values(exclusions).every(v => !v)}>
                Réinitialiser
              </button>
            </div>
          </div>

          {/* PANNEAU MÉMORISATION */}
          <div className="mt-4 bg-gradient-to-r from-blue-50 to-amber-50 border border-amber-200 rounded-lg p-4">
            <div className="flex items-start justify-between flex-wrap gap-3">
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 mb-1">
                  <span style={{fontSize:20}}>💾</span>
                  <h3 className="font-bold navy-text text-sm">Mémoire locale — Sauvegarde entre sessions</h3>
                </div>
                <p className="text-xs text-gray-600">
                  Les données sont stockées <strong>en local dans votre navigateur</strong> (IndexedDB) — elles ne quittent jamais votre poste.
                  À la prochaine ouverture, vous pourrez les restaurer en un clic.
                </p>
                {memLastSave && (
                  <p className="text-xs text-gray-500 mt-1">
                    Dernière mémorisation : {new Date(memLastSave).toLocaleString("fr-FR")} ·
                    {" "}{Object.keys(memAvailable).length} métier(s) en mémoire
                    {Object.keys(memAvailable).length > 0 && " : " + Object.keys(memAvailable).map(k => METIER_SCHEMAS[k].label).join(", ")}
                  </p>
                )}
              </div>
              <div className="flex flex-col gap-2 items-end">
                <div className="flex gap-2 flex-wrap">
                  <button className="btn-gold text-sm" onClick={() => saveMemory(false)} disabled={memSaving || loadedCount === 0}>
                    {memSaving ? <><span className="loading-spin"></span> En cours…</> : "💾 Mémoriser maintenant"}
                  </button>
                  <button className="btn-ghost text-sm" onClick={restoreMemory} disabled={memSaving || Object.keys(memAvailable).length === 0}>
                    🔄 Restaurer la mémoire
                  </button>
                  <button className="btn-ghost text-sm" onClick={clearMemory} disabled={memSaving || Object.keys(memAvailable).length === 0} title="Effacer la mémoire locale">
                    🗑 Effacer
                  </button>
                </div>
                <label className="text-xs text-gray-600 flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" checked={autoSave} onChange={e => setAutoSave(e.target.checked)} />
                  Mémoriser automatiquement à chaque chargement
                </label>
              </div>
            </div>
          </div>
        </section>

        {/* ÉTAPE 2 : FILTRES */}
        {loadedCount > 0 && (
          <section>
            <h2 className="text-lg font-bold navy-text mb-3 flex items-center gap-2">
              <span className="gold-bg text-white rounded-full w-7 h-7 flex items-center justify-center text-sm">2</span>
              Application des filtres par métier
            </h2>
            <div className="flex gap-2 mb-3 flex-wrap">
              {METIER_KEYS.filter(k => metiers[k]?.rows?.length).map(k => (
                <button key={k}
                  className={"px-4 py-2 rounded-t-lg text-sm font-semibold transition " + (activeMetier === k ? "tab-active" : "tab-inactive hover:bg-gray-200")}
                  onClick={() => setActiveMetier(k)}>
                  {METIER_SCHEMAS[k].icon} {METIER_SCHEMAS[k].label}
                </button>
              ))}
            </div>
            {activeMetier && metiers[activeMetier]?.index && (
              <FiltersPanel schema={METIER_SCHEMAS[activeMetier]}
                index={metiers[activeMetier].index}
                filters={metiers[activeMetier].filters || {}}
                setFilters={(upd) => setFiltersFor(activeMetier, upd)} />
            )}
          </section>
        )}

        {/* ÉTAPE 3 : CONFIGURATION DU RAPPORT */}
        {loadedCount > 0 && (
          <section>
            <h2 className="text-lg font-bold navy-text mb-3 flex items-center gap-2">
              <span className="gold-bg text-white rounded-full w-7 h-7 flex items-center justify-center text-sm">3</span>
              Configuration du dossier de réponse
            </h2>
            <div className="bg-white p-5 rounded-lg shadow-sm space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="text-xs font-semibold navy-text block mb-1">Titre du rapport</label>
                  <input type="text" value={reportTitle} onChange={e => setReportTitle(e.target.value)} />
                </div>
                <div>
                  <label className="text-xs font-semibold navy-text block mb-1">Sous-titre (période / contexte)</label>
                  <input type="text" value={reportSubtitle} onChange={e => setReportSubtitle(e.target.value)} />
                </div>
              </div>
              <div>
                <label className="text-xs font-semibold navy-text block mb-2">Composition du rapport</label>
                <div className="flex gap-3">
                  <button className={"btn-ghost " + (mode === "multi" ? "ring-2 ring-amber-500 font-bold" : "")} onClick={() => setMode("multi")}>📚 Rapport consolidé (plusieurs métiers)</button>
                  <button className={"btn-ghost " + (mode === "single" ? "ring-2 ring-amber-500 font-bold" : "")} onClick={() => setMode("single")} disabled={!activeMetier}>📄 Métier sélectionné uniquement</button>
                </div>
              </div>
              {mode === "multi" && (
                <div>
                  <label className="text-xs font-semibold navy-text block mb-2">Métiers à inclure dans le rapport consolidé :</label>
                  <div className="flex flex-wrap gap-2">
                    {METIER_KEYS.filter(k => metiers[k]?.rows?.length).map(k => {
                      const on = selectedForReport.has(k);
                      return (
                        <span key={k} className={"chip " + (on ? "chip-active" : "")}
                          onClick={() => setSelectedForReport(prev => { const s = new Set(prev); if (s.has(k)) s.delete(k); else s.add(k); return s; })}>
                          {METIER_SCHEMAS[k].icon} {METIER_SCHEMAS[k].label}
                        </span>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          </section>
        )}

        {/* ÉTAPE 4 : GÉNÉRATION */}
        {loadedCount > 0 && (
          <section>
            <h2 className="text-lg font-bold navy-text mb-3 flex items-center gap-2">
              <span className="gold-bg text-white rounded-full w-7 h-7 flex items-center justify-center text-sm">4</span>
              Génération des livrables
            </h2>
            <div className="bg-white p-5 rounded-lg shadow-sm">
              <div className="flex flex-wrap gap-3 items-center mb-3">
                <button className="btn-primary" onClick={generateAll} disabled={!canGenerate || generating}>{generating ? <><span className="loading-spin"></span> En cours…</> : "🚀 Générer DOCX + PDF + PPTX"}</button>
                <span className="text-gray-400">|</span>
                <button className="btn-ghost" onClick={() => generateOne("docx")} disabled={!canGenerate || generating}>📝 DOCX seul</button>
                <button className="btn-ghost" onClick={() => generateOne("pdf")} disabled={!canGenerate || generating}>📕 PDF seul</button>
                <button className="btn-ghost" onClick={() => generateOne("pptx")} disabled={!canGenerate || generating}>🎯 PPTX seul</button>
              </div>
              {/* SECTION HTML & EMAIL */}
              <div className="border-t pt-3 mt-3">
                <div className="text-xs font-semibold navy-text mb-2">📧 Export HTML autoporteur & envoi par email</div>
                <div className="flex flex-wrap gap-3 items-center mb-2">
                  <button className="btn-gold" onClick={() => generateHTMLReport(false)} disabled={!canGenerate || generating}>
                    🌐 Télécharger le rapport HTML
                  </button>
                  <button className="btn-gold" onClick={() => generateHTMLReport(true)} disabled={!canGenerate || generating}>
                    📧 Télécharger + Ouvrir client mail
                  </button>
                </div>
                <div className="text-xs text-gray-500 italic">
                  Le HTML autoporteur contient tout le rapport (KPI, YoY, PDM AGL, segmentation) et s'ouvre sur n'importe quel ordinateur sans installation.
                  L'option "Ouvrir client mail" pré-remplit un message avec la synthèse — le fichier HTML, téléchargé en parallèle, est à attacher manuellement (limitation universelle des navigateurs).
                </div>
              </div>
              {!canGenerate && <div className="text-xs text-gray-500 italic mt-2">Sélectionnez au moins un métier avec des données pour activer la génération.</div>}
            </div>
          </section>
        )}

        {/* PRÉVISUALISATION */}
        </>)}

        {/* ===== VUE 2 : ANALYSE & PRÉVISUALISATION ===== */}
        {activeView === "preview" && analysesForReport.length > 0 && analysesForReport.some(a => !a.empty) && (
          <section>
            <h2 className="text-lg font-bold navy-text mb-3 flex items-center gap-2">
              <span className="gold-bg text-white rounded-full w-7 h-7 flex items-center justify-center text-sm">📊</span>
              Analyse & Prévisualisation du rapport
            </h2>
            <ReportPreview analyses={analysesForReport} allMetiers={metiers} rowsByMetier={Object.fromEntries(METIER_KEYS.map(k => [k, metiers[k]?.rows || null]))} yearFilter={yearFilter} setYearFilter={setYearFilter} />
          </section>
        )}

        {loadedCount === 0 && (
          <div className="bg-white p-10 rounded-lg shadow-sm text-center">
            <div className="text-5xl mb-4">📊</div>
            <h3 className="text-xl font-bold navy-text mb-2">Bienvenue dans le générateur de rapports stratégiques AGL</h3>
            <p className="text-gray-600 text-sm max-w-2xl mx-auto">Chargez de 1 à 6 fichiers Excel STATCOM (Import Maritime, Export Maritime, Import Aérien, Export Aérien, Hinterland Import, Hinterland Export). L'application détecte automatiquement le métier, applique vos filtres, et génère un dossier complet en DOCX, PDF et PowerPoint conforme au format Direction Stratégie.</p>
            {Object.keys(memAvailable).length > 0 && (
              <div className="mt-6 inline-block bg-gradient-to-r from-amber-50 to-blue-50 border border-amber-300 rounded-lg p-4 max-w-2xl">
                <div className="text-sm font-bold navy-text mb-2">💾 Données mémorisées disponibles</div>
                <div className="text-xs text-gray-700 mb-3">
                  {Object.keys(memAvailable).length} métier(s) sauvegardé(s) lors de votre dernière session
                  {memLastSave && ` (${new Date(memLastSave).toLocaleString("fr-FR")})`}
                </div>
                <div className="text-xs text-gray-600 mb-3">
                  {Object.entries(memAvailable).map(([k, v]) => (
                    <div key={k}>• <strong>{METIER_SCHEMAS[k].label}</strong> — {v.nbRows?.toLocaleString("fr-FR") || "?"} lignes ({v.fileName || "(sans nom)"})</div>
                  ))}
                </div>
                <button className="btn-gold text-sm" onClick={restoreMemory} disabled={memSaving}>
                  {memSaving ? <><span className="loading-spin"></span> Restauration…</> : "🔄 Restaurer la mémoire"}
                </button>
              </div>
            )}
            <p className="text-xs text-gray-400 mt-6">🔒 Tous les traitements sont effectués localement dans votre navigateur — aucune donnée n'est envoyée sur Internet.</p>
          </div>
        )}
      </main>

      <footer className="navy text-gray-300 text-center py-4 text-xs mt-10">
        <div>AGL Strategic Reports Generator — Direction Marketing / Division Stratégie</div>
        <div className="opacity-70">Confidentiel — Usage interne AGL / COMEX · Aucune donnée ne quitte ce poste</div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
