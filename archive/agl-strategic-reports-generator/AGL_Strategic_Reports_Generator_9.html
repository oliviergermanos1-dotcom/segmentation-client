// ============================================================
// COMPOSANT : Executive Summary consolide (style EY / McKinsey / Bloomberg)
// Un seul bloc dense au lieu de N bullets isoles.
// Structure : Market Pulse → Competitive Landscape → Strategic Takeaway
// ============================================================
function ExecutiveSummary({ A, schema }) {
  if (!A || A.empty) return null;
  const unit = schema.teuField ? "TEU" : "tonnes";
  const totalVolume = schema.teuField ? A.totalTEU : A.totalWeight;
  const blLabel = schema.type === "maritime" ? "BL" : "LTA";

  // Trajectoire
  const trend = A.evol ? (schema.teuField ? A.evol.teuEvolPct : A.evol.weightEvolPct) : null;
  const trendDir = trend === null || isNaN(trend) ? null : (trend > 5 ? "expansion" : trend > -5 ? "stabilite" : "recession");
  const trendLabel = trendDir === "expansion" ? "↑ EXPANSION" : trendDir === "stabilite" ? "→ STABLE" : trendDir === "recession" ? "↓ RECESSION" : "—";
  const trendColor = trendDir === "expansion" ? "#15803d" : trendDir === "stabilite" ? "#0a2540" : trendDir === "recession" ? "#dc2626" : "#64748b";

  // Concentration commerciale → diagnostic
  const top10 = A.top10Share || 0;
  const concentLabel = top10 > 60 ? "très concentré" : top10 > 35 ? "concentré" : top10 > 15 ? "modérément fragmenté" : "très fragmenté";

  // Origine / destination dominante
  const topOrigine = A.topPaysOrigine && A.topPaysOrigine.length > 0 ? A.topPaysOrigine[0] : null;
  const topOrigineShare = topOrigine ? (topOrigine.bl / A.nbBL * 100) : 0;

  // Leader transit
  const leader = A.topTransitaires && A.topTransitaires.length > 0 ? A.topTransitaires[0] : null;
  const leaderShare = leader ? (schema.teuField ? (leader.teu / Math.max(A.totalTEU, 1) * 100) : (leader.weight / Math.max(A.totalWeight, 1) * 100)) : 0;

  // Position AGL
  const aglT = A.aglTransit;
  const aglPdm = aglT ? aglT.pdmMetric : null;
  const aglRank = aglT ? aglT.rank : null;
  const aglEvol = aglT && aglT.evol ? (schema.teuField ? aglT.evol.teuEvolPct : aglT.evol.weightEvolPct) : null;
  const aglPosLabel = aglPdm === null ? null
    : aglPdm >= 40 ? "leadership"
    : aglPdm >= 25 ? "leader sectoriel"
    : aglPdm >= 15 ? "challenger fort"
    : aglPdm >= 8 ? "challenger"
    : "position d'entrant";

  // Strategic takeaway : combine trend + AGL evolution + concentration
  let takeawayTitle = "Position à consolider";
  let takeawayText = "Diagnostiquer les drivers locaux et calibrer une réponse commerciale ciblée.";
  if (aglPdm !== null && trend !== null) {
    if (aglEvol !== null && aglEvol > trend + 5) {
      // AGL surperforme le marché
      takeawayTitle = "Gains de parts en cours";
      takeawayText = `AGL surperforme le marché (${aglEvol >= 0 ? "+" : ""}${fmt(aglEvol, 1)} % vs ${trend >= 0 ? "+" : ""}${fmt(trend, 1)} % marché). Capitaliser : sécuriser les comptes clés, étendre l'offre cross-sell, et formaliser les engagements pluriannuels.`;
    } else if (aglEvol !== null && aglEvol < trend - 5) {
      // AGL sous-performe le marché
      takeawayTitle = "Décrochage face au marché";
      takeawayText = `AGL recule plus vite (${aglEvol >= 0 ? "+" : ""}${fmt(aglEvol, 1)} %) que le marché (${trend >= 0 ? "+" : ""}${fmt(trend, 1)} %). Priorité : analyse de pertes (clients sortis, marchandises délaissées), riposte commerciale ciblée sur le Top 10 et plan de réactivation des comptes dormants.`;
    } else if (trendDir === "recession" && aglPdm >= 25) {
      takeawayTitle = "Leadership en marché récessif";
      takeawayText = `Marché en recul (${fmt(trend, 1)} %) mais AGL maintient une position de ${aglPosLabel} (PDM ${fmt(aglPdm, 1)} %). Profiter de la consolidation sectorielle : démarchage des comptes orphelins concurrents et négociation contractuelle sur les comptes Top.`;
    } else if (trendDir === "expansion" && aglPdm < 15) {
      takeawayTitle = "Marché porteur sous-exploité";
      takeawayText = `Marché en croissance (${trend >= 0 ? "+" : ""}${fmt(trend, 1)} %) mais AGL en ${aglPosLabel} (PDM ${fmt(aglPdm, 1)} %). Gisement de parts à capturer : redéployer commercialement sur les origines / destinations clés et adapter l'offre aux marchandises dominantes du segment.`;
    } else {
      takeawayTitle = `${aglPosLabel.charAt(0).toUpperCase() + aglPosLabel.slice(1)} à consolider`;
      takeawayText = `AGL en ${aglPosLabel} (PDM ${fmt(aglPdm, 1)} % en ${unit}, rang n°${aglRank}/${aglT.totalTransitaires}). Marché ${concentLabel} (T10 = ${fmt(top10, 1)} %). Maintenir la pression sur les Top 10 et identifier les comptes mid-tier à upgrader.`;
    }
  }

  return (
    <div style={{
      background: "linear-gradient(135deg, #0a2540 0%, #1e3a5f 100%)",
      color: "white", borderRadius: 8, padding: 0,
      marginBottom: 16, boxShadow: "0 4px 12px rgba(10,37,64,0.15)",
      overflow: "hidden"
    }}>
      {/* HEADER bandeau dore */}
      <div style={{background: "#c9a14a", color: "#0a2540", padding: "8px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", fontWeight: 700, fontSize: 12, textTransform: "uppercase", letterSpacing: 1}}>
        <span>📊 Executive Brief — {schema.label}</span>
        <span style={{fontSize: 10, fontWeight: 600, opacity: 0.85}}>Periode analysee {A.byYear && A.byYear.length > 0 ? `${A.byYear[0].year} – ${A.byYear[A.byYear.length-1].year}` : "—"}</span>
      </div>

      {/* MARKET PULSE bandeau de stats type Bloomberg */}
      <div style={{padding: "12px 18px", borderBottom: "1px solid rgba(255,255,255,0.1)", display:"flex", gap: 22, flexWrap: "wrap", alignItems: "center", fontSize: 12}}>
        <div><span style={{opacity: 0.65, fontSize: 10, textTransform:"uppercase", letterSpacing: 0.6, display:"block"}}>{blLabel} qualifies</span><strong style={{fontSize: 16}}>{fmt(A.nbBL)}</strong></div>
        {schema.teuField && (
          <div><span style={{opacity: 0.65, fontSize: 10, textTransform:"uppercase", letterSpacing: 0.6, display:"block"}}>TEU totaux</span><strong style={{fontSize: 16}}>{fmt(A.totalTEU)}</strong></div>
        )}
        <div><span style={{opacity: 0.65, fontSize: 10, textTransform:"uppercase", letterSpacing: 0.6, display:"block"}}>{schema.clientLabel}s uniques</span><strong style={{fontSize: 16}}>{fmt(A.nbClients)}</strong></div>
        {trend !== null && !isNaN(trend) && (
          <div><span style={{opacity: 0.65, fontSize: 10, textTransform:"uppercase", letterSpacing: 0.6, display:"block"}}>Trajectoire {A.evol.year}/{A.evol.prevYear}</span>
            <strong style={{fontSize: 16, color: trendColor === "#dc2626" ? "#fca5a5" : trendColor === "#15803d" ? "#86efac" : "white"}}>
              {trend >= 0 ? "+" : ""}{fmt(trend, 1)} %
            </strong>
            <span style={{marginLeft: 6, padding: "2px 6px", background: "rgba(255,255,255,0.15)", borderRadius: 3, fontSize: 9, fontWeight: 700}}>{trendLabel}</span>
          </div>
        )}
        {aglPdm !== null && (
          <div><span style={{opacity: 0.65, fontSize: 10, textTransform:"uppercase", letterSpacing: 0.6, display:"block"}}>PDM AGL ({unit})</span>
            <strong style={{fontSize: 16, color: "#c9a14a"}}>{fmt(aglPdm, 1)} %</strong>
            <span style={{marginLeft: 6, fontSize: 10, opacity: 0.75}}>(rang {aglRank}/{aglT.totalTransitaires})</span>
          </div>
        )}
      </div>

      {/* Corps : 3 sections en colonnes */}
      <div style={{padding: "16px 18px", display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 18}}>

        {/* MARKET CONTEXT */}
        <div>
          <div style={{fontSize: 10, fontWeight: 700, color: "#c9a14a", textTransform: "uppercase", letterSpacing: 1.2, marginBottom: 6, borderBottom: "1px solid rgba(201,161,74,0.4)", paddingBottom: 4}}>
            📡 Market Context
          </div>
          <div style={{fontSize: 12, lineHeight: 1.55, opacity: 0.92}}>
            Périmètre <strong>{fmt(A.nbBL)} {blLabel}</strong> · <strong>{fmt(totalVolume, schema.teuField ? 0 : 0)} {unit}</strong> · <strong>{fmt(A.totalWeight, 0)} kg</strong>.
            {trend !== null && !isNaN(trend) && <> Trajectoire <strong style={{color: trendColor === "#dc2626" ? "#fca5a5" : trendColor === "#15803d" ? "#86efac" : "#fde68a"}}>{trend >= 0 ? "+" : ""}{fmt(trend, 1)} %</strong> vs N-1.</>}
            {topOrigine && <> Origine dominante : <strong>{topOrigine.key}</strong> ({fmt(topOrigineShare, 1)} % du flux).</>}
            <div style={{marginTop: 6, fontSize: 11, opacity: 0.75, fontStyle: "italic"}}>
              Marché <strong>{concentLabel}</strong> (Top 10 = {fmt(top10, 1)} %).
            </div>
          </div>
        </div>

        {/* COMPETITIVE LANDSCAPE */}
        <div>
          <div style={{fontSize: 10, fontWeight: 700, color: "#c9a14a", textTransform: "uppercase", letterSpacing: 1.2, marginBottom: 6, borderBottom: "1px solid rgba(201,161,74,0.4)", paddingBottom: 4}}>
            ⚔ Competitive Landscape
          </div>
          <div style={{fontSize: 12, lineHeight: 1.55, opacity: 0.92}}>
            {leader && <>Leader transit : <strong>{leader.key}</strong> ({fmt(leaderShare, 1)} % des {unit}).</>}
            {aglPdm !== null && (
              <>
                {" "}AGL : <strong style={{color: "#c9a14a"}}>{aglPosLabel}</strong> · rang <strong>n°{aglRank}/{aglT.totalTransitaires}</strong> · PDM <strong>{fmt(aglPdm, 1)} %</strong>
                {aglEvol !== null && !isNaN(aglEvol) && (
                  <> · évolution <strong style={{color: aglEvol >= 0 ? "#86efac" : "#fca5a5"}}>{aglEvol >= 0 ? "+" : ""}{fmt(aglEvol, 1)} %</strong></>
                )}.
              </>
            )}
            {aglPdm !== null && trend !== null && aglEvol !== null && (
              <div style={{marginTop: 6, fontSize: 11, opacity: 0.75, fontStyle: "italic"}}>
                {aglEvol > trend + 5 ? "AGL surperforme le marché." : aglEvol < trend - 5 ? "AGL décroche par rapport au marché." : "AGL suit la dynamique du marché."}
              </div>
            )}
          </div>
        </div>

        {/* STRATEGIC TAKEAWAY */}
        <div style={{background: "rgba(201,161,74,0.08)", padding: 12, borderRadius: 4, borderLeft: "3px solid #c9a14a"}}>
          <div style={{fontSize: 10, fontWeight: 700, color: "#c9a14a", textTransform: "uppercase", letterSpacing: 1.2, marginBottom: 6}}>
            🎯 Strategic Takeaway
          </div>
          <div style={{fontSize: 13, fontWeight: 700, marginBottom: 6, color: "#fde68a"}}>{takeawayTitle}</div>
          <div style={{fontSize: 12, lineHeight: 1.55, opacity: 0.92}}>{takeawayText}</div>
        </div>
      </div>
    </div>
  );
}

// Helper : retourne une vue de A focalisee sur un segment (total / conteneurise / conventionnel)
function getSegmentView(A, segment) {
  if (!A || segment === "total" || !A.segments) return A;
  const seg = segment === "conteneurise" ? A.segments.conteneurise : A.segments.conventionnel;
  if (!seg) return A;
  const topClients = (segment === "conteneurise" ? A.topClientsConteneurise : A.topClientsConventionnel) || [];
  // Recalcul pareto pour le segment selon la metrique primaire
  const primaryKey = segment === "conteneurise" ? "teu" : "weight";
  const totalPrim = topClients.reduce((s, c) => s + (c[primaryKey] || 0), 0);
  let cum = 0;
  const paretoClients = topClients.map(c => {
    cum += (c[primaryKey] || 0);
    return { ...c, cumPct: totalPrim > 0 ? cum / totalPrim * 100 : 0 };
  });
  return {
    ...A,
    nbBL: seg.bl,
    totalTEU: seg.teu,
    totalWeight: seg.weight,
    topClients,
    paretoClients,
    topPaysOrigine: (segment === "conteneurise" ? A.topPaysOrigineConteneurise : A.topPaysOrigineConventionnel) || [],
    topPaysDest: (segment === "conteneurise" ? A.topPaysDestConteneurise : A.topPaysDestConventionnel) || [],
    topTransitaires: (segment === "conteneurise" ? A.topTransitairesConteneurise : A.topTransitairesConventionnel) || [],
    aglTransit: segment === "conteneurise" ? A.aglTransitConteneurise : A.aglTransitConventionnel,
    _segmentLabel: segment === "conteneurise" ? "Conteneurisé" : "Conventionnel",
    _segmentIcon: segment === "conteneurise" ? "📦" : "⚓"
  };
}

  return (
    <div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
        <div className="kpi-card"><div className="kpi-value">{fmt(Av.nbBL)}</div><div className="kpi-label">{blLabel} qualifiés</div></div>
        {schema.teuField && <div className="kpi-card"><div className="kpi-value">{fmt(Av.totalTEU)}</div><div className="kpi-label">TEU totaux</div></div>}
        <div className="kpi-card"><div className="kpi-value">{fmt(Av.totalWeight,0)}</div><div className="kpi-label">Kg de marchandise</div></div>
        <div className="kpi-card"><div className="kpi-value">{fmt(A.nbClients)}</div><div className="kpi-label">{schema.clientLabel}s uniques</div></div>
      </div>

      {/* Executive Summary consolide (style EY/McKinsey/Bloomberg) - utilise la vue segmentee */}
      <ExecutiveSummary A={Av} schema={schema} />

      {/* ============ COMPARAISON N vs N-1 ============ */}
      {A.yoy && (
        <div className="mt-6">
          <div className="section-h" style={{display:"flex", alignItems:"center", gap:8, borderBottom:"2px solid #0a2540"}}>
            <span style={{background:"#0a2540", color:"#c9a14a", padding:"3px 10px", borderRadius:6, fontSize:11, fontWeight:700}}>YoY</span>
            Comparaison {A.yoy.curYear} vs {A.yoy.prevYear}
          </div>

          {/* Tableau global */}
          <div className="text-xs font-semibold navy-text mb-1 mt-3">Synthèse globale</div>
          <table className="report-table mb-3">
            <thead><tr><th>Indicateur</th><th>{A.yoy.prevYear}</th><th>{A.yoy.curYear}</th><th>Δ Valeur</th><th>Δ %</th></tr></thead>
            <tbody>
              {(() => {
                const evolColor = (v) => v === null || isNaN(v) ? "#64748b" : (v >= 0 ? "#16a34a" : "#dc2626");
                const evolFmt = (v) => v === null || isNaN(v) ? "—" : (v >= 0 ? "+" : "") + fmt(v, 1) + " %";
                const deltaFmt = (d, dec=0) => (d >= 0 ? "+" : "") + fmt(d, dec);
                const rows = [
                  { lbl: `${blLabel} qualifiés`, d: A.yoy.bl, dec: 0 },
                  ...(A.yoy.teu ? [{ lbl: "TEU", d: A.yoy.teu, dec: 0 }] : []),
                  { lbl: "Tonnage (kg)", d: A.yoy.weight, dec: 0 },
                  { lbl: `${schema.clientLabel}s uniques`, d: A.yoy.clients, dec: 0 },
                  { lbl: "Transitaires actifs", d: A.yoy.transitaires, dec: 0 },
                  { lbl: schema.type==="maritime" ? "Armateurs actifs" : "Compagnies actives", d: A.yoy.armateurs, dec: 0 },
                  ...(A.yoy.paysOrigine ? [{ lbl: "Pays d'origine", d: A.yoy.paysOrigine, dec: 0 }] : []),
                  { lbl: "Marchandises distinctes", d: A.yoy.marchandises, dec: 0 }
                ];
                return rows.map((r, i) => (
                  <tr key={i}>
                    <td><strong>{r.lbl}</strong></td>
                    <td>{fmt(r.d.prev, r.dec)}</td>
                    <td>{fmt(r.d.cur, r.dec)}</td>
                    <td>{deltaFmt(r.d.delta, r.dec)}</td>
                    <td style={{color: evolColor(r.d.deltaPct), fontWeight: 600}}>{evolFmt(r.d.deltaPct)}</td>
                  </tr>
                ));
              })()}
            </tbody>
          </table>

          {/* YoY par segment */}
          {A.yoy.segments && (
            <>
              <div className="text-xs font-semibold navy-text mb-1 mt-3">Évolution par segment marchandises</div>
              <table className="report-table mb-3">
                <thead><tr><th>Segment</th><th>Indicateur</th><th>{A.yoy.prevYear}</th><th>{A.yoy.curYear}</th><th>Δ %</th></tr></thead>
                <tbody>
                  {(() => {
                    const evolColor = (v) => v === null || isNaN(v) ? "#64748b" : (v >= 0 ? "#16a34a" : "#dc2626");
                    const evolFmt = (v) => v === null || isNaN(v) ? "—" : (v >= 0 ? "+" : "") + fmt(v, 1) + " %";
                    const out = [];
                    out.push(<tr key="c-bl" style={{background:"#eff6ff"}}><td rowSpan={schema.teuField?3:2}><strong style={{color:"#1e3a8a"}}>📦 Conteneurisé</strong></td><td>{blLabel}</td><td>{fmt(A.yoy.segments.conteneurise.bl.prev)}</td><td>{fmt(A.yoy.segments.conteneurise.bl.cur)}</td><td style={{color:evolColor(A.yoy.segments.conteneurise.bl.deltaPct), fontWeight:600}}>{evolFmt(A.yoy.segments.conteneurise.bl.deltaPct)}</td></tr>);
                    if (schema.teuField) out.push(<tr key="c-teu" style={{background:"#eff6ff"}}><td>TEU</td><td>{fmt(A.yoy.segments.conteneurise.teu.prev)}</td><td>{fmt(A.yoy.segments.conteneurise.teu.cur)}</td><td style={{color:evolColor(A.yoy.segments.conteneurise.teu.deltaPct), fontWeight:600}}>{evolFmt(A.yoy.segments.conteneurise.teu.deltaPct)}</td></tr>);
                    out.push(<tr key="c-w" style={{background:"#eff6ff"}}><td>Tonnes (kg)</td><td>{fmt(A.yoy.segments.conteneurise.weight.prev,0)}</td><td>{fmt(A.yoy.segments.conteneurise.weight.cur,0)}</td><td style={{color:evolColor(A.yoy.segments.conteneurise.weight.deltaPct), fontWeight:600}}>{evolFmt(A.yoy.segments.conteneurise.weight.deltaPct)}</td></tr>);
                    out.push(<tr key="v-bl" style={{background:"#fff7ed"}}><td rowSpan={schema.teuField?3:2}><strong style={{color:"#9a3412"}}>⚓ Conventionnel</strong></td><td>{blLabel}</td><td>{fmt(A.yoy.segments.conventionnel.bl.prev)}</td><td>{fmt(A.yoy.segments.conventionnel.bl.cur)}</td><td style={{color:evolColor(A.yoy.segments.conventionnel.bl.deltaPct), fontWeight:600}}>{evolFmt(A.yoy.segments.conventionnel.bl.deltaPct)}</td></tr>);
                    if (schema.teuField) out.push(<tr key="v-teu" style={{background:"#fff7ed"}}><td>TEU</td><td>{fmt(A.yoy.segments.conventionnel.teu.prev)}</td><td>{fmt(A.yoy.segments.conventionnel.teu.cur)}</td><td style={{color:evolColor(A.yoy.segments.conventionnel.teu.deltaPct), fontWeight:600}}>{evolFmt(A.yoy.segments.conventionnel.teu.deltaPct)}</td></tr>);
                    out.push(<tr key="v-w" style={{background:"#fff7ed"}}><td>Tonnes (kg)</td><td>{fmt(A.yoy.segments.conventionnel.weight.prev,0)}</td><td>{fmt(A.yoy.segments.conventionnel.weight.cur,0)}</td><td style={{color:evolColor(A.yoy.segments.conventionnel.weight.deltaPct), fontWeight:600}}>{evolFmt(A.yoy.segments.conventionnel.weight.deltaPct)}</td></tr>);
                    return out;
                  })()}
                </tbody>
              </table>
            </>
          )}

          {/* Top clients YoY */}
          {A.yoy.topClients.length > 0 && (
            <>
              <div className="text-xs font-semibold navy-text mb-1 mt-3">Top {schema.clientLabel}s — Évolution</div>
              <table className="report-table mb-3">
                <thead><tr><th>#</th><th>{schema.clientLabel}</th><th>{A.yoy.prevYear}</th><th>{A.yoy.curYear}</th><th>Δ %</th></tr></thead>
                <tbody>{A.yoy.topClients.slice(0,10).map((c, i) => {
                  const evolColor = c.deltaPct === null || isNaN(c.deltaPct) ? "#7c3aed" : (c.deltaPct >= 0 ? "#16a34a" : "#dc2626");
                  const evolTxt = c.deltaPct === null || isNaN(c.deltaPct) ? "NEW" : (c.deltaPct >= 0 ? "+" : "") + fmt(c.deltaPct,1) + " %";
                  return (<tr key={i}>
                    <td>{i+1}</td><td>{c.key.substring(0,50)}</td>
                    <td>{fmt(c.prevMetric, schema.teuField?0:0)}</td>
                    <td>{fmt(c.curMetric, schema.teuField?0:0)}</td>
                    <td style={{color: evolColor, fontWeight: 600}}>{evolTxt}</td>
                  </tr>);
                })}</tbody>
              </table>
            </>
          )}

          {/* Gagnants / Perdants */}
          {(A.yoy.gagnantsPct.length > 0 || A.yoy.perdantsPct.length > 0) && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3 mt-3">
              {A.yoy.gagnantsPct.length > 0 && (
                <div style={{background:"#f0fdf4", borderLeft:"4px solid #16a34a", padding:"10px 12px", borderRadius:6}}>
                  <div style={{fontSize:12, fontWeight:700, color:"#15803d", marginBottom:6}}>🚀 Top 5 gagnants (Δ % {schema.teuField?"TEU":"Tonnes"})</div>
                  {A.yoy.gagnantsPct.map((c,i) => (
                    <div key={i} style={{fontSize:12, padding:"3px 0", display:"flex", justifyContent:"space-between"}}>
                      <span>{c.key.substring(0,40)}</span>
                      <strong style={{color:"#16a34a"}}>+{fmt(c.deltaPct,1)} %</strong>
                    </div>
                  ))}
                </div>
              )}
              {A.yoy.perdantsPct.length > 0 && (
                <div style={{background:"#fef2f2", borderLeft:"4px solid #dc2626", padding:"10px 12px", borderRadius:6}}>
                  <div style={{fontSize:12, fontWeight:700, color:"#991b1b", marginBottom:6}}>📉 Top 5 perdants (Δ % {schema.teuField?"TEU":"Tonnes"})</div>
                  {A.yoy.perdantsPct.map((c,i) => (
                    <div key={i} style={{fontSize:12, padding:"3px 0", display:"flex", justifyContent:"space-between"}}>
                      <span>{c.key.substring(0,40)}</span>
                      <strong style={{color:"#dc2626"}}>{fmt(c.deltaPct,1)} %</strong>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Top pays origine YoY */}
          {A.yoy.topPaysOrigine.length > 0 && (
            <>
              <div className="text-xs font-semibold navy-text mb-1 mt-3">Top pays d'origine — Évolution (en {blLabel})</div>
              <table className="report-table mb-3">
                <thead><tr><th>#</th><th>Pays</th><th>{A.yoy.prevYear}</th><th>{A.yoy.curYear}</th><th>Δ %</th></tr></thead>
                <tbody>{A.yoy.topPaysOrigine.slice(0,10).map((c, i) => {
                  const evolColor = c.deltaPct === null || isNaN(c.deltaPct) ? "#7c3aed" : (c.deltaPct >= 0 ? "#16a34a" : "#dc2626");
                  const evolTxt = c.deltaPct === null || isNaN(c.deltaPct) ? "NEW" : (c.deltaPct >= 0 ? "+" : "") + fmt(c.deltaPct,1) + " %";
                  return (<tr key={i}>
                    <td>{i+1}</td><td>{c.key}</td>
                    <td>{fmt(c.prevBL)}</td><td>{fmt(c.curBL)}</td>
                    <td style={{color: evolColor, fontWeight: 600}}>{evolTxt}</td>
                  </tr>);
                })}</tbody>
              </table>
            </>
          )}

          {/* Top marchandises YoY */}
          {A.yoy.topMarchandises.length > 0 && (
            <>
              <div className="text-xs font-semibold navy-text mb-1 mt-3">Top marchandises — Évolution (en {schema.teuField?"TEU":"Tonnes"})</div>
              <table className="report-table mb-3">
                <thead><tr><th>#</th><th>Marchandise</th><th>{A.yoy.prevYear}</th><th>{A.yoy.curYear}</th><th>Δ %</th></tr></thead>
                <tbody>{A.yoy.topMarchandises.slice(0,10).map((c, i) => {
                  const evolColor = c.deltaPct === null || isNaN(c.deltaPct) ? "#7c3aed" : (c.deltaPct >= 0 ? "#16a34a" : "#dc2626");
                  const evolTxt = c.deltaPct === null || isNaN(c.deltaPct) ? "NEW" : (c.deltaPct >= 0 ? "+" : "") + fmt(c.deltaPct,1) + " %";
                  return (<tr key={i}>
                    <td>{i+1}</td><td>{c.key.substring(0,50)}</td>
                    <td>{fmt(c.prevMetric, 0)}</td>
                    <td>{fmt(c.curMetric, 0)}</td>
                    <td style={{color: evolColor, fontWeight: 600}}>{evolTxt}</td>
                  </tr>);
                })}</tbody>
              </table>
            </>
          )}

          {/* Top transitaires YoY (avec AGL surligné) */}
          {A.yoy.topTransitaires.length > 0 && (
            <>
              <div className="text-xs font-semibold navy-text mb-1 mt-3">Top transitaires — Évolution (en {schema.teuField?"TEU":"Tonnes"})</div>
              <table className="report-table mb-3">
                <thead><tr><th>#</th><th>Transitaire</th><th>{A.yoy.prevYear}</th><th>{A.yoy.curYear}</th><th>Δ %</th></tr></thead>
                <tbody>{A.yoy.topTransitaires.slice(0,10).map((c, i) => {
                  const evolColor = c.deltaPct === null || isNaN(c.deltaPct) ? "#7c3aed" : (c.deltaPct >= 0 ? "#16a34a" : "#dc2626");
                  const evolTxt = c.deltaPct === null || isNaN(c.deltaPct) ? "NEW" : (c.deltaPct >= 0 ? "+" : "") + fmt(c.deltaPct,1) + " %";
                  const upper = (c.key || "").toUpperCase();
                  const isAGLrow = upper.includes("AFRICA GLOBAL LOGISTICS") || upper.includes("BOLLORÉ") || upper.includes("BOLLORE");
                  return (<tr key={i} style={isAGLrow ? {background:"#fef9e7", fontWeight:600} : {}}>
                    <td>{i+1}</td>
                    <td>{c.key.substring(0,50)}{isAGLrow && <span style={{marginLeft:8, background:"#c9a14a", color:"#0a2540", padding:"1px 8px", borderRadius:4, fontSize:10, fontWeight:700}}>AGL</span>}</td>
                    <td>{fmt(c.prevMetric, 0)}</td>
                    <td>{fmt(c.curMetric, 0)}</td>
                    <td style={{color: evolColor, fontWeight: 600}}>{evolTxt}</td>
                  </tr>);
                })}</tbody>
              </table>
            </>
          )}
        </div>
      )}

      {/* ============ ZOOM AGL — ANALYSE STRATÉGIQUE McKINSEY ============ */}
      {Av.aglTransit && (() => {
        const a = Av.aglTransit;
        const evolV = a.evol ? (schema.teuField ? a.evol.teuEvolPct : a.evol.weightEvolPct) : null;

        // ---- Calculs stratégiques McKinsey-style ----
        // 1. Signature de leadership : où AGL est-il fort / faible ?
        const positionLbl = a.pdmMetric >= 40 ? "Leadership incontesté"
                          : a.pdmMetric >= 25 ? "Leader sectoriel"
                          : a.pdmMetric >= 15 ? "Challenger fort"
                          : a.pdmMetric >= 8 ? "Challenger en construction"
                          : "Position d'entrant à consolider";
        const positionColor = a.pdmMetric >= 25 ? "#16a34a" : a.pdmMetric >= 15 ? "#c9a14a" : a.pdmMetric >= 8 ? "#f59e0b" : "#dc2626";

        // 2. Concentration portefeuille AGL : top clients AGL
        // On reconstruit depuis aglPdmByClient : volume AGL par client puis top
        const aglByClient = [];
        if (A.aglPdmByClient) {
          for (const [k, v] of A.aglPdmByClient.entries()) {
            if (v.aglVolCur > 0 || (v.aglVolPrev > 0)) {
              aglByClient.push({ key: k, aglVolAll: (schema.teuField ? (v.aglVolCur || 0) + (v.aglVolPrev || 0) : (v.aglVolCur || 0) + (v.aglVolPrev || 0)), aglVolCur: v.aglVolCur, aglVolPrev: v.aglVolPrev, aglEvolPct: v.aglEvolPct, pdmCur: v.pdmCur });
            }
          }
          aglByClient.sort((x, y) => y.aglVolAll - x.aglVolAll);
        }
        const aglVolTotal = aglByClient.reduce((s, c) => s + c.aglVolAll, 0);
        const top5AGL = aglByClient.slice(0, 5);
        const top5Share = aglVolTotal > 0 ? top5AGL.reduce((s, c) => s + c.aglVolAll, 0) / aglVolTotal * 100 : 0;
        const top10Share = aglVolTotal > 0 ? aglByClient.slice(0, 10).reduce((s, c) => s + c.aglVolAll, 0) / aglVolTotal * 100 : 0;

        // 3. Concentration marchandises AGL (sur quoi AGL est-il fort ?)
        const aglByMarch = [];
        if (A.aglPdmByMarchandise) {
          for (const [k, v] of A.aglPdmByMarchandise.entries()) {
            if (v.aglVolCur > 0 || v.aglVolPrev > 0) {
              aglByMarch.push({ key: k, aglVolAll: (v.aglVolCur || 0) + (v.aglVolPrev || 0), pdmCur: v.pdmCur, aglEvolPct: v.aglEvolPct });
            }
          }
          aglByMarch.sort((x, y) => y.aglVolAll - x.aglVolAll);
        }

        // 4. Asymétrie concurrentielle : écart entre AGL et le n°2
        let asymetrie = null;
        if (Av.topTransitaires && Av.topTransitaires.length >= 2) {
          const isAGL = (n) => { const s = String(n||"").toUpperCase(); return s.includes("AFRICA GLOBAL LOGISTICS") || s.includes("BOLLOR"); };
          const sortedByMetric = [...Av.topTransitaires].sort((x, y) => (schema.teuField ? y.teu : y.weight) - (schema.teuField ? x.teu : x.weight));
          const aglIdx = sortedByMetric.findIndex(t => isAGL(t.key));
          if (aglIdx >= 0) {
            const aglMetric = schema.teuField ? sortedByMetric[aglIdx].teu : sortedByMetric[aglIdx].weight;
            const challengers = sortedByMetric.filter((_, i) => i !== aglIdx);
            const n2 = challengers[0];
            if (n2) {
              const n2Metric = schema.teuField ? n2.teu : n2.weight;
              asymetrie = { n2name: n2.key, n2metric: n2Metric, ratio: n2Metric > 0 ? aglMetric / n2Metric : null, gapPct: a.pdmMetric - (n2Metric / (schema.teuField ? A.totalTEU : A.totalWeight) * 100) };
            }
          }
        }

        // 5. Insights McKinsey
        const insights = [];

        // Insight 1 — Signature de positionnement
        insights.push(`**Signature de positionnement** : AGL occupe le rang n°${a.rank} sur ${a.totalTransitaires} transitaires actifs, avec ${fmt(a.pdmMetric, 1)} % de part de marché ${schema.teuField ? "TEU" : "tonnage"}. ${positionLbl.toLowerCase()} sur ce métier. ${a.pdmBL !== a.pdmMetric ? `L'écart entre PDM ${blLabel} (${fmt(a.pdmBL, 1)} %) et PDM volumes (${fmt(a.pdmMetric, 1)} %) ${a.pdmMetric > a.pdmBL ? "traduit un positionnement sur des dossiers à plus forte valeur unitaire" : "indique une volumétrie de dossiers plus dispersée que la moyenne du marché"}.` : ""}`);

        // Insight 2 — Asymétrie concurrentielle
        if (asymetrie && asymetrie.ratio !== null) {
          if (asymetrie.ratio >= 2) {
            insights.push(`**Asymétrie concurrentielle marquée** : AGL traite ${fmt(asymetrie.ratio, 1)}× plus de volume que le n°2 (${asymetrie.n2name.substring(0, 35)}). Cet écart de ${fmt(asymetrie.gapPct, 1)} points de PDM constitue une barrière à l'entrée structurelle pour les challengers.`);
          } else if (asymetrie.ratio >= 1.3) {
            insights.push(`**Avance modérée vs challenger** : AGL devance le n°2 (${asymetrie.n2name.substring(0, 35)}) d'un facteur ${fmt(asymetrie.ratio, 1)}×. Position de leader contestable — vigilance sur les comptes pivots.`);
          } else if (asymetrie.ratio >= 0.9) {
            insights.push(`**Duopole de fait** : AGL et ${asymetrie.n2name.substring(0, 35)} traitent des volumes comparables (ratio ${fmt(asymetrie.ratio, 1)}×). Marché en équilibre concurrentiel — toute perte de compte structurant inverserait le classement.`);
          } else {
            insights.push(`**Position de challenger** : ${asymetrie.n2name.substring(0, 35)} traite ${fmt(1/asymetrie.ratio, 1)}× le volume d'AGL. Le levier de croissance réside dans la reconquête de comptes stratégiques détenus par le leader.`);
          }
        }

        // Insight 3 — Concentration portefeuille AGL
        if (top5Share > 0) {
          if (top5Share >= 80) {
            insights.push(`**Concentration extrême du portefeuille AGL** : le Top 5 clients capte ${fmt(top5Share, 1)} % du volume traité par AGL — soit une dépendance bi/tri-clients structurelle. Cette concentration constitue à la fois la force (positionnement à forte marge sur des comptes structurants) et le risque (perte d'un compte = chute de PDM matérielle).`);
          } else if (top5Share >= 60) {
            insights.push(`**Portefeuille AGL concentré** : le Top 5 clients représente ${fmt(top5Share, 1)} % du volume AGL (Top 10 = ${fmt(top10Share, 1)} %). Concentration significative mais avec une longue traîne qui amortit le risque mono-client.`);
          } else if (top5Share >= 40) {
            insights.push(`**Portefeuille AGL équilibré** : Top 5 = ${fmt(top5Share, 1)} %, Top 10 = ${fmt(top10Share, 1)} %. Mix sain entre comptes structurants et longue traîne PME.`);
          } else {
            insights.push(`**Portefeuille AGL très diversifié** : aucun compte ne pèse plus de quelques %, Top 5 = ${fmt(top5Share, 1)} %. Modèle de transit de masse avec volumétrie lissée.`);
          }
        }

        // Insight 4 — Trajectoire dynamique
        if (evolV !== null && !isNaN(evolV)) {
          if (evolV >= 30) {
            insights.push(`**Trajectoire d'accélération** : croissance volume AGL de ${evolV >= 0 ? "+" : ""}${fmt(evolV, 1)} % entre ${a.evol.prevYear} et ${a.evol.year}. Inflexion à pérenniser — vérifier la robustesse du pipeline commercial 2026.`);
          } else if (evolV >= 10) {
            insights.push(`**Croissance saine** : volume AGL en progression de +${fmt(evolV, 1)} % vs ${a.evol.prevYear}. Trajectoire alignée avec la dynamique de marché global (${A.yoy && (schema.teuField ? A.yoy.teu : A.yoy.weight) ? `${fmt((schema.teuField ? A.yoy.teu.deltaPct : A.yoy.weight.deltaPct) || 0, 1)} %` : "à vérifier"}).`);
          } else if (evolV >= 0) {
            insights.push(`**Trajectoire stable** : croissance volume AGL de +${fmt(evolV, 1)} % vs ${a.evol.prevYear}. Performance modeste — diagnostic recommandé sur la trajectoire commerciale.`);
          } else {
            insights.push(`**Recul à analyser** : volume AGL en retrait de ${fmt(evolV, 1)} % vs ${a.evol.prevYear}. Cette contraction nécessite une analyse de gain/perte de comptes prioritaire.`);
          }
        }

        // Insight 5 — Segments stratégiques de marchandise
        if (aglByMarch.length > 0) {
          const top3M = aglByMarch.slice(0, 3);
          const top3MShare = aglVolTotal > 0 ? top3M.reduce((s, m) => s + m.aglVolAll, 0) / aglVolTotal * 100 : 0;
          insights.push(`**Signature marchandises** : ${fmt(top3MShare, 1)} % du volume AGL est concentré sur 3 catégories : ${top3M.map(m => m.key.substring(0, 30)).join(" · ")}. ${top3MShare >= 70 ? "Spécialisation sectorielle forte — capacités opérationnelles dédiées à pérenniser." : "Mix diversifié — opportunité de spécialisation à arbitrer."}`);
        }

        return (
          <div className="mt-6">
            <div className="section-h" style={{display:"flex", alignItems:"center", gap:8, borderBottom:"3px solid #c9a14a"}}>
              <span style={{background:"#0a2540", color:"#c9a14a", padding:"3px 10px", borderRadius:6, fontSize:11, fontWeight:700}}>FOCUS STRATÉGIQUE</span>
              6.3. Zoom Africa Global Logistics — Lecture concurrentielle
