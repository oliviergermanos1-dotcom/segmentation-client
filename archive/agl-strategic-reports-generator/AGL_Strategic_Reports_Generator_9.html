const { useState, useMemo, useCallback, useEffect, useRef } = React;

// ============================================================
// CONFIGURATION : SCHÉMAS PAR MÉTIER

const METIER_SCHEMAS = {

    transitaireField: "Transitaire", armateurField: "Armateur escale",
    consignataireField: "Consignataire", conditField: "CODE_CONDIT", modeExpField: "CODE_MODE_EXPEDITION",
    verticalField: "vertical_chargeur", statutField: "statut_chargeur", commercialField: "commercial_chargeur",

  },

    clientField: "Destinataire", clientLabel: "Destinataire",

    yearField: "Année escale", monthField: "Mois escale",
    portChargementField: "Aéroport chargement", portDechargementField: "Aéroport déchargement",
    paysOrigineField: null, paysDestField: null, lieuLivraisonField: null,
    marchandiseField: "Marchandise", transitaireField: "Transitaire", armateurField: "Compagnie",

    yearField: "Année escale", monthField: "Mois escale",
    portChargementField: "Aéroport chargement", portDechargementField: "Aéroport déchargement",
    paysOrigineField: null, paysDestField: null, lieuLivraisonField: null,
    marchandiseField: "Marchandise", transitaireField: "Transitaire", armateurField: "Compagnie",
    consignataireField: null, conditField: null, modeExpField: null,
    verticalField: "vertical_chargeur", statutField: "statut_chargeur", commercialField: "commercial_chargeur",
    qualifField: "qualifie", type: "aerien", sens: "export"
  },
  HINTERLAND_IMPORT: {
    key: "HINTERLAND_IMPORT", label: "Hinterland Import", icon: "🚛⬇",
    clientField: "Destinataire", clientLabel: "Destinataire",
    counterpartField: "Chargeur", counterpartLabel: "Chargeur",
    teuField: "NOMBRE_TEU", weightField: "POIDS_MARCHANDISE", blField: "Numéro BL",
    yearField: "Année escale", monthField: "Mois escale",
    portChargementField: "Port de chargement", portDechargementField: "Port de déchargement",
    paysOrigineField: "Pays de prise en charge", paysDestField: "Pays de livraison",
    lieuLivraisonField: "Lieu de livraison", marchandiseField: "Libellé marchandise",
    transitaireField: "Transitaire", armateurField: "Armateur escale",
    consignataireField: "Consignataire", conditField: "CODE_CONDIT", modeExpField: "CODE_MODE_EXPEDITION",
    verticalField: "vertical_destinataire", statutField: "statut_destinataire", commercialField: "commercial_destinataire",
    qualifField: "Qualifié?", type: "maritime", sens: "import"
  },
  HINTERLAND_EXPORT: {
    key: "HINTERLAND_EXPORT", label: "Hinterland Export", icon: "🚛⬆",
    clientField: "Chargeur", clientLabel: "Chargeur",
    counterpartField: "Destinataire", counterpartLabel: "Destinataire",
    teuField: "NOMBRE_TEU", weightField: "POIDS_MARCHANDISE", blField: "Numéro BL",
    yearField: "Année escale", monthField: "Mois escale",
    portChargementField: "Port de chargement", portDechargementField: "Port de déchargement",
    paysOrigineField: "Pays de prise en charge", paysDestField: "Pays de livraison",
    lieuLivraisonField: "Lieu de livraison", marchandiseField: "Libellé marchandise",
    transitaireField: "Transitaire", armateurField: "Armateur escale",
    consignataireField: "Consignataire", conditField: "CODE_CONDIT", modeExpField: "CODE_MODE_EXPEDITION",
    verticalField: "vertical_chargeur", statutField: "statut_chargeur", commercialField: "commercial_chargeur",
    qualifField: "Qualifié?", type: "maritime", sens: "export"
  }
};
const METIER_KEYS = Object.keys(METIER_SCHEMAS);

// ============================================================
// HELPERS
// ============================================================
const fmt = (n, dec=0) => {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Number(n).toLocaleString("fr-FR", {minimumFractionDigits: dec, maximumFractionDigits: dec});
};
const pct = (n, total) => total > 0 ? (n/total*100).toFixed(1) + " %" : "—";
const safeStr = (v) => v === null || v === undefined ? "" : String(v).trim();
const numVal = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };

function detectMetierKey(rows) {
  if (!rows.length) return null;
  const headers = Object.keys(rows[0]).map(x => x.toLowerCase());
  const has = (kw) => headers.some(x => x.includes(kw));
  const isAerien = has("aéroport") || has("aeroport") || has("compagnie") || has("numéro lta") || has("numero lta") || has("lta");
  let sens = null;
  const sample = rows.slice(0, Math.min(500, rows.length));
  if (rows[0].hasOwnProperty("I_IMP_E_EXP")) {
    const counts = {};
    sample.forEach(r => { const v = safeStr(r.I_IMP_E_EXP).toUpperCase(); counts[v] = (counts[v]||0)+1; });
    const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
    if (top) { if (top[0]==="I") sens="import"; else if (top[0]==="E") sens="export"; }
  } else if (rows[0].hasOwnProperty("Sens")) {
    const counts = {};
    sample.forEach(r => { const v = safeStr(r.Sens).toUpperCase(); counts[v] = (counts[v]||0)+1; });
    const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
    if (top) { if (top[0].startsWith("I")) sens="import"; else if (top[0].startsWith("E")) sens="export"; }
  }
  if (isAerien) return sens === "export" ? "EXPORT_AERIEN" : "IMPORT_AERIEN";
  return sens === "export" ? "EXPORT_MARITIME" : "IMPORT_MARITIME";
}

function getFilterableColumns(schema) {
  return [
    { field: schema.yearField, label: "Année" },
    { field: schema.monthField, label: "Mois" },
    { field: schema.clientField, label: schema.clientLabel, search: true },
    { field: schema.counterpartField, label: schema.counterpartLabel, search: true },
    { field: schema.transitaireField, label: "Transitaire", search: true },
    { field: schema.armateurField, label: schema.type === "maritime" ? "Armateur" : "Compagnie", search: true },
    { field: schema.paysOrigineField, label: "Pays origine", search: true },
    { field: schema.paysDestField, label: "Pays destination", search: true },
    { field: schema.portChargementField, label: schema.type === "maritime" ? "Port chargement" : "Aéroport chargement", search: true },
    { field: schema.portDechargementField, label: schema.type === "maritime" ? "Port déchargement" : "Aéroport déchargement", search: true },
    { field: schema.lieuLivraisonField, label: "Lieu livraison", search: true },
    { field: schema.marchandiseField, label: "Marchandise", search: true },
    { field: schema.conditField, label: "Conditionnement" },
    { field: schema.modeExpField, label: "Mode expédition" },
    { field: schema.consignataireField, label: "Consignataire", search: true },
    { field: schema.verticalField, label: "Vertical CRM" },
    { field: schema.statutField, label: "Statut client" },
    { field: schema.commercialField, label: "Commercial" },
    { field: schema.qualifField, label: "Qualifié" }
  ].filter(c => c.field);
}

// ============================================================
// MOTEUR D'ANALYSE — calcule tous les agrégats du rapport
// ============================================================
function buildAnalysis(rows, schema) {
  const A = { schema, rows };
  if (!rows.length) {
    return { ...A, empty: true, nbBL: 0, nbRows: 0, totalTEU: 0, totalWeight: 0,
      nbClients: 0, nbTransitaires: 0, nbArmateurs: 0, nbPaysOrigine: 0, nbPaysDest: 0, nbMarchandises: 0,
      topClients: [], topCounterparts: [], topTransitaires: [], topArmateurs: [],
      topPaysOrigine: [], topPaysDest: [], topMarchandises: [], topPortsCharg: [], topPortsDech: [], topLieuxLiv: [],
      byCondit: [], byModeExp: [], byVertical: [], byStatut: [],
      tempo: [], byYear: [], paretoClients: [], top5Share: 0, top10Share: 0 };
  }
  const blSet = new Set();
  let totalTEU = 0, totalWeight = 0;
  for (const r of rows) { 
    const bl = safeStr(r[schema.blField]); 
    if (bl) blSet.add(bl);
    if (schema.teuField) totalTEU += numVal(r[schema.teuField]);
    totalWeight += numVal(r[schema.weightField]);
  }
  A.nbBL = blSet.size;
  A.nbRows = rows.length;
  A.totalTEU = totalTEU;
  A.totalWeight = totalWeight;

  const distinctOf = (field) => {
    if (!field) return 0;
    const s = new Set();
    for (const r of rows) { const v = safeStr(r[field]); if (v) s.add(v); }
    return s.size;
  };
  A.nbClients = distinctOf(schema.clientField);
  A.nbTransitaires = distinctOf(schema.transitaireField);
  A.nbArmateurs = distinctOf(schema.armateurField);
  A.nbPaysOrigine = distinctOf(schema.paysOrigineField);
  A.nbPaysDest = distinctOf(schema.paysDestField);
  A.nbMarchandises = distinctOf(schema.marchandiseField);

  // Détecte si une valeur doit être exclue (vide, blanc, placeholder typique)
  function isEmptyValue(v) {
    if (v === null || v === undefined) return true;
    const s = String(v).trim().toLowerCase();
    if (s === "") return true;
    if (s === "n/a" || s === "na" || s === "null" || s === "undefined") return true;
    if (s === "(non renseigné)" || s === "non renseigné" || s === "non renseigne") return true;
    if (s === "(non renseignée)" || s === "non renseignée" || s === "non renseignee") return true;
    if (s === "-" || s === "--" || s === ".") return true;
    return false;
  }

  function aggBy(field, opts = {}) {
    if (!field) return [];
    const map = new Map();
    const blSeen = new Map();
    const rowFilter = opts.filter;
    for (const r of rows) {
      if (rowFilter && !rowFilter(r)) continue;
      const raw = r[field];
      if (isEmptyValue(raw)) continue;
      const key = safeStr(raw);
      const bl = safeStr(r[schema.blField]);
      let m = map.get(key);
      if (!m) { m = { key, teu: 0, weight: 0, rows: 0 }; map.set(key, m); blSeen.set(key, new Set()); }
      if (schema.teuField) m.teu += numVal(r[schema.teuField]);
      m.weight += numVal(r[schema.weightField]);
      m.rows += 1;
      if (bl) blSeen.get(key).add(bl);
    }
    const arr = Array.from(map.values()).map(m => ({ ...m, bl: blSeen.get(m.key).size }));
    arr.sort((a, b) => {
      if (opts.sortBy === "bl") return b.bl - a.bl;
      if (opts.sortBy === "weight") return b.weight - a.weight;
      return (b.teu || 0) - (a.teu || 0) || b.weight - a.weight || b.bl - a.bl;
    });
    return arr;
  }

  const primarySort = schema.teuField ? "teu" : "weight";
  A.topClients = aggBy(schema.clientField, { sortBy: primarySort }).slice(0, 20);
  A.topCounterparts = aggBy(schema.counterpartField, { sortBy: primarySort }).slice(0, 20);
  A.topTransitaires = aggBy(schema.transitaireField, { sortBy: primarySort }).slice(0, 15);
  A.topArmateurs = aggBy(schema.armateurField, { sortBy: primarySort }).slice(0, 15);
  A.topPaysOrigine = aggBy(schema.paysOrigineField, { sortBy: "bl" }).slice(0, 30);
  A.topPaysDest = aggBy(schema.paysDestField, { sortBy: "bl" }).slice(0, 30);
  A.topMarchandises = aggBy(schema.marchandiseField, { sortBy: primarySort }).slice(0, 15);
  A.topPortsCharg = aggBy(schema.portChargementField, { sortBy: "bl" }).slice(0, 10);
  A.topPortsDech = aggBy(schema.portDechargementField, { sortBy: "bl" }).slice(0, 10);
  A.topLieuxLiv = aggBy(schema.lieuLivraisonField, { sortBy: primarySort }).slice(0, 30);
  A.byCondit = aggBy(schema.conditField, { sortBy: "bl" });
  A.byModeExp = aggBy(schema.modeExpField, { sortBy: "bl" });
  A.byVertical = aggBy(schema.verticalField, { sortBy: primarySort });
  A.byStatut = aggBy(schema.statutField, { sortBy: primarySort });

  // ============================================================
  // SEGMENTATION CONTENEURISE / CONVENTIONNEL : Top par segment
  // (uniquement pour les maritimes - schema.conditField present)
  // ============================================================
  if (schema.teuField && schema.conditField) {
    const CONT_CODES_FILTER = new Set(["20F","20S","20TOP","40F","40S","40TOP","FLTANK","TANK"]);
    const CONV_CODES_FILTER = new Set(["BRBK","SACS","CARS","RORO","VRAC"]);
    const isConteneuriseRow = (r) => CONT_CODES_FILTER.has(String(r[schema.conditField]||"").trim().toUpperCase());
    const isConventionnelRow = (r) => CONV_CODES_FILTER.has(String(r[schema.conditField]||"").trim().toUpperCase());
    A.topClientsConteneurise = aggBy(schema.clientField, { sortBy: "teu", filter: isConteneuriseRow }).slice(0, 20);
    A.topClientsConventionnel = aggBy(schema.clientField, { sortBy: "weight", filter: isConventionnelRow }).slice(0, 20);
    A.topPaysOrigineConteneurise = aggBy(schema.paysOrigineField, { sortBy: "teu", filter: isConteneuriseRow }).slice(0, 30);
    A.topPaysOrigineConventionnel = aggBy(schema.paysOrigineField, { sortBy: "weight", filter: isConventionnelRow }).slice(0, 30);
    A.topPaysDestConteneurise = aggBy(schema.paysDestField, { sortBy: "teu", filter: isConteneuriseRow }).slice(0, 30);
    A.topPaysDestConventionnel = aggBy(schema.paysDestField, { sortBy: "weight", filter: isConventionnelRow }).slice(0, 30);
    A.topTransitairesConteneurise = aggBy(schema.transitaireField, { sortBy: "teu", filter: isConteneuriseRow }).slice(0, 15);
    A.topTransitairesConventionnel = aggBy(schema.transitaireField, { sortBy: "weight", filter: isConventionnelRow }).slice(0, 15);
  } else {
    A.topClientsConteneurise = null;
    A.topClientsConventionnel = null;
    A.topPaysOrigineConteneurise = null;
    A.topPaysOrigineConventionnel = null;
    A.topPaysDestConteneurise = null;
    A.topPaysDestConventionnel = null;
    A.topTransitairesConteneurise = null;
    A.topTransitairesConventionnel = null;
  }

  // ============================================================
  // SEGMENTATION MARCHANDISES : CONTENEURISÉ (TEU) vs CONVENTIONNEL (TONNES)
  // Règle métier AGL :
  //   - Conteneurisé : 20F, 20S, 20TOP, 40F, 40S, 40TOP, FLTANK, TANK
  //   - Conventionnel/Vrac : BRBK, SACS, CARS, RORO, VRAC
  // ============================================================
  const CONTENEURISE_CODES = new Set(["20F","20S","20TOP","40F","40S","40TOP","FLTANK","TANK"]);
  const CONVENTIONNEL_CODES = new Set(["BRBK","SACS","CARS","RORO","VRAC"]);
  const classifyCondit = (code) => {
    if (!code) return null;
    const s = String(code).trim().toUpperCase();
    if (CONTENEURISE_CODES.has(s)) return "CONTENEURISE";
    if (CONVENTIONNEL_CODES.has(s)) return "CONVENTIONNEL";
    return "AUTRE";
  };

  if (schema.conditField) {
    // Agrégats globaux par segment
    const segments = { CONTENEURISE: { bl: new Set(), teu: 0, weight: 0, rows: 0 },
                       CONVENTIONNEL: { bl: new Set(), teu: 0, weight: 0, rows: 0 },
                       AUTRE: { bl: new Set(), teu: 0, weight: 0, rows: 0 } };
    // Marchandises par segment (Map "march" → { bl:Set, teu, weight })
    const marchByCont = new Map();
    const marchByConv = new Map();
    for (const r of rows) {
      const seg = classifyCondit(r[schema.conditField]);
      if (!seg) continue;
      const s = segments[seg];
      s.rows += 1;
      if (schema.teuField) s.teu += numVal(r[schema.teuField]);
      s.weight += numVal(r[schema.weightField]);
      const bl = safeStr(r[schema.blField]); if (bl) s.bl.add(bl);
      // Détail marchandises
      const rawM = r[schema.marchandiseField];
      if (!isEmptyValue(rawM)) {
        const mKey = safeStr(rawM);
        const targetMap = seg === "CONTENEURISE" ? marchByCont : (seg === "CONVENTIONNEL" ? marchByConv : null);
        if (targetMap) {
          let entry = targetMap.get(mKey);
          if (!entry) { entry = { key: mKey, bl: new Set(), teu: 0, weight: 0 }; targetMap.set(mKey, entry); }
          if (schema.teuField) entry.teu += numVal(r[schema.teuField]);
          entry.weight += numVal(r[schema.weightField]);
          if (bl) entry.bl.add(bl);
        }
      }
    }
    A.segments = {
      conteneurise: { bl: segments.CONTENEURISE.bl.size, teu: segments.CONTENEURISE.teu, weight: segments.CONTENEURISE.weight, rows: segments.CONTENEURISE.rows },
      conventionnel: { bl: segments.CONVENTIONNEL.bl.size, teu: segments.CONVENTIONNEL.teu, weight: segments.CONVENTIONNEL.weight, rows: segments.CONVENTIONNEL.rows },
      autre: { bl: segments.AUTRE.bl.size, teu: segments.AUTRE.teu, weight: segments.AUTRE.weight, rows: segments.AUTRE.rows }
    };
    // Top 10 marchandises CONTENEURISÉES (triées par TEU)
    A.topMarchandisesConteneurise = Array.from(marchByCont.values())
      .map(m => ({ key: m.key, bl: m.bl.size, teu: m.teu, weight: m.weight }))
      .sort((a,b) => b.teu - a.teu || b.bl - a.bl).slice(0, 15);
    // Top 10 marchandises CONVENTIONNELLES (triées par tonnage)
    A.topMarchandisesConventionnel = Array.from(marchByConv.values())
      .map(m => ({ key: m.key, bl: m.bl.size, teu: m.teu, weight: m.weight }))
      .sort((a,b) => b.weight - a.weight || b.bl - a.bl).slice(0, 15);
  } else {
    A.segments = null;
    A.topMarchandisesConteneurise = [];
    A.topMarchandisesConventionnel = [];
  }

  // Évolution Année × Mois
  const tempo = new Map();
  for (const r of rows) {
    const y = safeStr(r[schema.yearField]) || "?";
    const m = safeStr(r[schema.monthField]) || "?";
    const k = `${y}|${m}`;
    let t = tempo.get(k);
    if (!t) { t = { year: y, month: m, teu: 0, weight: 0, bl: new Set() }; tempo.set(k, t); }
    if (schema.teuField) t.teu += numVal(r[schema.teuField]);
    t.weight += numVal(r[schema.weightField]);
    t.bl.add(safeStr(r[schema.blField]));
  }
  const monthOrder = { "Janvier":1,"Février":2,"Mars":3,"Avril":4,"Mai":5,"Juin":6,"Juillet":7,"Août":8,"Septembre":9,"Octobre":10,"Novembre":11,"Décembre":12 };
  A.tempo = Array.from(tempo.values()).map(t => ({...t, bl: t.bl.size}))
    .sort((a,b) => {
      const ya = String(a.year).localeCompare(String(b.year));
      if (ya !== 0) return ya;
      const mna = monthOrder[a.month] || parseInt(a.month) || 0;
      const mnb = monthOrder[b.month] || parseInt(b.month) || 0;
      return mna - mnb;
    });

  // Comparaison par année
  const yearMap = new Map();
  for (const r of rows) {
    const y = safeStr(r[schema.yearField]); if (!y) continue;
    let t = yearMap.get(y);
    if (!t) { t = { year: y, teu: 0, weight: 0, bl: new Set() }; yearMap.set(y, t); }
    if (schema.teuField) t.teu += numVal(r[schema.teuField]);
    t.weight += numVal(r[schema.weightField]);
    t.bl.add(safeStr(r[schema.blField]));
  }
  A.byYear = Array.from(yearMap.values()).map(t => ({...t, bl: t.bl.size}))
    .sort((a,b) => String(a.year).localeCompare(String(b.year)));

  // Évolution N vs N-1
  if (A.byYear.length >= 2) {
    const cur = A.byYear[A.byYear.length-1], prev = A.byYear[A.byYear.length-2];
    A.evol = {
      year: cur.year, prevYear: prev.year,
      teuEvolPct: prev.teu > 0 ? ((cur.teu - prev.teu)/prev.teu*100) : null,
      weightEvolPct: prev.weight > 0 ? ((cur.weight - prev.weight)/prev.weight*100) : null,
      blEvolPct: prev.bl > 0 ? ((cur.bl - prev.bl)/prev.bl*100) : null
    };
  }

  // ============================================================
  // ANALYSE COMPARÉE N vs N-1 — bloc dédié
  // ============================================================
  if (A.byYear.length >= 2) {
    const curYear = A.byYear[A.byYear.length-1].year;
    const prevYear = A.byYear[A.byYear.length-2].year;

    // Helper : compare deux valeurs et retourne {prev, cur, delta, deltaPct}
    const cmpRow = (curV, prevV) => ({
      prev: prevV, cur: curV,
      delta: curV - prevV,
      deltaPct: prevV > 0 ? ((curV - prevV) / prevV * 100) : null
    });

    // ----- Totaux globaux par année -----
    const curRows = rows.filter(r => safeStr(r[schema.yearField]) === curYear);
    const prevRows = rows.filter(r => safeStr(r[schema.yearField]) === prevYear);
    const totals = (rs) => {
      const bls = new Set(), clients = new Set(), transit = new Set(), armat = new Set(), pays = new Set(), march = new Set();
      let teu = 0, weight = 0;
      for (const r of rs) {
        const bl = safeStr(r[schema.blField]); if (bl) bls.add(bl);
        if (!isEmptyValueGlobal(r[schema.clientField])) clients.add(safeStr(r[schema.clientField]));
        if (!isEmptyValueGlobal(r[schema.transitaireField])) transit.add(safeStr(r[schema.transitaireField]));
        if (!isEmptyValueGlobal(r[schema.armateurField])) armat.add(safeStr(r[schema.armateurField]));
        if (schema.paysOrigineField && !isEmptyValueGlobal(r[schema.paysOrigineField])) pays.add(safeStr(r[schema.paysOrigineField]));
        if (!isEmptyValueGlobal(r[schema.marchandiseField])) march.add(safeStr(r[schema.marchandiseField]));
        if (schema.teuField) teu += numVal(r[schema.teuField]);
        weight += numVal(r[schema.weightField]);
      }
      return { bl: bls.size, teu, weight, clients: clients.size, transitaires: transit.size, armateurs: armat.size, paysOrigine: pays.size, marchandises: march.size, rows: rs.length };
    };
    const cur = totals(curRows), prev = totals(prevRows);
    A.yoy = {
      curYear, prevYear,
      bl: cmpRow(cur.bl, prev.bl),
      teu: schema.teuField ? cmpRow(cur.teu, prev.teu) : null,
      weight: cmpRow(cur.weight, prev.weight),
      clients: cmpRow(cur.clients, prev.clients),
      transitaires: cmpRow(cur.transitaires, prev.transitaires),
      armateurs: cmpRow(cur.armateurs, prev.armateurs),
      paysOrigine: schema.paysOrigineField ? cmpRow(cur.paysOrigine, prev.paysOrigine) : null,
      marchandises: cmpRow(cur.marchandises, prev.marchandises)
    };

    // ----- Comparaison par segment (Conteneurisé / Conventionnel) -----
    const segByYear = (rs) => {
      const seg = { conteneurise: {bl:new Set(), teu:0, weight:0}, conventionnel: {bl:new Set(), teu:0, weight:0} };
      for (const r of rs) {
        const code = safeStr(r[schema.conditField]).toUpperCase();
        let bucket = null;
        if (CONTENEURISE_CODES.has(code)) bucket = seg.conteneurise;
        else if (CONVENTIONNEL_CODES.has(code)) bucket = seg.conventionnel;
        if (!bucket) continue;
        const bl = safeStr(r[schema.blField]); if (bl) bucket.bl.add(bl);
        if (schema.teuField) bucket.teu += numVal(r[schema.teuField]);
        bucket.weight += numVal(r[schema.weightField]);
      }
      return { conteneurise: { bl: seg.conteneurise.bl.size, teu: seg.conteneurise.teu, weight: seg.conteneurise.weight },
               conventionnel: { bl: seg.conventionnel.bl.size, teu: seg.conventionnel.teu, weight: seg.conventionnel.weight } };
    };
    if (schema.conditField) {
      const cs = segByYear(curRows), ps = segByYear(prevRows);
      A.yoy.segments = {
        conteneurise: {
          bl: cmpRow(cs.conteneurise.bl, ps.conteneurise.bl),
          teu: schema.teuField ? cmpRow(cs.conteneurise.teu, ps.conteneurise.teu) : null,
          weight: cmpRow(cs.conteneurise.weight, ps.conteneurise.weight)
        },
        conventionnel: {
          bl: cmpRow(cs.conventionnel.bl, ps.conventionnel.bl),
          teu: schema.teuField ? cmpRow(cs.conventionnel.teu, ps.conventionnel.teu) : null,
          weight: cmpRow(cs.conventionnel.weight, ps.conventionnel.weight)
        }
      };
    }

    // ----- Top éléments avec évolution YoY -----
    // Helper : agrège un champ par année, retourne map {key → {prev, cur}}
    const aggByYear = (field, opts={}) => {
      if (!field) return [];
      const map = new Map();
      for (const r of rows) {
        if (isEmptyValueGlobal(r[field])) continue;
        const key = safeStr(r[field]);
        const y = safeStr(r[schema.yearField]);
        const bl = safeStr(r[schema.blField]);
        if (y !== curYear && y !== prevYear) continue;
        let m = map.get(key);
        if (!m) { m = { key, prev: { bl: new Set(), teu: 0, weight: 0 }, cur: { bl: new Set(), teu: 0, weight: 0 } }; map.set(key, m); }
        const bucket = y === curYear ? m.cur : m.prev;
        if (bl) bucket.bl.add(bl);
        if (schema.teuField) bucket.teu += numVal(r[schema.teuField]);
        bucket.weight += numVal(r[schema.weightField]);
      }
      const sortMetric = opts.sortBy || (schema.teuField ? "teu" : "weight");
      const arr = Array.from(map.values()).map(m => {
        const pV = sortMetric === "bl" ? m.prev.bl.size : (sortMetric === "teu" ? m.prev.teu : m.prev.weight);
        const cV = sortMetric === "bl" ? m.cur.bl.size : (sortMetric === "teu" ? m.cur.teu : m.cur.weight);
        return {
          key: m.key,
          prevBL: m.prev.bl.size, curBL: m.cur.bl.size,
          prevTEU: m.prev.teu, curTEU: m.cur.teu,
          prevWeight: m.prev.weight, curWeight: m.cur.weight,
          prevMetric: pV, curMetric: cV,
          delta: cV - pV,
          deltaPct: pV > 0 ? ((cV - pV) / pV * 100) : (cV > 0 ? null : 0)  // null = "nouveau"
        };
      });
      arr.sort((a, b) => (b.curMetric || 0) - (a.curMetric || 0));
      return arr;
    };

    A.yoy.topClients = aggByYear(schema.clientField).slice(0, 15);
    A.yoy.topPaysOrigine = schema.paysOrigineField ? aggByYear(schema.paysOrigineField, { sortBy: "bl" }).slice(0, 10) : [];
    A.yoy.topMarchandises = aggByYear(schema.marchandiseField).slice(0, 15);
    A.yoy.topTransitaires = aggByYear(schema.transitaireField).slice(0, 10);
    A.yoy.topArmateurs = aggByYear(schema.armateurField).slice(0, 10);

    // Gagnants / Perdants (sur clients) — top évolutions absolues
    const movableClients = A.yoy.topClients.filter(c => c.prevMetric > 0 && c.deltaPct !== null);
    A.yoy.gagnantsPct = [...movableClients].sort((a,b) => b.deltaPct - a.deltaPct).slice(0, 5);
    A.yoy.perdantsPct = [...movableClients].sort((a,b) => a.deltaPct - b.deltaPct).slice(0, 5);
    A.yoy.nouveauxClients = A.yoy.topClients.filter(c => c.prevMetric === 0 && c.curMetric > 0).slice(0, 5);
    A.yoy.perdusClients = A.yoy.topClients.filter(c => c.curMetric === 0 && c.prevMetric > 0).slice(0, 5);
  } else {
    A.yoy = null;
  }

  // Concentration Pareto sur clients
  if (A.topClients.length > 0) {
    const totalMetric = schema.teuField ? totalTEU : totalWeight;
    let cum = 0;
    A.paretoClients = A.topClients.map(c => {
      const v = schema.teuField ? c.teu : c.weight;
      cum += v;
      return { ...c, cumPct: totalMetric > 0 ? cum/totalMetric*100 : 0 };
    });
    A.top5Share = A.paretoClients.length >= 5 ? A.paretoClients[4].cumPct : (A.paretoClients[A.paretoClients.length-1]?.cumPct || 0);
    A.top10Share = A.paretoClients.length >= 10 ? A.paretoClients[9].cumPct : (A.paretoClients[A.paretoClients.length-1]?.cumPct || 0);
  } else {
    A.paretoClients = []; A.top5Share = 0; A.top10Share = 0;
  }

  // ----- ZOOM AGL : PDM transitaire ----------------------------------
  // Détecte AGL parmi les transitaires (matching tolérant)
  const isAGL = (name) => {
    if (!name) return false;
    const s = String(name).toUpperCase();
    return s.includes("AFRICA GLOBAL LOGISTICS") || s.includes("AGL") || s.includes("BOLLORE TRANSPORT") || s.includes("BOLLORÉ TRANSPORT");
  };
  // Trouve la ligne AGL dans le tableau transitaires complet (non tronqué)
  const fullTransit = aggBy(schema.transitaireField, { sortBy: primarySort });
  const aglEntry = fullTransit.find(t => isAGL(t.key));
  const totalMet = schema.teuField ? totalTEU : totalWeight;
  if (aglEntry) {
    const aglMetric = schema.teuField ? aglEntry.teu : aglEntry.weight;
    const rank = fullTransit.findIndex(t => isAGL(t.key)) + 1;
    A.aglTransit = {
      name: aglEntry.key,
      rank,
      bl: aglEntry.bl,
      teu: aglEntry.teu,
      weight: aglEntry.weight,
      pdmMetric: totalMet > 0 ? aglMetric / totalMet * 100 : 0,
      pdmBL: A.nbBL > 0 ? aglEntry.bl / A.nbBL * 100 : 0,
      totalTransitaires: fullTransit.length
    };
    // Évolution AGL N vs N-1
    const aglByYear = new Map();
    for (const r of rows) {
      if (!isAGL(r[schema.transitaireField])) continue;
      const y = safeStr(r[schema.yearField]); if (!y) continue;
      let t = aglByYear.get(y);
      if (!t) { t = { year: y, teu: 0, weight: 0, bl: new Set() }; aglByYear.set(y, t); }
      if (schema.teuField) t.teu += numVal(r[schema.teuField]);
      t.weight += numVal(r[schema.weightField]);
      t.bl.add(safeStr(r[schema.blField]));
    }
    const aglYears = Array.from(aglByYear.values()).map(t => ({...t, bl: t.bl.size}))
      .sort((a,b) => String(a.year).localeCompare(String(b.year)));
    A.aglTransit.byYear = aglYears;
    if (aglYears.length >= 2) {
      const cur = aglYears[aglYears.length-1], prev = aglYears[aglYears.length-2];
      A.aglTransit.evol = {
        year: cur.year, prevYear: prev.year,
        teuEvolPct: prev.teu > 0 ? ((cur.teu - prev.teu)/prev.teu*100) : null,
        weightEvolPct: prev.weight > 0 ? ((cur.weight - prev.weight)/prev.weight*100) : null,
        blEvolPct: prev.bl > 0 ? ((cur.bl - prev.bl)/prev.bl*100) : null
      };
    }
  } else {
    A.aglTransit = null;
  }

  // ============================================================
  // FOCUS AGL par SEGMENT (Conteneurise / Conventionnel)
  // Pour chaque segment : volume AGL, PDM AGL, rang, evolution N vs N-1
  // ============================================================
  if (schema.teuField && schema.conditField) {
    const CONT_FILTER = new Set(["20F","20S","20TOP","40F","40S","40TOP","FLTANK","TANK"]);
    const CONV_FILTER = new Set(["BRBK","SACS","CARS","RORO","VRAC"]);
    const buildSegmentTransit = (codeSet) => {
      // Agrege par transitaire sur les rows du segment
      const map = new Map();
      let segTotalTeu = 0, segTotalWeight = 0;
      const blAGL = new Set();
      for (const r of rows) {
        const code = String(r[schema.conditField]||"").trim().toUpperCase();
        if (!codeSet.has(code)) continue;
        const trans = safeStr(r[schema.transitaireField]);
        if (!trans) continue;
        const teu = numVal(r[schema.teuField]);
        const w = numVal(r[schema.weightField]);
        segTotalTeu += teu;
        segTotalWeight += w;
        let m = map.get(trans);
        if (!m) { m = { key: trans, teu: 0, weight: 0, blSet: new Set() }; map.set(trans, m); }
        m.teu += teu;
        m.weight += w;
        const bl = safeStr(r[schema.blField]);
        if (bl) m.blSet.add(bl);
        if (isAGL(trans) && bl) blAGL.add(bl);
      }
      // Tri par TEU desc (conteneurise) ou Tonnes desc (conventionnel)
      const sortKey = codeSet === CONT_FILTER ? "teu" : "weight";
      const arr = Array.from(map.values())
        .map(m => ({ key: m.key, teu: m.teu, weight: m.weight, bl: m.blSet.size }))
        .sort((a, b) => b[sortKey] - a[sortKey]);
      const aglEntry = arr.find(t => isAGL(t.key));
      if (!aglEntry) return null;
      const aglRank = arr.findIndex(t => isAGL(t.key)) + 1;
      const aglMetric = sortKey === "teu" ? aglEntry.teu : aglEntry.weight;
      const segTotal = sortKey === "teu" ? segTotalTeu : segTotalWeight;
      const result = {
        name: aglEntry.key,
        rank: aglRank,
        bl: aglEntry.bl,
        teu: aglEntry.teu,
        weight: aglEntry.weight,
        pdmMetric: segTotal > 0 ? aglMetric / segTotal * 100 : 0,
        pdmBL: blAGL.size > 0 && arr.reduce((s,t)=>s+t.bl,0) > 0 ? blAGL.size / arr.reduce((s,t)=>s+t.bl,0) * 100 : 0,
        totalTransitaires: arr.length,
        segTotalTeu, segTotalWeight,
        sortKey
      };
      // Evolution N vs N-1 AGL sur le segment
      const aglByYear = new Map();
      for (const r of rows) {
        const code = String(r[schema.conditField]||"").trim().toUpperCase();
        if (!codeSet.has(code)) continue;
        if (!isAGL(r[schema.transitaireField])) continue;
        const y = safeStr(r[schema.yearField]); if (!y) continue;
        let t = aglByYear.get(y);
        if (!t) { t = { year: y, teu: 0, weight: 0, blSet: new Set() }; aglByYear.set(y, t); }
        t.teu += numVal(r[schema.teuField]);
        t.weight += numVal(r[schema.weightField]);
        t.blSet.add(safeStr(r[schema.blField]));
      }
      const aglYears = Array.from(aglByYear.values()).map(t => ({...t, bl: t.blSet.size, blSet: undefined}))
        .sort((a,b) => String(a.year).localeCompare(String(b.year)));
      result.byYear = aglYears;
      if (aglYears.length >= 2) {
        const cur = aglYears[aglYears.length-1], prev = aglYears[aglYears.length-2];
        result.evol = {
          year: cur.year, prevYear: prev.year,
          teuEvolPct: prev.teu > 0 ? ((cur.teu - prev.teu)/prev.teu*100) : null,
          weightEvolPct: prev.weight > 0 ? ((cur.weight - prev.weight)/prev.weight*100) : null,
          blEvolPct: prev.bl > 0 ? ((cur.bl - prev.bl)/prev.bl*100) : null
        };
      }
      return result;
    };
    A.aglTransitConteneurise = buildSegmentTransit(CONT_FILTER);
    A.aglTransitConventionnel = buildSegmentTransit(CONV_FILTER);
  } else {
    A.aglTransitConteneurise = null;
    A.aglTransitConventionnel = null;
  }

  // ============================================================
  // PDM AGL PAR DIMENSION (par client, par marchandise, par pays...)
  // Pour chaque valeur d'une dimension, on calcule :
  //   - total marché sur la dimension
  //   - part AGL (où AGL est le transitaire) sur cette dimension
  //   - PDM = part AGL / total marché
  //   - PDM N-1, et évolution
  // ============================================================
  function buildAGLPDMByField(field, withByYear) {
    if (!field) return new Map();
    // map[value] = { total: {prev, cur, all}, agl: {prev, cur, all}, byYear: Map<year, {tot, agl}> }  en TEU ou Tonnes
    const map = new Map();
    const curYear = A.byYear.length >= 2 ? A.byYear[A.byYear.length-1].year : null;
    const prevYear = A.byYear.length >= 2 ? A.byYear[A.byYear.length-2].year : null;
    for (const r of rows) {
      if (isEmptyValueGlobal(r[field])) continue;
      const key = safeStr(r[field]);
      const y = safeStr(r[schema.yearField]);
      const bucket = y === curYear ? "cur" : (y === prevYear ? "prev" : null);
      // NB : on n'exclut PLUS les rows hors cur/prev, pour permettre l'evolution multi-annees
      let entry = map.get(key);
      if (!entry) {
        entry = { total: { prev: { teu:0, weight:0 }, cur: { teu:0, weight:0 }, all: { teu:0, weight:0 } },
                  agl:   { prev: { teu:0, weight:0 }, cur: { teu:0, weight:0 }, all: { teu:0, weight:0 } },
                  byYear: withByYear ? new Map() : null };
        map.set(key, entry);
      }
      const teu = schema.teuField ? numVal(r[schema.teuField]) : 0;
      const w = numVal(r[schema.weightField]);
      entry.total.all.teu += teu; entry.total.all.weight += w;
      if (bucket) { entry.total[bucket].teu += teu; entry.total[bucket].weight += w; }
      const isAglRow = isAGL(r[schema.transitaireField]);
      if (isAglRow) {
        entry.agl.all.teu += teu; entry.agl.all.weight += w;
        if (bucket) { entry.agl[bucket].teu += teu; entry.agl[bucket].weight += w; }
      }
      // Par-annee : seulement si demande (eviter de gonfler les maps marchandise/pays/armateur)
      if (withByYear && y) {
        let yb = entry.byYear.get(y);
        if (!yb) { yb = { tot: { teu:0, weight:0 }, agl: { teu:0, weight:0 } }; entry.byYear.set(y, yb); }
        yb.tot.teu += teu; yb.tot.weight += w;
        if (isAglRow) { yb.agl.teu += teu; yb.agl.weight += w; }
      }
    }
    // Convertit en PDM%
    const result = new Map();
    for (const [key, e] of map.entries()) {
      const pdmAll = e.total.all.teu > 0 ? e.agl.all.teu / e.total.all.teu * 100 : (e.total.all.weight > 0 ? e.agl.all.weight / e.total.all.weight * 100 : 0);
      const pdmCur = e.total.cur.teu > 0 ? e.agl.cur.teu / e.total.cur.teu * 100 : (e.total.cur.weight > 0 ? e.agl.cur.weight / e.total.cur.weight * 100 : null);
      const pdmPrev = e.total.prev.teu > 0 ? e.agl.prev.teu / e.total.prev.teu * 100 : (e.total.prev.weight > 0 ? e.agl.prev.weight / e.total.prev.weight * 100 : null);
      // Évolution AGL : croissance de la part AGL (volume) entre N-1 et N
      const aglMetricCur = schema.teuField ? e.agl.cur.teu : e.agl.cur.weight;
      const aglMetricPrev = schema.teuField ? e.agl.prev.teu : e.agl.prev.weight;
      const aglEvolPct = aglMetricPrev > 0 ? ((aglMetricCur - aglMetricPrev) / aglMetricPrev * 100) : (aglMetricCur > 0 ? null : 0);
      // Serialise byYear en objet (year -> {tot, agl, pdm}) pour usage facile
      const byYearObj = {};
      const sortedYears = e.byYear ? Array.from(e.byYear.keys()).sort() : [];
      for (const y of sortedYears) {
        const yb = e.byYear.get(y);
        const totVol = schema.teuField ? yb.tot.teu : yb.tot.weight;
        const aglVol = schema.teuField ? yb.agl.teu : yb.agl.weight;
        byYearObj[y] = {
          totTeu: yb.tot.teu, totWeight: yb.tot.weight,
          aglTeu: yb.agl.teu, aglWeight: yb.agl.weight,
          totVol, aglVol,
          pdm: totVol > 0 ? (aglVol / totVol * 100) : null
        };
      }
      result.set(key, { pdmAll, pdmCur, pdmPrev, pdmDelta: (pdmCur !== null && pdmPrev !== null) ? (pdmCur - pdmPrev) : null, aglEvolPct,
                        aglVolCur: aglMetricCur, aglVolPrev: aglMetricPrev,
                        totalVolCur: schema.teuField ? e.total.cur.teu : e.total.cur.weight,
                        totalVolPrev: schema.teuField ? e.total.prev.teu : e.total.prev.weight,
                        aglTonsCur: e.agl.cur.weight, aglTonsPrev: e.agl.prev.weight,
                        totalTonsAll: e.total.all.weight, totalTeuAll: e.total.all.teu,
                        totalTonsCur: e.total.cur.weight, totalTeuCur: e.total.cur.teu,
                        totalTonsPrev: e.total.prev.weight, totalTeuPrev: e.total.prev.teu,
                        byYear: byYearObj, years: sortedYears });
    }
    return result;
  }
  // byYear active uniquement pour client (utilise par radar + multi-year evolution + Detail client)
  A.aglPdmByClient = buildAGLPDMByField(schema.clientField, true);
  A.aglPdmByMarchandise = buildAGLPDMByField(schema.marchandiseField, false);
  A.aglPdmByPays = schema.paysOrigineField ? buildAGLPDMByField(schema.paysOrigineField, false) : new Map();
  A.aglPdmByPaysDest = schema.paysDestField ? buildAGLPDMByField(schema.paysDestField, false) : new Map();
  A.aglPdmByArmateur = buildAGLPDMByField(schema.armateurField, false);

  // ============================================================
  // PRE-CALCULS (eviter de garder rows en memoire ensuite)
  // ============================================================
  // Seulement le pre-calcul LEGER : agregation par TRANSITAIRE (~hundreds d'entries)
  // Le calcul du principal concurrent par CLIENT (gros consommateur memoire :
  // jusqu'a Map<client, Map<trans, w>>) est differe — calcule a la demande
  // dans les composants qui le consomment, avec mise en cache via useMemo.
  {
    const curYear = A.byYear.length >= 2 ? A.byYear[A.byYear.length-1].year : null;
    const prevYear = A.byYear.length >= 2 ? A.byYear[A.byYear.length-2].year : null;
    const isAGLName = (s) => {
      const u = String(s||"").toUpperCase();
      return u.includes("AFRICA GLOBAL LOGISTICS") || u.includes("AGL") || u.includes("BOLLORE TRANSPORT") || u.includes("BOLLORÉ TRANSPORT");
    };
    const transitMap = new Map(); // trans -> { teuCur, teuPrev, tonsCur, tonsPrev, isAGL }
    for (const r of rows) {
      const transRaw = safeStr(r[schema.transitaireField]);
      if (!transRaw) continue;
      const y = safeStr(r[schema.yearField]);
      const bucket = y === curYear ? "cur" : (y === prevYear ? "prev" : null);
      if (!bucket) continue;
      const isAglRow = isAGLName(transRaw);
      const tkey = isAglRow ? "AGL" : transRaw;
      let e = transitMap.get(tkey);
      if (!e) { e = { teuCur:0, teuPrev:0, tonsCur:0, tonsPrev:0, isAGL: isAglRow }; transitMap.set(tkey, e); }
      const teu = schema.teuField ? numVal(r[schema.teuField]) : 0;
      const w = numVal(r[schema.weightField]);
      if (bucket === "cur") { e.teuCur += teu; e.tonsCur += w; }
      else { e.teuPrev += teu; e.tonsPrev += w; }
    }
    A.transitaireAgg = transitMap;
    // mainCompByClient supprime du pre-calcul (trop memoire) - calcule a la demande
    A.mainCompByClient = null;
  }

  // On supprime la reference aux rows brutes pour liberer la memoire
  A.rows = null;
  return A;
}

// ============================================================
// APPLICATION DES FILTRES (sur rows brutes) — RAPIDE
// ============================================================
function applyFilters(rows, filters) {
  // filters = { fieldName: Set<string> }
  const activeKeys = Object.keys(filters).filter(k => filters[k] && filters[k].size > 0);
  if (activeKeys.length === 0) return rows;
  return rows.filter(r => {
    for (const k of activeKeys) {
      const v = safeStr(r[k]);  // si vide, ne matchera aucun filtre actif → ligne exclue
      if (!filters[k].has(v)) return false;
    }
    return true;
  });
}

// Détecte si une valeur doit être exclue (version globale)
function isEmptyValueGlobal(v) {
  if (v === null || v === undefined) return true;
  const s = String(v).trim().toLowerCase();
  if (s === "") return true;
  if (s === "n/a" || s === "na" || s === "null" || s === "undefined") return true;
  if (s === "(non renseigné)" || s === "non renseigné" || s === "non renseigne") return true;
  if (s === "(non renseignée)" || s === "non renseignée" || s === "non renseignee") return true;
  if (s === "-" || s === "--" || s === ".") return true;
  return false;
}

// Détecte si une valeur pays/lieu correspond à la Côte d'Ivoire (toutes variantes)
function isCoteDIvoire(v) {
  if (isEmptyValueGlobal(v)) return false;
  const s = String(v).trim().toUpperCase()
    .replace(/[ÀÁÂÄÃ]/g, "A")
    .replace(/[ÈÉÊË]/g, "E")
    .replace(/[ÌÍÎÏ]/g, "I")
    .replace(/[ÒÓÔÖÕ]/g, "O")
    .replace(/[ÙÚÛÜ]/g, "U")
    .replace(/[Ç]/g, "C");
  // Variantes
  return s === "COTE D'IVOIRE" || s === "COTE D IVOIRE" || s === "COTE DIVOIRE" ||
         s === "IVORY COAST" || s === "IVORYCOAST" ||
         s === "CI" || s === "CIV" || s === "RCI" ||
         s === "REPUBLIQUE DE COTE D'IVOIRE" || s === "REPUBLIQUE DE COTE D IVOIRE" ||
         s.includes("COTE D") && s.includes("IVOIRE");
}

// ============================================================
// HINTERLAND ANALYSIS
// Pour IMPORT_MARITIME : sélectionne les rows où paysDest ≠ Côte d'Ivoire
// Pour EXPORT_MARITIME : sélectionne les rows où paysOrigine ≠ Côte d'Ivoire
// Puis applique buildAnalysis sur ce sous-ensemble pour avoir tops + PDM AGL + YoY
// Si des fichiers dédiés HINTERLAND_IMPORT / HINTERLAND_EXPORT sont chargés,
// la dérivation automatique est désactivée (les fichiers dédiés priment).
// ============================================================
function buildHinterlandAnalysis(metiersState) {
  const result = { importHinterland: null, exportHinterland: null };

  const dedicatedImport = metiersState?.HINTERLAND_IMPORT;
  const dedicatedExport = metiersState?.HINTERLAND_EXPORT;
  const hasDedicatedImport = dedicatedImport && Array.isArray(dedicatedImport.rows) && dedicatedImport.rows.length > 0;
  const hasDedicatedExport = dedicatedExport && Array.isArray(dedicatedExport.rows) && dedicatedExport.rows.length > 0;

  // IMPORT MARITIME → marchandises destinées hors CI (skip si fichier dédié chargé)
  const impMar = metiersState?.IMPORT_MARITIME;
  if (!hasDedicatedImport && impMar && Array.isArray(impMar.rows) && impMar.rows.length > 0) {
    const schema = METIER_SCHEMAS.IMPORT_MARITIME;
    const paysDestField = schema.paysDestField || "Pays de livraison";
    const filtered = impMar.rows.filter(r => {
      const v = r[paysDestField];
      return !isEmptyValueGlobal(v) && !isCoteDIvoire(v);
    });
    if (filtered.length > 0) {
      const A = buildAnalysis(filtered, schema);
      A._hinterlandSens = "import";
      A._hinterlandLabel = "Hinterland Import (marchandises en transit CI → pays enclavés)";
      A._hinterlandIcon = "🚛";
      A._originalCount = impMar.rows.length;
      A._filteredCount = filtered.length;
      result.importHinterland = A;
    }
  }

  // EXPORT MARITIME → marchandises issues hors CI (skip si fichier dédié chargé)
  const expMar = metiersState?.EXPORT_MARITIME;
  if (!hasDedicatedExport && expMar && Array.isArray(expMar.rows) && expMar.rows.length > 0) {
    const schema = METIER_SCHEMAS.EXPORT_MARITIME;
    const paysOrigField = schema.paysOrigineField || "Pays de prise en charge";
    const filtered = expMar.rows.filter(r => {
      const v = r[paysOrigField];
      return !isEmptyValueGlobal(v) && !isCoteDIvoire(v);
    });
    if (filtered.length > 0) {
      const A = buildAnalysis(filtered, schema);
      A._hinterlandSens = "export";
      A._hinterlandLabel = "Hinterland Export (marchandises de pays enclavés via CI)";
      A._hinterlandIcon = "🚛";
      A._originalCount = expMar.rows.length;
      A._filteredCount = filtered.length;
      result.exportHinterland = A;
    }
  }

  return result;
}

// Pré-indexation des valeurs distinctes par colonne (au moment du chargement)
function buildIndex(rows, schema) {
  const cols = getFilterableColumns(schema);
  const index = {};
  for (const c of cols) {
    const map = new Map();
    for (const r of rows) {
      if (isEmptyValueGlobal(r[c.field])) continue;  // ← on ignore les vides
      const v = safeStr(r[c.field]);
      map.set(v, (map.get(v) || 0) + 1);
    }
    index[c.field] = Array.from(map.entries()).map(([value, count]) => ({ value, count }))
      .sort((a,b) => b.count - a.count);
  }
  return index;
}

const NAVY = "0A2540", GOLD = "C9A14A", GRAY = "64748B", LIGHT = "F1F5F9";

// ---------- Insights textuels automatiques ----------
function buildInsights(A, schema) {
  const insights = [];
  if (A.empty) return insights;
  const unit = schema.teuField ? "TEU" : "tonnes";
  const totalUnit = schema.teuField ? A.totalTEU : A.totalWeight;
  insights.push(`Le périmètre analysé totalise ${fmt(A.nbBL)} ${schema.type==="maritime"?"BL":"LTA"} pour ${fmt(totalUnit, schema.teuField?0:2)} ${unit} et ${fmt(A.totalWeight,0)} kg, répartis entre ${A.nbClients} ${schema.clientLabel.toLowerCase()}s uniques.`);
  if (A.evol) {
    const trend = A.evol.teuEvolPct;
    if (trend !== null && schema.teuField) {
      const dir = trend > 0 ? "progression" : "recul";
      insights.push(`Trajectoire ${A.evol.year} vs ${A.evol.prevYear} : ${dir} de ${fmt(Math.abs(trend),1)} % en TEU.`);
    } else if (A.evol.weightEvolPct !== null) {
      const dir = A.evol.weightEvolPct > 0 ? "progression" : "recul";
      insights.push(`Trajectoire ${A.evol.year} vs ${A.evol.prevYear} : ${dir} de ${fmt(Math.abs(A.evol.weightEvolPct),1)} % en tonnage.`);
    }
  }
  if (A.top5Share > 0) {
    insights.push(`Concentration commerciale : le Top 5 ${schema.clientLabel.toLowerCase()}s capte ${fmt(A.top5Share,1)} % des volumes, et le Top 10 ${fmt(A.top10Share,1)} %.`);
  }
  if (A.topPaysOrigine.length > 0) {
    const lead = A.topPaysOrigine[0];
    insights.push(`Origine dominante : ${lead.key} (${fmt(lead.bl)} ${schema.type==="maritime"?"BL":"LTA"}, soit ${pct(lead.bl, A.nbBL)} du flux).`);
  }
  if (A.topTransitaires.length > 0) {
    const lead = A.topTransitaires[0];
    const leadShare = schema.teuField ? (lead.teu/Math.max(A.totalTEU,1)*100) : (lead.weight/Math.max(A.totalWeight,1)*100);
    insights.push(`Leader transit : ${lead.key} avec ${fmt(leadShare,1)} % des ${unit}.`);
  }
  // Insight PDM AGL
  if (A.aglTransit) {
    const a = A.aglTransit;
    let txt = `Position AGL : ${a.rank}e transitaire sur ${a.totalTransitaires}, PDM de ${fmt(a.pdmMetric,1)} % en ${unit} (${fmt(a.bl)} ${schema.type==="maritime"?"BL":"LTA"}, soit ${fmt(a.pdmBL,1)} % du nombre de dossiers)`;
    if (a.evol) {
      const v = schema.teuField ? a.evol.teuEvolPct : a.evol.weightEvolPct;
      if (v !== null && !isNaN(v)) txt += ` — évolution ${a.evol.year} vs ${a.evol.prevYear} : ${v >= 0 ? "+" : ""}${fmt(v,1)} %`;
    }
    txt += ".";
    insights.push(txt);
  }
  return insights;
}

      children.push(makeTable(headers, dataRows, schema.teuField ? [1872,1872,1872,1872,1872] : [2340,2340,2340,2340]));

    // 4.3 COMPARAISON N vs N-1
    if (A.yoy) {
      children.push(titleP(`4.3. Comparaison ${A.yoy.curYear} vs ${A.yoy.prevYear}`, 2));

      const evolFmt = (v) => v === null || isNaN(v) ? "—" : (v >= 0 ? "+" : "") + fmt(v, 1) + " %";
      const deltaFmt = (d) => (d >= 0 ? "+" : "") + fmt(d, 0);

      // Synthèse globale
      children.push(titleP("Synthèse globale", 3));
      const ghead = ["Indicateur", A.yoy.prevYear, A.yoy.curYear, "Δ Valeur", "Δ %"];
      const grows = [
        [`${blLabel} qualifiés`, fmt(A.yoy.bl.prev), fmt(A.yoy.bl.cur), deltaFmt(A.yoy.bl.delta), evolFmt(A.yoy.bl.deltaPct)],
        ...(A.yoy.teu ? [["TEU", fmt(A.yoy.teu.prev), fmt(A.yoy.teu.cur), deltaFmt(A.yoy.teu.delta), evolFmt(A.yoy.teu.deltaPct)]] : []),
        ["Tonnage (kg)", fmt(A.yoy.weight.prev,0), fmt(A.yoy.weight.cur,0), deltaFmt(A.yoy.weight.delta), evolFmt(A.yoy.weight.deltaPct)],
        [`${schema.clientLabel}s uniques`, fmt(A.yoy.clients.prev), fmt(A.yoy.clients.cur), deltaFmt(A.yoy.clients.delta), evolFmt(A.yoy.clients.deltaPct)],
        ["Transitaires actifs", fmt(A.yoy.transitaires.prev), fmt(A.yoy.transitaires.cur), deltaFmt(A.yoy.transitaires.delta), evolFmt(A.yoy.transitaires.deltaPct)],
        [schema.type==="maritime"?"Armateurs":"Compagnies", fmt(A.yoy.armateurs.prev), fmt(A.yoy.armateurs.cur), deltaFmt(A.yoy.armateurs.delta), evolFmt(A.yoy.armateurs.deltaPct)],
        ...(A.yoy.paysOrigine ? [["Pays d'origine", fmt(A.yoy.paysOrigine.prev), fmt(A.yoy.paysOrigine.cur), deltaFmt(A.yoy.paysOrigine.delta), evolFmt(A.yoy.paysOrigine.deltaPct)]] : []),
        ["Marchandises distinctes", fmt(A.yoy.marchandises.prev), fmt(A.yoy.marchandises.cur), deltaFmt(A.yoy.marchandises.delta), evolFmt(A.yoy.marchandises.deltaPct)]
      ];
      children.push(makeTable(ghead, grows, [3000,1500,1500,1700,1660]));

      // Par segment
      if (A.yoy.segments) {
        children.push(titleP("Évolution par segment marchandises", 3));
        const shead = ["Segment", "Indicateur", A.yoy.prevYear, A.yoy.curYear, "Δ %"];
        const srows = [
          ["Conteneurisé", blLabel, fmt(A.yoy.segments.conteneurise.bl.prev), fmt(A.yoy.segments.conteneurise.bl.cur), evolFmt(A.yoy.segments.conteneurise.bl.deltaPct)],
          ...(schema.teuField ? [["", "TEU", fmt(A.yoy.segments.conteneurise.teu.prev), fmt(A.yoy.segments.conteneurise.teu.cur), evolFmt(A.yoy.segments.conteneurise.teu.deltaPct)]] : []),
          ["", "Tonnes", fmt(A.yoy.segments.conteneurise.weight.prev,0), fmt(A.yoy.segments.conteneurise.weight.cur,0), evolFmt(A.yoy.segments.conteneurise.weight.deltaPct)],
          ["Conventionnel", blLabel, fmt(A.yoy.segments.conventionnel.bl.prev), fmt(A.yoy.segments.conventionnel.bl.cur), evolFmt(A.yoy.segments.conventionnel.bl.deltaPct)],
          ...(schema.teuField ? [["", "TEU", fmt(A.yoy.segments.conventionnel.teu.prev), fmt(A.yoy.segments.conventionnel.teu.cur), evolFmt(A.yoy.segments.conventionnel.teu.deltaPct)]] : []),
          ["", "Tonnes", fmt(A.yoy.segments.conventionnel.weight.prev,0), fmt(A.yoy.segments.conventionnel.weight.cur,0), evolFmt(A.yoy.segments.conventionnel.weight.deltaPct)]
        ];
        children.push(makeTable(shead, srows, [2200,1700,1500,1500,1460]));
      }

      // Top clients YoY
      if (A.yoy.topClients.length > 0) {
        children.push(titleP(`Top 10 ${schema.clientLabel}s — Évolution (${schema.teuField?"TEU":"Tonnes"})`, 3));
        const ch = ["#", schema.clientLabel, A.yoy.prevYear, A.yoy.curYear, "Δ %"];
        const cb = A.yoy.topClients.slice(0,10).map((c,i) => [i+1, c.key.substring(0,45),
          fmt(c.prevMetric,0), fmt(c.curMetric,0),
          c.deltaPct===null||isNaN(c.deltaPct) ? "NEW" : evolFmt(c.deltaPct)]);
        children.push(makeTable(ch, cb, [600,4400,1400,1400,1560]));
      }

      // Top pays origine YoY
      if (A.yoy.topPaysOrigine.length > 0) {
        children.push(titleP(`Top 10 pays d'origine — Évolution (${blLabel})`, 3));
        const ph = ["#", "Pays", A.yoy.prevYear, A.yoy.curYear, "Δ %"];
        const pb = A.yoy.topPaysOrigine.slice(0,10).map((c,i) => [i+1, c.key,
          fmt(c.prevBL), fmt(c.curBL),
          c.deltaPct===null||isNaN(c.deltaPct) ? "NEW" : evolFmt(c.deltaPct)]);
        children.push(makeTable(ph, pb, [600,4400,1400,1400,1560]));
      }

      // Top marchandises YoY
      if (A.yoy.topMarchandises.length > 0) {
        children.push(titleP(`Top 10 marchandises — Évolution (${schema.teuField?"TEU":"Tonnes"})`, 3));
        const mh = ["#", "Marchandise", A.yoy.prevYear, A.yoy.curYear, "Δ %"];
        const mb = A.yoy.topMarchandises.slice(0,10).map((c,i) => [i+1, c.key.substring(0,45),
          fmt(c.prevMetric,0), fmt(c.curMetric,0),

        children.push(makeTable(mh, mb, [600,4400,1400,1400,1560]));
      }

      // Top transitaires YoY
      if (A.yoy.topTransitaires.length > 0) {
        children.push(titleP(`Top 10 transitaires — Évolution (${schema.teuField?"TEU":"Tonnes"})`, 3));
        const th = ["#", "Transitaire", A.yoy.prevYear, A.yoy.curYear, "Δ %"];
        const tb = A.yoy.topTransitaires.slice(0,10).map((c,i) => [i+1, c.key.substring(0,45),
          fmt(c.prevMetric,0), fmt(c.curMetric,0),
          c.deltaPct===null||isNaN(c.deltaPct) ? "NEW" : evolFmt(c.deltaPct)]);
        children.push(makeTable(th, tb, [600,4400,1400,1400,1560]));
      }

      // Gagnants / Perdants
      if (A.yoy.gagnantsPct.length > 0) {

        const gb = A.yoy.gagnantsPct.map((c,i) => [i+1, c.key.substring(0,45), fmt(c.prevMetric,0), fmt(c.curMetric,0), evolFmt(c.deltaPct)]);

      }
      if (A.yoy.perdantsPct.length > 0) {

        const ph = ["#", schema.clientLabel, A.yoy.prevYear, A.yoy.curYear, "Δ %"];
        const pb = A.yoy.perdantsPct.map((c,i) => [i+1, c.key.substring(0,45), fmt(c.prevMetric,0), fmt(c.curMetric,0), evolFmt(c.deltaPct)]);
        children.push(makeTable(ph, pb, [600,4400,1400,1400,1560]));

    }

    // 5. Marchandises (segmentation conteneurisé / conventionnel)
    children.push(titleP("5. Marchandises : nature des flux", 1));

    // Bloc synthèse segmentation
    if (A.segments) {
      children.push(titleP("5.1. Segmentation conteneurisé vs conventionnel", 2));
      children.push(p(`Règle de classification appliquée (codes CODE_CONDIT) :`));
      children.push(p(`• Conteneurisé (TEU) : 20F, 20S, 20TOP, 40F, 40S, 40TOP, FLTANK, TANK`, { bold: false }));
      children.push(p(`• Conventionnel / Vrac (Tonnes) : BRBK, SACS, CARS, RORO, VRAC`, { bold: false }));
      const segHeaders = schema.teuField
        ? ["Segment", `Nb ${blLabel}`, "TEU", "Tonnes (kg)", `% ${blLabel}`]
        : ["Segment", `Nb ${blLabel}`, "Tonnes (kg)", `% ${blLabel}`];
      const segRows = [
        schema.teuField
          ? ["📦 Conteneurisé", fmt(A.segments.conteneurise.bl), fmt(A.segments.conteneurise.teu), fmt(A.segments.conteneurise.weight,0), pct(A.segments.conteneurise.bl, A.nbBL)]
          : ["📦 Conteneurisé", fmt(A.segments.conteneurise.bl), fmt(A.segments.conteneurise.weight,0), pct(A.segments.conteneurise.bl, A.nbBL)],
        schema.teuField
          ? ["⚓ Conventionnel / Vrac", fmt(A.segments.conventionnel.bl), fmt(A.segments.conventionnel.teu), fmt(A.segments.conventionnel.weight,0), pct(A.segments.conventionnel.bl, A.nbBL)]
          : ["⚓ Conventionnel / Vrac", fmt(A.segments.conventionnel.bl), fmt(A.segments.conventionnel.weight,0), pct(A.segments.conventionnel.bl, A.nbBL)]
      ];

    // 5.2 Top marchandises CONTENEURISÉES
    if (A.topMarchandisesConteneurise && A.topMarchandisesConteneurise.length > 0) {

        ? ["Rang", "Marchandise", `Nb ${blLabel}`, "TEU", "Tonnes"]

      const dataRows = A.topMarchandisesConteneurise.map((x, i) => schema.teuField
        ? [i+1, x.key.substring(0,60), fmt(x.bl), fmt(x.teu), fmt(x.weight,0)]
        : [i+1, x.key.substring(0,60), fmt(x.bl), fmt(x.weight,0)]);
      children.push(makeTable(headers, dataRows, schema.teuField ? [600,4500,1420,1420,1420] : [600,4900,1930,1930]));

    // 5.3 Top marchandises CONVENTIONNELLES
    if (A.topMarchandisesConventionnel && A.topMarchandisesConventionnel.length > 0) {
      children.push(titleP("5.3. Top 15 marchandises CONVENTIONNELLES (tri par tonnage)", 2));
      const headers = schema.teuField
        ? ["Rang", "Marchandise", `Nb ${blLabel}`, "TEU", "Tonnes"]
        : ["Rang", "Marchandise", `Nb ${blLabel}`, "Tonnes"];
      const dataRows = A.topMarchandisesConventionnel.map((x, i) => schema.teuField
        ? [i+1, x.key.substring(0,60), fmt(x.bl), fmt(x.teu), fmt(x.weight,0)]
        : [i+1, x.key.substring(0,60), fmt(x.bl), fmt(x.weight,0)]);
      children.push(makeTable(headers, dataRows, schema.teuField ? [600,4500,1420,1420,1420] : [600,4900,1930,1930]));
    }

    if (A.byCondit.length > 0) {
      children.push(titleP("5.4. Détail par conditionnement (CODE_CONDIT)", 2));
      children.push(makeTable(
        ["Type", `Nb ${blLabel}`, "% du total"],
        A.byCondit.slice(0, 10).map(x => [x.key, fmt(x.bl), pct(x.bl, A.nbBL)]),
        [4360, 2500, 2500]
      ));
    }
    if (A.byModeExp.length > 0) {
      children.push(titleP("5.5. Mode d'expédition", 2));
      children.push(makeTable(
        ["Mode", `Nb ${blLabel}`, "% du total"],
        A.byModeExp.slice(0, 10).map(x => [x.key, fmt(x.bl), pct(x.bl, A.nbBL)]),
        [4360, 2500, 2500]
      ));
    }

    // 6. Paysage concurrentiel
    children.push(titleP("6. Paysage concurrentiel", 1));
    if (A.topArmateurs.length > 0) {
      children.push(titleP(`6.1. Top ${schema.type==="maritime"?"armateurs":"compagnies aériennes"}`, 2));
      const headers = schema.teuField ? ["Rang", "Armateur", `Nb ${blLabel}`, "TEU", "% TEU"] : ["Rang", "Compagnie", `Nb ${blLabel}`, "Tonnes", "% Tonnes"];
      const totalMet = schema.teuField ? A.totalTEU : A.totalWeight;
      const dataRows = A.topArmateurs.map((x, i) => schema.teuField
        ? [i+1, x.key.substring(0,50), fmt(x.bl), fmt(x.teu), pct(x.teu, totalMet)]
        : [i+1, x.key.substring(0,50), fmt(x.bl), fmt(x.weight,0), pct(x.weight, totalMet)]);
      children.push(makeTable(headers, dataRows, [600,4400,1420,1500,1440]));
    }
    if (A.topTransitaires.length > 0) {
      children.push(titleP("6.2. Top transitaires", 2));
      const totalMet = schema.teuField ? A.totalTEU : A.totalWeight;
      const headers = schema.teuField ? ["Rang", "Transitaire", `Nb ${blLabel}`, "TEU", "% TEU"] : ["Rang", "Transitaire", `Nb ${blLabel}`, "Tonnes", "% Tonnes"];
      const dataRows = A.topTransitaires.map((x, i) => schema.teuField
        ? [i+1, x.key.substring(0,50), fmt(x.bl), fmt(x.teu), pct(x.teu, totalMet)]
        : [i+1, x.key.substring(0,50), fmt(x.bl), fmt(x.weight,0), pct(x.weight, totalMet)]);
      children.push(makeTable(headers, dataRows, [600,4400,1420,1500,1440]));
    }

    // 6.3 Zoom AGL Transitaire
    if (A.aglTransit) {
      const a = A.aglTransit;
      children.push(titleP("6.3. Zoom Africa Global Logistics (Transitaire)", 2));
      const aglIntro = `AGL occupe le rang n°${a.rank} sur ${a.totalTransitaires} transitaires identifiés sur ce périmètre. Sa part de marché s'établit à ${fmt(a.pdmMetric,1)} % en ${schema.teuField?"TEU":"tonnes"} et ${fmt(a.pdmBL,1)} % en nombre de ${blLabel}.`;
      children.push(p(aglIntro));
      children.push(insightBox(`▸ Position AGL : ${fmt(a.pdmMetric,1)} % de PDM en ${schema.teuField?"TEU":"tonnes"} | ${fmt(a.bl)} ${blLabel} traités | ${fmt(a.pdmBL,1)} % des dossiers du marché`));
      // Tableau récap AGL
      const aglHeaders = schema.teuField ? ["Indicateur", "Valeur AGL", "Marché total", "Part AGL"] : ["Indicateur", "Valeur AGL", "Marché total", "Part AGL"];
      const aglRows = [
        [`${blLabel} traités`, fmt(a.bl), fmt(A.nbBL), pct(a.bl, A.nbBL)],
      ];
      if (schema.teuField) aglRows.push(["TEU", fmt(a.teu), fmt(A.totalTEU), pct(a.teu, A.totalTEU)]);
      aglRows.push(["Tonnage (kg)", fmt(a.weight,0), fmt(A.totalWeight,0), pct(a.weight, A.totalWeight)]);
      children.push(makeTable(aglHeaders, aglRows, [3000,2200,2200,1960]));

      // Évolution AGL N vs N-1
      if (a.byYear && a.byYear.length > 0) {
        children.push(titleP("Évolution annuelle AGL", 3));
        const evolHeaders = schema.teuField ? ["Année", `Nb ${blLabel}`, "TEU", "Tonnes"] : ["Année", `Nb ${blLabel}`, "Tonnes"];
        const evolRows = a.byYear.map(y => schema.teuField ? [y.year, fmt(y.bl), fmt(y.teu), fmt(y.weight,0)] : [y.year, fmt(y.bl), fmt(y.weight,0)]);
        children.push(makeTable(evolHeaders, evolRows, schema.teuField ? [2340,2340,2340,2340] : [3120,3120,3120]));
        if (a.evol) {
          const v = schema.teuField ? a.evol.teuEvolPct : a.evol.weightEvolPct;
          const vBL = a.evol.blEvolPct;
          if (v !== null && !isNaN(v)) {
            const dir = v >= 0 ? "progression" : "recul";

          }
        }
      }
    }

    // 7. Clients
    children.push(titleP(`7. ${schema.clientLabel}s : segmentation`, 1));
    if (A.top5Share > 0) {
      children.push(p(`Top 5 ${schema.clientLabel.toLowerCase()}s = ${fmt(A.top5Share,1)} % des volumes. Top 10 ${schema.clientLabel.toLowerCase()}s = ${fmt(A.top10Share,1)} %.`, { bold: true }));
    }
    if (A.topClients.length > 0) {
      children.push(titleP(`7.1. Top 20 ${schema.clientLabel.toLowerCase()}s`, 2));
      const totalMet = schema.teuField ? A.totalTEU : A.totalWeight;
      const headers = schema.teuField ? ["Rang", schema.clientLabel, `Nb ${blLabel}`, "TEU", "% TEU", "Cum. %"] : ["Rang", schema.clientLabel, `Nb ${blLabel}`, "Tonnes", "% Tonnes", "Cum. %"];
      const dataRows = A.paretoClients.slice(0, 20).map((x, i) => schema.teuField
        ? [i+1, x.key.substring(0,40), fmt(x.bl), fmt(x.teu), pct(x.teu, totalMet), fmt(x.cumPct,1)+" %"]

      children.push(makeTable(headers, dataRows, [500,3500,1100,1400,1330,1530]));
    }
    if (A.topLieuxLiv.length > 0) {
      children.push(titleP("7.2. Lieux de livraison", 2));
      const totalMet = schema.teuField ? A.totalTEU : A.totalWeight;
      const headers = schema.teuField ? ["Lieu de livraison", `Nb ${blLabel}`, "TEU", "% TEU"] : ["Lieu de livraison", `Nb ${blLabel}`, "Tonnes", "% Tonnes"];
      const dataRows = A.topLieuxLiv.map(x => schema.teuField
        ? [x.key.substring(0,50), fmt(x.bl), fmt(x.teu), pct(x.teu, totalMet)]

      children.push(makeTable(headers, dataRows, [4360,1500,1750,1750]));
    }

    if (mi < analyses.length - 1) children.push(new Paragraph({ children: [new PageBreak()] }));
  }

  // Footer
  children.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { before: 600 }, children: [new TextRun({ text: "— Fin du rapport —", italics: true, color: GRAY, font: "Calibri", size: 20 })] }));
  children.push(new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: "Confidentiel — Usage interne AGL / COMEX", italics: true, color: GRAY, font: "Calibri", size: 18 })] }));

  const doc = new Document({
    styles: { default: { document: { run: { font: "Calibri", size: 22 } } } },
    sections: [{ properties: { page: { size: { width: 12240, height: 15840 }, margin: { top: 1440, right: 1440, bottom: 1440, left: 1440 } } }, children }]
  });
  const blob = await Packer.toBlob(doc);
  saveAs(blob, options.filename + ".docx");
}

// ---------- PDF ----------
function generatePDF(analyses, options) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
  // Vérification que le plugin autoTable est bien chargé
  if (typeof doc.autoTable !== "function") {
    throw new Error("Plugin jspdf-autotable non chargé. Vérifiez votre connexion Internet (les CDN sont nécessaires au premier chargement de l'app).");
  }
  const pageW = 210, margin = 15;
  let y = margin;

  const addHeader = () => {
    doc.setFillColor(10, 37, 64);
    doc.rect(0, 0, pageW, 12, "F");
    doc.setFillColor(201, 161, 74);
    doc.rect(0, 12, pageW, 1, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(255,255,255);
    doc.text("AGL — DIRECTION STRATÉGIE", margin, 8);
    doc.setTextColor(255,255,255); doc.setFontSize(8);
    doc.text(options.title || "Analyse STATCOM", pageW - margin, 8, { align: "right" });
  };
  const addFooter = () => {
    const h = 297;
    doc.setFillColor(241, 245, 249);
    doc.rect(0, h-10, pageW, 10, "F");
    doc.setFontSize(8); doc.setTextColor(100,116,139);
    doc.text("Confidentiel — Usage interne AGL / COMEX", margin, h-4);
    doc.text(`Page ${doc.internal.getNumberOfPages()}`, pageW - margin, h-4, { align: "right" });
  };
  const newPage = () => { doc.addPage(); y = margin + 8; addHeader(); };
  const ensureSpace = (need) => { if (y + need > 275) newPage(); };
  const title = (text, size=18) => {
    ensureSpace(15);
    doc.setFont("helvetica","bold"); doc.setFontSize(size); doc.setTextColor(10,37,64);
    doc.text(text, margin, y); y += size*0.5 + 2;
    doc.setDrawColor(201, 161, 74); doc.setLineWidth(0.7);
    doc.line(margin, y, margin + 50, y); y += 5;
  };
  const subtitle = (text) => {
    ensureSpace(8);
    doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(10,37,64);
    doc.text(text, margin, y); y += 6;
  };
  const para = (text) => {
    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(51,51,51);
    const lines = doc.splitTextToSize(text, pageW - 2*margin);
    ensureSpace(lines.length*5 + 2);
    doc.text(lines, margin, y); y += lines.length*5 + 2;
  };
  const insightBox = (text) => {
    doc.setFont("helvetica","normal"); doc.setFontSize(10);
    const lines = doc.splitTextToSize(text, pageW - 2*margin - 8);
    const h = lines.length*5 + 6;
    ensureSpace(h+4);
    doc.setFillColor(254, 249, 231);
    doc.rect(margin, y, pageW - 2*margin, h, "F");
    doc.setFillColor(201, 161, 74);
    doc.rect(margin, y, 2, h, "F");
    doc.setTextColor(51, 51, 51);
    doc.text(lines, margin+5, y+5);
    y += h + 4;
  };

  // Page de garde
  addHeader();
  y = 50;
  doc.setFont("helvetica","bold"); doc.setFontSize(26); doc.setTextColor(10,37,64);
  doc.text("AFRICA GLOBAL LOGISTICS", pageW/2, y, { align:"center" }); y += 12;
  doc.setFontSize(14); doc.setTextColor(201,161,74);
  doc.text("DIRECTION MARKETING — DIVISION STRATÉGIE", pageW/2, y, { align:"center" }); y += 20;
  doc.setFontSize(12); doc.setTextColor(80,80,80);
  doc.text("ÉTUDE STRATÉGIQUE", pageW/2, y, { align:"center" }); y += 12;
  doc.setFontSize(20); doc.setTextColor(10,37,64);
  doc.text(options.title || "Analyse des flux STATCOM", pageW/2, y, { align:"center" }); y += 10;
  if (options.subtitle) {
    doc.setFontSize(11); doc.setFont("helvetica","italic"); doc.setTextColor(80,80,80);
    const subLines = doc.splitTextToSize(options.subtitle, pageW - 40);

  }
  y += 30;
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(80,80,80);
  doc.text("Source : Base STATCOM — Africa Global Logistics", pageW/2, y, { align:"center" }); y += 8;
  const today = new Date().toLocaleDateString("fr-FR", { year:"numeric", month:"long", day:"numeric" });
  doc.setFont("helvetica","bold"); doc.setFontSize(11);
  doc.text(`${today} | Abidjan, Côte d'Ivoire`, pageW/2, y, { align:"center" }); y += 8;
  doc.setFont("helvetica","italic"); doc.setFontSize(9);
  doc.text("Document confidentiel — Usage interne AGL / COMEX", pageW/2, y, { align:"center" });
  addFooter();

  // Sections par métier
  for (let mi = 0; mi < analyses.length; mi++) {
    const A = analyses[mi];
    if (A.empty) continue;
    const schema = A.schema;
    const unit = schema.teuField ? "TEU" : "tonnes";
    const totalUnit = schema.teuField ? A.totalTEU : A.totalWeight;
    const blLabel = schema.type === "maritime" ? "BL" : "LTA";
    const totalMet = schema.teuField ? A.totalTEU : A.totalWeight;
    newPage();
    if (analyses.length > 1) title(`PARTIE ${mi+1} — ${schema.label.toUpperCase()}`, 16);

    title("1. Résumé exécutif");
    para(`L'étude porte sur ${fmt(A.nbBL)} ${blLabel} extraits de la base STATCOM, totalisant ${fmt(totalUnit, schema.teuField?0:2)} ${unit} et ${fmt(A.totalWeight,0)} kg de marchandises. Le périmètre couvre ${A.nbClients} ${schema.clientLabel.toLowerCase()}s uniques, ${A.nbTransitaires} transitaires actifs et ${A.nbArmateurs} ${schema.type==="maritime"?"armateurs":"compagnies"}.`);
    buildInsights(A, schema).forEach(ins => insightBox(ins));

    title("2. Méthodologie et périmètre");
    const periodes = A.byYear.map(y => y.year).join(", ");
    para(`Source : base STATCOM AGL — métier ${schema.label}. ${fmt(A.nbRows)} enregistrements bruts agrégés en ${fmt(A.nbBL)} ${blLabel} uniques.${periodes?" Période couverte : "+periodes+".":""} Sens du flux : ${schema.sens === "import" ? "Imports" : "Exports"}. Métrique principale : ${schema.teuField ? "TEU + Tonnes" : "Tonnes"}.`);

    title("3. Cartographie du corridor");
    if (A.topPortsCharg.length > 0) {
      subtitle(`3.1. Top ${schema.type==="maritime"?"ports":"aéroports"} de chargement`);
      doc.autoTable({
        startY: y,
        head: [["Rang", schema.type==="maritime"?"Port":"Aéroport", `Nb ${blLabel}`, "% du total"]],
        body: A.topPortsCharg.slice(0, 10).map((x, i) => [i+1, x.key, fmt(x.bl), pct(x.bl, A.nbBL)]),
        theme: "grid", styles: { font:"helvetica", fontSize: 9, cellPadding: 2 },
        headStyles: { fillColor: [10,37,64], textColor:[255,255,255], fontStyle:"bold" },
        alternateRowStyles: { fillColor: [248,250,252] }, margin: { left: margin, right: margin }
      });
      y = doc.lastAutoTable.finalY + 5;
    }
    if (A.topPortsDech.length > 0) {
      ensureSpace(40);
      subtitle(`3.2. Top ${schema.type==="maritime"?"ports":"aéroports"} de déchargement`);
      doc.autoTable({
        startY: y, head: [["Rang", schema.type==="maritime"?"Port":"Aéroport", `Nb ${blLabel}`, "% du total"]],
        body: A.topPortsDech.slice(0, 10).map((x, i) => [i+1, x.key, fmt(x.bl), pct(x.bl, A.nbBL)]),
        theme: "grid", styles: { font:"helvetica", fontSize: 9, cellPadding: 2 },
        headStyles: { fillColor: [10,37,64], textColor:[255,255,255], fontStyle:"bold" },
        alternateRowStyles: { fillColor: [248,250,252] }, margin: { left: margin, right: margin }
      });
      y = doc.lastAutoTable.finalY + 5;
    }
    if (A.topPaysOrigine.length > 0) {
      ensureSpace(40); subtitle("3.3. Origines géographiques");
      doc.autoTable({ startY: y, head: [["Rang", "Pays d'origine", `Nb ${blLabel}`, "% du total"]],
        body: A.topPaysOrigine.slice(0, 10).map((x,i) => [i+1, x.key, fmt(x.bl), pct(x.bl, A.nbBL)]),
        theme:"grid", styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[10,37,64],textColor:[255,255,255],fontStyle:"bold"},
        alternateRowStyles:{fillColor:[248,250,252]}, margin:{left:margin,right:margin}});
      y = doc.lastAutoTable.finalY + 5;
    }
    if (A.topPaysDest.length > 0) {
      ensureSpace(40); subtitle("3.4. Destinations géographiques");
      doc.autoTable({ startY: y, head: [["Rang", "Pays de destination", `Nb ${blLabel}`, "% du total"]],
        body: A.topPaysDest.slice(0, 10).map((x,i) => [i+1, x.key, fmt(x.bl), pct(x.bl, A.nbBL)]),
        theme:"grid", styles:{font:"helvetica",fontSize:9,cellPadding:2}, headStyles:{fillColor:[10,37,64],textColor:[255,255,255],fontStyle:"bold"},
        alternateRowStyles:{fillColor:[248,250,252]}, margin:{left:margin,right:margin}});
      y = doc.lastAutoTable.finalY + 5;
    }

    ensureSpace(40); title("4. Volumétrie et dynamique temporelle");
    if (A.byYear.length > 0) {
      subtitle("4.1. Évolution annuelle");
